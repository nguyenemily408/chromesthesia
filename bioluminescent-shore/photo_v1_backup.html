const IMG_W = 1672, IMG_H = 780;

const VERT = `#version 300 es
void main(){
  vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  gl_Position = vec4(p*2.-1., 0., 1.);
}`;

// Draws the photo, but slides the water toward the shore, makes the glow
// surge in travelling bands, and makes the tiny bright specks twinkle.
const FRAG = `#version 300 es
precision highp float;
uniform sampler2D uImg;
uniform float uTime, uScale;
uniform vec2 uCanvas, uOff;
const vec2 IMG  = vec2(1672., 780.);
const vec2 FLOW = vec2(-0.535, 0.845);     // direction the waves travel (toward the sand)
out vec4 o;

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
vec3 img(vec2 p){ return texture(uImg, clamp(p/IMG, 0.001, 0.999)).rgb; }
float glowOf(vec3 c){ return max(c.g, c.b); }

void main(){
  vec2 fp = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y);
  vec2 p = (fp - uOff)/uScale;
  if(p.x < 0. || p.y < 0. || p.x > IMG.x || p.y > IMG.y){ o = vec4(0.,0.,0.,1.); return; }

  // How far this spot is from the sand (0 = dry sand, 1 = open water).
  float sd = dot(p - vec2(0.,178.), vec2(0.535,-0.845));
  float m = smoothstep(-30., 70., sd);

  float sc = dot(p, FLOW);
  float soft = glowOf(textureLod(uImg, p/IMG, 4.).rgb);

  // Gentle rise and fall of the swell.
  vec2 q = p + FLOW*sin(sc*0.018 - uTime*1.1 + noise(p*0.004)*4.)*3.5*m;

  // Slide the water toward the shore; bright breaking water moves fastest.
  vec2 fl = FLOW*m*(14. + 42.*smoothstep(0.1,0.6,soft));
  float ph = uTime/3.6 + noise(p*0.006);
  float p1 = fract(ph), p2 = fract(ph+0.5);
  vec3 c = mix(img(q - fl*(p1-0.5)), img(q - fl*(p2-0.5)), abs(2.*p1-1.));

  // Glow surges that roll in with each wave.
  float band = pow(0.5+0.5*sin(6.2832*(sc/560. - uTime/5.0)), 2.);
  float h = smoothstep(0.2, 0.75, glowOf(c));
  float w = max(m, 0.4);
  c = mix(c, c*mix(0.6,1.8,band), h*w);
  c += vec3(0.,0.22,0.38)*h*h*band*0.35*m;

  // Twinkle the tiny bright specks.
  float d = max(0., glowOf(c) - glowOf(textureLod(uImg, q/IMG, 3.).rgb));
  float hs = noise(p*0.4);
  float tw = 0.5+0.5*sin(uTime*(2.+4.*hs) + hs*70.);
  c *= 1. + smoothstep(0.05,0.3,d)*(tw*1.0-0.3);

  o = vec4(max(c,0.), 1.);
}`;

// Spray droplets.
const PVERT = `#version 300 es
in vec2 aPos; in float aSize; in float aAlpha;
uniform float uScale; uniform vec2 uCanvas, uOff;
out float vA;
void main(){
  vec2 s = aPos*uScale + uOff;
  gl_Position = vec4(s.x/uCanvas.x*2.-1., 1.-s.y/uCanvas.y*2., 0., 1.);
  gl_PointSize = max(1.5, aSize*uScale);
  vA = aAlpha;
}`;
const PFRAG = `#version 300 es
precision highp float;
in float vA; out vec4 o;
void main(){
  float a = smoothstep(0.5, 0.05, length(gl_PointCoord-0.5));
  o = vec4(mix(vec3(0.05,0.45,1.), vec3(0.6,1.,1.), vA)*a*vA, 1.);
}`;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });

function prog(vs, fs){
  const p = gl.createProgram();
  for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); }
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); throw new Error('link'); }
  return p;
}
const U = (p, n) => gl.getUniformLocation(p, n);
const photoProg = prog(VERT, FRAG), sprayProg = prog(PVERT, PFRAG);
const quadVAO = gl.createVertexArray();

// Spray particles: [x, y, size, alpha] each.
const MAX = 3500;
const data = new Float32Array(MAX*4);
const parts = [];
const sprayVAO = gl.createVertexArray(), sprayBuf = gl.createBuffer();
gl.bindVertexArray(sprayVAO);
gl.bindBuffer(gl.ARRAY_BUFFER, sprayBuf);
gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
[['aPos',2,0],['aSize',1,8],['aAlpha',1,12]].forEach(([n,size,off]) => {
  const loc = gl.getAttribLocation(sprayProg, n);
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 16, off);
});

// Where the waves break in the photo (start point, end point, strength).
const EMITTERS = [
  { a: [950, 240], b: [1250, 175], power: 1.0 },
  { a: [200,  90], b: [ 420,  50], power: 0.6 },
  { a: [1500, 430], b: [1672, 380], power: 0.7 },
  { a: [640, 300], b: [ 900, 262], power: 0.35 },
];
const FLOW = [-0.535, 0.845];
function surge(x, y, t){
  const sc = x*FLOW[0] + y*FLOW[1];
  return Math.pow(0.5+0.5*Math.sin(6.2832*(sc/560 - t/5.0)), 2);
}
function stepSpray(t, dt){
  for (const e of EMITTERS) {
    const cx = (e.a[0]+e.b[0])/2, cy = (e.a[1]+e.b[1])/2;
    const s = surge(cx, cy, t - 0.25);
    let n = e.power*(Math.pow(s, 4)*900 + 25)*dt;
    n = Math.floor(n) + (Math.random() < n % 1 ? 1 : 0);
    for (let i = 0; i < n && parts.length < MAX; i++) {
      const k = Math.random(), big = Math.random();
      parts.push({
        x: e.a[0] + (e.b[0]-e.a[0])*k + (Math.random()-0.5)*40,
        y: e.a[1] + (e.b[1]-e.a[1])*k + (Math.random()-0.5)*30,
        vx: -30 - Math.random()*150, vy: -50 - Math.random()*230*(0.5+s),
        life: 0, max: 0.5 + Math.random()*1.1,
        size: 1.6 + big*big*3.2,
      });
    }
  }
  let n = 0;
  for (let i = parts.length-1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life > p.max) { parts[i] = parts[parts.length-1]; parts.pop(); continue; }
    p.vy += 330*dt; p.vx *= 1 - 0.6*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  for (const p of parts) {
    const f = p.life/p.max;
    data[n++] = p.x; data[n++] = p.y; data[n++] = p.size; data[n++] = Math.min(1, f*8)*(1-f)*(1-f);
  }
  return parts.length;
}

let scale = 1, offX = 0, offY = 0;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(innerWidth*dpr)), h = Math.max(2, Math.round(innerHeight*dpr));
  canvas.width = w; canvas.height = h;
  // Fill the screen on wide windows; show the whole photo on tall ones.
  const fill = w/h > 1.3;
  scale = fill ? Math.max(w/IMG_W, h/IMG_H) : Math.min(w/IMG_W, h/IMG_H);
  offX = (w - IMG_W*scale)/2; offY = (h - IMG_H*scale)/2;
}
addEventListener('resize', resize); resize();

const tex = gl.createTexture();
const image = new Image();
image.onload = () => {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  requestAnimationFrame(frame);
};
image.src = PHOTO;

let last = performance.now(), time = 0;
function setView(p){
  gl.uniform1f(U(p,'uScale'), scale);
  gl.uniform2f(U(p,'uCanvas'), canvas.width, canvas.height);
  gl.uniform2f(U(p,'uOff'), offX, offY);
}
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now; time += dt;
  gl.viewport(0, 0, canvas.width, canvas.height);

  gl.disable(gl.BLEND);
  gl.useProgram(photoProg); gl.bindVertexArray(quadVAO);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U(photoProg,'uImg'), 0);
  gl.uniform1f(U(photoProg,'uTime'), time);
  setView(photoProg);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const count = stepSpray(time, dt);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(sprayProg); gl.bindVertexArray(sprayVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, sprayBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, count*4));
  setView(sprayProg);
  gl.drawArrays(gl.POINTS, 0, count);

  requestAnimationFrame(frame);
}
</script>
</body>
