<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioluminescent Shore</title>
<style>
  html, body { margin: 0; height: 100%; background: #01030a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  #hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    font: 500 13px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(150, 220, 255, 0.6); pointer-events: none;
    transition: opacity 1.2s ease; white-space: nowrap;
  }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #9cdcff; font: 16px -apple-system, Arial, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Drag across the water</div>
<div id="err">This animation needs WebGL 2, which this browser does not support.</div>

<script>
// ---------------------------------------------------------------------------
// Shared scene code: where the shoreline is, where the waves are, and how
// strongly each spot is being "disturbed" (which is what makes it glow).
// ---------------------------------------------------------------------------
const COMMON = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime;

const float HOR = 0.36;      // horizon height on screen
const float CAM = 5.0;       // camera height above the beach
const vec2  SEA = vec2(0.8, 0.6);  // direction pointing out to sea
const float S0  = 4.6;       // where the average waterline sits
const float K   = 1.2566;    // wave spacing
const float W   = 1.05;      // wave speed

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.03+17.1; a*=.5; } return v; }

// Project a screen point onto the flat beach.
bool ground(vec2 uv, out vec2 w, out float dist){
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y, 1.);
  float down = HOR - p.y;
  if(down < 0.004) return false;
  float k = CAM/down;
  w = vec2(p.x, 1.15)*k;
  dist = k*length(vec3(p.x, down, 1.15));
  return true;
}

float warp(float a, float t){ return (fbm(vec2(a*0.22, t*0.04))-0.47)*4.0; }

// How far up the sand the water's edge is right now.
float edgePos(float a, float t){
  float wp  = warp(a,t);
  float lob = (fbm(vec2(a*0.55+5., t*0.06))-0.47)*1.6;
  return lob - 0.9*sin(t*W + wp*K - 0.9) - 0.3*sin(t*W*0.37 + a*0.3);
}

float gD, gCrest, gExc, gA, gS, gEnv, gAdv;

void shore(vec2 w, float t){
  gS = dot(w,SEA) - S0;
  gA = dot(w, vec2(-SEA.y, SEA.x));
  float E  = edgePos(gA,t);
  float E0 = edgePos(gA,t-0.12);
  gD = gS - E;                                // > 0 means under water
  gAdv = clamp((E0-E)*5., 0., 1.);            // water pushing up the sand
  float wp = warp(gA,t);
  float ph = (gS+wp)*K + t*W;
  gCrest = pow(0.5+0.5*sin(ph), 7.);          // travelling wave crests
  gEnv = smoothstep(0.2,2.2,gD)*smoothstep(17.,6.,gD);   // where waves break
  float tex = fbm(vec2(gA*1.4, gS*1.4 + t*0.9));
  float water = step(0., gD);
  float edge = exp(-gD*gD*22.)*(0.42 + 0.75*gAdv);
  float fine = fbm(vec2(gA*4.0, gS*2.0 + t*1.6));
  float sharp = pow(gCrest, 2.2);
  float brk  = gEnv*(sharp*(0.6 + 0.5*smoothstep(0.3,0.7,fine)) + gCrest*0.35*smoothstep(0.45,0.75,tex));
  float swell = gCrest*0.07*smoothstep(0.5,3.,gD);
  float wash = (1.-smoothstep(0.,1.6,gD))*gAdv*smoothstep(0.35,0.7,tex)*0.8;
  gExc = clamp(edge + water*(brk + swell + wash), 0., 1.);
}
`;

const VERT = `#version 300 es
void main(){
  vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  gl_Position = vec4(p*2.-1., 0., 1.);
}`;

// ---------------------------------------------------------------------------
// Pass 1: the "memory" of the glow. Each frame the old glow fades a little
// and new glow is added wherever the water is being disturbed.
// Red = glow amount, Green = how wet the sand is.
// ---------------------------------------------------------------------------
const SIM = COMMON + `
uniform sampler2D uPrev;
uniform float uDt;
uniform vec3 uMouse;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec2 px = 1./uRes;
  vec4 pr = texture(uPrev,uv)*0.72 + 0.07*(texture(uPrev,uv+vec2(px.x,0.))+texture(uPrev,uv-vec2(px.x,0.))
          + texture(uPrev,uv+vec2(0.,px.y))+texture(uPrev,uv-vec2(0.,px.y)));
  float g = pr.r, wet = pr.g;
  vec2 w; float dist;
  if(ground(uv,w,dist)){
    shore(w,uTime);
    float water = step(0.,gD);
    g = g*exp(-uDt*mix(0.38,1.25,water)) - 0.0012;
    wet = max(wet - uDt*0.045, water);
    float e = gExc*exp(-dist*0.012);
    vec2 m = (uv-uMouse.xy)*vec2(uRes.x/uRes.y,1.);
    e += uMouse.z*exp(-dot(m,m)*700.)*max(water, smoothstep(0.2,0.6,wet)*0.6);
    g = max(g, min(e,1.));
  } else { g = 0.; wet = 0.; }
  o = vec4(max(g,0.), wet, 0., 1.);
}`;

// ---------------------------------------------------------------------------
// Pass 2: draw the picture — dark sky, dark sea, dark sand, then the glow.
// ---------------------------------------------------------------------------
const DRAW = COMMON + `
uniform sampler2D uBuf;
out vec4 o;

float sparkLayer(vec2 q, float t, float rad){
  vec2 i = floor(q), f = fract(q);
  float h = hash(i);
  vec2 c = vec2(hash(i+3.1), hash(i+7.7))*0.6+0.2;
  float r = length(f-c);
  float tw = 0.5+0.5*sin(t*(1.2+h*4.5)+h*40.);
  return smoothstep(rad,0.,r)*step(0.3,h)*tw*tw;
}
vec3 ramp(float g){
  return mix(vec3(0.0,0.10,0.75), vec3(0.05,0.85,1.0), smoothstep(0.12,0.85,g))*g;
}
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y,1.);
  vec4 b = texture(uBuf,uv);
  float bloom = textureLod(uBuf,uv,2.5).r*0.55 + textureLod(uBuf,uv,4.5).r*0.6;
  vec3 sky = vec3(0.004,0.008,0.02)*(1.2-0.9*smoothstep(HOR,0.5,p.y));
  vec3 col; vec2 w; float dist;
  if(!ground(uv,w,dist)){
    col = sky;
    vec2 sq = p*160.; vec2 si = floor(sq);
    float sh = hash(si);
    float st = smoothstep(0.09,0.,length(fract(sq)-0.5))*step(0.965,sh);
    col += vec3(0.5,0.6,0.8)*st*(0.25+0.3*sin(uTime*0.8+sh*90.))*smoothstep(HOR,HOR+0.08,p.y);
  } else {
    shore(w,uTime);
    float near = clamp(1.-(p.y+0.5)/(HOR+0.5),0.,1.);   // 1 at bottom, 0 at horizon
    float g = b.r, wet = b.g;
    float lace = smoothstep(0.5,0.72,fbm(vec2(gA*3.5, gS*3.5 + uTime*0.25)));
    if(gD > 0.){
      // sea
      col = vec3(0.003,0.009,0.026);
      col += vec3(0.004,0.02,0.05)*gCrest*smoothstep(0.3,2.,gD);
      col += vec3(0.,0.006,0.016)*fbm(w*2.5+vec2(0.,uTime*0.3));
      col += vec3(0.,0.016,0.032)*exp(-gD*1.4);
      float foam = exp(-gD*2.6)*lace*0.8 + exp(-gD*gD*160.);
      col += vec3(0.08,0.5,0.95)*foam*(0.12+1.1*g);
      col += ramp(g)*0.75;
    } else {
      // sand
      float grain = fbm(w*9.);
      vec3 dry = vec3(0.030,0.026,0.024)*(0.55+0.9*grain);
      vec3 wetc = vec3(0.007,0.010,0.016) + vec3(0.0,0.012,0.03)*smoothstep(0.4,1.,wet)*(0.5+0.5*grain);
      col = mix(dry, wetc, smoothstep(0.,0.5,wet));
      col += vec3(0.08,0.5,0.95)*exp(-gD*gD*160.)*(0.12+1.1*g);
      col += ramp(g)*0.28;
    }
    // glitter: tiny points that twinkle wherever the glow is alive
    float size = mix(0.55,1.,near);
    float s1 = sparkLayer(p*95.+vec2(3.,7.), uTime, 0.22*size);
    float s2 = sparkLayer(p*46.+vec2(11.,2.), uTime*0.8, 0.16*size);
    float s3 = sparkLayer(p*170., uTime*1.3, 0.30*size);
    float sp = s1 + s2*1.4 + s3*0.7;
    float gs = min(1., g*1.35);
    col += (ramp(gs)*2.6 + vec3(0.7,1.,1.)*gs*gs*gs*1.2)*sp;
    // distance haze into the night
    col = mix(sky, col, exp(-dist*0.022));
  }
  col += vec3(0.0,0.16,0.55)*bloom*0.55;
  col *= 1.-0.35*dot(p*vec2(0.75,1.),p*vec2(0.75,1.));
  col = 1.-exp(-col*1.9);
  col = pow(col, vec3(0.72));
  o = vec4(col,1.);
}`;

// ---------------------------------------------------------------------------
// Plumbing
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) { document.getElementById('err').style.display = 'flex'; throw new Error('no webgl2'); }

function shader(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); }
  return s;
}
function program(fs){
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); throw new Error('link'); }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const sim = program(SIM), draw = program(DRAW);
gl.bindVertexArray(gl.createVertexArray());

let targets = [], simW = 0, simH = 0;
function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.generateMipmap(gl.TEXTURE_2D);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fbo };
}
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(2, Math.round(innerWidth*dpr)), h = Math.max(2, Math.round(innerHeight*dpr));
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w; canvas.height = h;
  simW = Math.max(2, w >> 1); simH = Math.max(2, h >> 1);
  targets.forEach(t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); });
  targets = [makeTarget(simW, simH), makeTarget(simW, simH)];
}
addEventListener('resize', resize); resize();

// Dragging stirs the water and makes it glow.
const mouse = { x: 0.5, y: 0.5, on: 0 };
const hint = document.getElementById('hint');
function point(e){ mouse.x = e.clientX/innerWidth; mouse.y = 1 - e.clientY/innerHeight; }
canvas.addEventListener('pointerdown', e => { point(e); mouse.on = 1; hint.style.opacity = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (mouse.on) point(e); });
addEventListener('pointerup', () => mouse.on = 0);
addEventListener('pointercancel', () => mouse.on = 0);

let last = performance.now(), time = 0, flip = 0;
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now; time += dt;
  const src = targets[flip], dst = targets[1-flip];

  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, simW, simH);
  gl.useProgram(sim.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(sim.u.uPrev, 0);
  gl.uniform2f(sim.u.uRes, simW, simH);
  gl.uniform1f(sim.u.uTime, time);
  gl.uniform1f(sim.u.uDt, dt);
  gl.uniform3f(sim.u.uMouse, mouse.x, mouse.y, mouse.on);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindTexture(gl.TEXTURE_2D, dst.tex);
  gl.generateMipmap(gl.TEXTURE_2D);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(draw.p);
  gl.uniform1i(draw.u.uBuf, 0);
  gl.uniform2f(draw.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(draw.u.uTime, time);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  flip = 1-flip;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
