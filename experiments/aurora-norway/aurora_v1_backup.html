<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora over Norway</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.3 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; padding: 6px 10px;
         background: rgba(10,14,24,.7); border: 1px solid rgba(255,255,255,.15); border-radius: 999px; color: #cfe; }
  #bar button { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  #bar button.on { background: rgba(120,255,190,.22); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button data-demo="song" class="on">Pretend song</button>
  <button data-demo="quiet">Quiet</button>
  <button data-demo="medium">Medium</button>
  <button data-demo="loud">Loud</button>
  <button id="pick">Choose a song</button>
  <input id="file" type="file" accept="audio/*" hidden>
</div>
<script>
/* Aurora over Norway — a test scene for The Sound of Color. Standalone: it does not load or change the app.
   The sky is driven by four things a song can supply:
     aurora.note({pitch 0..1, strength 0..1, color [r,g,b] optional})   a new note lights a curtain; pitch picks how high in the sky
     aurora.beat(strength)                                               a rhythmic hit sends a ripple along every curtain
     aurora.setLevel(0..1)                                               loudness: how much of the sky the lights fill
     (harmony is simply several notes at once: more curtains lit, more colours)
   Address options: ?demo=quiet|medium|loud|song   ?time=12 (freeze at that second, for stills)   ?ui=0 */
(function () {
'use strict';
const qs = new URLSearchParams(location.search);
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
if (qs.get('ui') === '0') document.getElementById('bar').style.display = 'none';
const N = 5;
const VS = 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }';
const FS = `
precision highp float;
uniform vec2 uRes; uniform float uTime, uBeat;
uniform float uAmp[${N}], uY[${N}], uLen[${N}];
uniform vec3 uCol[${N}];
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm1(float x){ return vnoise(vec2(x,3.7))*.6 + vnoise(vec2(x*2.1,9.2))*.27 + vnoise(vec2(x*4.7,1.3))*.13; }
float edgeAt(float x, float fi, float asp){
  float ph = fi*2.1;
  return 0.07*sin(x*2.3+ph+uTime*0.11) + 0.035*sin(x*5.1-ph*1.7-uTime*0.17)
       + 0.03*(vnoise(vec2(x*3.+fi*9., uTime*0.08))-.5) + 0.06*(x/asp-0.5)*(mod(fi,2.)*2.-1.);
}
float box(vec2 q, vec2 lo, vec2 hi){ return step(lo.x,q.x)*step(q.x,hi.x)*step(lo.y,q.y)*step(q.y,hi.y); }
float pine(vec2 q){            // q: x centred on the trunk, y up from the ground, tree height 1
  float m = 0.;
  for (int k=0;k<4;k++){ float y0 = 0.12+float(k)*0.2, hh = 0.36-float(k)*0.03, ww = 0.3-float(k)*0.06;
    float t = (q.y-y0)/hh; float jag = 0.75+0.5*vnoise(vec2(q.y*46.+float(k)*3., sign(q.x)*4.));
    m = max(m, step(0.,t)*step(t,1.)*step(abs(q.x), ww*(1.-t)*jag)); }
  return max(m, box(q, vec2(-0.03,0.), vec2(0.03,0.2)));
}
void main(){
  vec2 uv = gl_FragCoord.xy/uRes; float asp = uRes.x/uRes.y; float pan = 0.045*sin(uTime*0.021)+0.02*sin(uTime*0.0131+1.);     // very slow sideways drift of the view
  vec2 p = vec2(uv.x*asp+pan, uv.y); float x = p.x-pan*0.8; float xm = p.x-pan*0.45;
  // night sky and stars
  vec3 col = mix(vec3(0.006,0.010,0.024), vec3(0.0,0.001,0.003), smoothstep(0.2,0.9,uv.y));
  vec2 sg = vec2(x,uv.y)*120.; vec2 id = floor(sg); vec2 sf = fract(sg)-.5; float sh = hash(id);
  float star = step(0.975,sh)*(0.25+0.75*hash(id+7.1))*smoothstep(0.11,0.0,length(sf-(vec2(hash(id+1.3),hash(id+2.7))-.5)*.6))
             * (0.55+0.45*sin(uTime*(1.+sh*3.)+sh*40.));
  // the lights
  vec3 au = vec3(0.), glow = vec3(0.);
  for (int i=0;i<${N};i++){
    float fi = float(i);
    float e0 = edgeAt(x, fi, asp), e1 = edgeAt(x+0.012, fi, asp);
    float fold = 1.+1.3*smoothstep(0.12,0.7,abs(e1-e0)/0.012);          // a curtain seen edge-on looks brighter
    float d = (uv.y-(uY[i]+e0))/uLen[i];
    float body = smoothstep(-0.02,0.012,d)*exp(-max(d,0.)*2.5);
    float border = exp(-pow(d/0.04,2.));
    float rx = x*36.+fi*13.+3.*vnoise(vec2(x*2., uTime*0.15+fi));
    float rays = 0.4+0.95*pow(vnoise(vec2(rx, uTime*0.35+fi*5.)),1.5);
    rays *= 0.6+0.4*vnoise(vec2(x*9.+fi*4., uTime*0.2));
    rays *= 0.75+0.5*vnoise(vec2(x*110.+fi*31., uTime*0.5));              // fine threads inside each ray
    float env = 0.3+0.7*smoothstep(0.25,0.7,vnoise(vec2(x*1.3+fi*3.-uTime*0.05, fi)));
    float ripple = 1.+uBeat*(0.5+0.5*sin(x*13.-uTime*9.+fi*1.7));
    float I = uAmp[i]*(body*rays+0.7*border*(0.4+0.6*rays))*env*fold*ripple;
    vec3 c = mix(uCol[i], vec3(0.5,0.22,0.9), smoothstep(0.2,1.0,d));     // tops fade to violet
    c += vec3(0.9,0.15,0.45)*exp(-pow((d+0.025)/0.025,2.))*uBeat*0.7;     // pink lower fringe on strong beats
    au += c*I; glow += uCol[i]*uAmp[i];
  }
  col += glow*0.022*smoothstep(0.15,0.7,uv.y);
  col += star*vec3(.8,.9,1.)*(1.-clamp(dot(au,vec3(.5)),0.,.85));
  col += au;
  vec3 lit = glow/(1.+dot(glow,vec3(0.4)));                               // colour the lights throw on the land
  // far mountains across the fjord
  float m1 = 0.27+0.2*pow(fbm1(xm*1.5+3.),1.4)+0.025*vnoise(vec2(xm*13.,2.))+0.008*vnoise(vec2(xm*60.,5.));
  if (uv.y < m1){
    float t = clamp((m1-uv.y)/0.14,0.,1.);
    float rock = vnoise(vec2(xm*40.+uv.y*25., uv.y*90.));
    float snow = smoothstep(0.35,0.7,rock)*smoothstep(1.,0.1,t)+0.5*smoothstep(0.25,0.,t);
    col = vec3(0.006,0.009,0.018)+(vec3(0.035,0.045,0.07)+lit*0.16)*snow*0.7;
  }
  // fjord water, mirroring the sky
  float wl = 0.255;
  if (uv.y < wl){
    float rip = vnoise(vec2(x*7.+uTime*0.05, uv.y*260.+uTime*0.4));
    col = vec3(0.004,0.007,0.016)+lit*0.26*(0.35+0.65*rip)*smoothstep(0.05,wl,uv.y);
  }
  // snowy foreground
  float g = 0.16+0.03*sin(x*1.7+1.)+0.014*sin(x*4.3+0.5);
  float hx = asp*0.68, gy = 0.16+0.03*sin(hx*1.7+1.)+0.014*sin(hx*4.3+0.5), s = 0.062;
  vec2 q = (p-vec2(hx,gy-0.004))/s;
  vec3 warm = vec3(1.0,0.6,0.24);
  if (uv.y < g){
    float up = uv.y/g;
    float drift = vnoise(vec2(x*5., uv.y*30.));
    col = vec3(0.016,0.024,0.042)*(0.55+0.6*up+0.25*drift)+lit*0.20*(0.3+0.7*up);
    col += vec3(0.9,1.,1.)*step(0.992,hash(floor(p*340.)))*0.07*(0.5+dot(lit,vec3(.6)));
    col += warm*0.16*exp(-length((q-vec2(-0.3,-0.5))*vec2(0.6,1.6))*1.3);  // window light on the snow
  }
  // pines
  float trees = 0.;
  for (int k=0;k<6;k++){ float fk = float(k);
    float tx = asp*(0.06+0.11*fk+0.5*step(2.5,fk)*0.48)+0.03*sin(fk*7.), th = 0.11+0.05*hash(vec2(fk,3.));
    float ty = 0.16+0.03*sin(tx*1.7+1.)+0.014*sin(tx*4.3+0.5)-0.006;
    trees = max(trees, pine((p-vec2(tx,ty))/th)); }
  col = mix(col, vec3(0.004,0.007,0.010)+lit*0.012, trees);
  // the little house
  float wall = box(q, vec2(-1.,0.), vec2(1.,1.));
  float ry = (q.y-1.)/0.8; float roof = step(0.,ry)*step(ry,1.)*step(abs(q.x),1.22*(1.-ry));
  float chim = box(q, vec2(0.45,1.25), vec2(0.7,1.75));
  if (chim > 0.5) col = vec3(0.012,0.010,0.012);
  if (wall > 0.5) col = vec3(0.045,0.014,0.012)*(0.8+0.3*vnoise(vec2(q.x*3.,q.y*18.)))+lit*0.02;
  if (roof > 0.5){ float cap = smoothstep(0.16,0.0,1.22*(1.-ry)-abs(q.x));     // snow lying on the roof
    col = mix(vec3(0.010,0.012,0.018), vec3(0.07,0.09,0.13)+lit*0.16, max(cap, 0.75)); }
  float win = box(q, vec2(-0.62,0.34), vec2(-0.12,0.76));
  if (win > 0.5){ float bar = step(abs(q.x+0.37),0.022)+step(abs(q.y-0.55),0.022); col = bar > 0.5 ? vec3(0.08,0.04,0.02) : warm*1.25; }
  if (box(q, vec2(0.28,0.), vec2(0.66,0.72)) > 0.5) col = vec3(0.02,0.008,0.006);
  col += warm*0.10*exp(-length(q-vec2(-0.37,0.55))*1.6)*(1.-win);
  vec2 sq = q-vec2(0.575,1.8); float rise = clamp(sq.y/3.,0.,1.);
  float smoke = step(0.,sq.y)*exp(-pow((sq.x-0.5*rise*rise-0.25*rise*sin(sq.y*2.-uTime*0.6))/(0.1+0.45*rise),2.))*(1.-rise)*vnoise(vec2(sq.x*3., sq.y*2.5-uTime*0.5));
  col += (vec3(0.03,0.035,0.045)+lit*0.05)*smoke;
  col *= 1.-0.35*pow(length(uv-vec2(.5,.55))*1.15,2.5);
  col += (hash(gl_FragCoord.xy+uTime)-.5)*0.008;
  gl_FragColor = vec4(pow(clamp(col,0.,1.), vec3(0.9)), 1.);
}`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(pr, n);

// natural aurora colours, from low in the sky to high
const NATURAL = [[0.12, 1.0, 0.42], [0.08, 0.95, 0.68], [0.2, 0.62, 1.0], [0.55, 0.35, 1.0], [1.0, 0.3, 0.62]];
const cur = NATURAL.map((c, i) => ({ amp: 0, col: c.slice(), y: 0.4 + 0.095 * i }));
let level = 0.3, beat = 0, demo = qs.get('demo') || 'song';
const frozen = qs.get('time') != null ? parseFloat(qs.get('time')) : null;

function note(o) {
  const pitch = Math.min(1, Math.max(0, o.pitch == null ? 0.5 : o.pitch));
  const i = Math.min(N - 1, Math.floor(pitch * N)), c = cur[i];
  c.amp = Math.max(c.amp, 0.35 + 0.65 * (o.strength == null ? 0.7 : o.strength));
  c.col = (o.color || NATURAL[i]).slice();
  c.y += (0.36 + 0.42 * pitch - c.y) * 0.5;
}
window.aurora = { note, beat: s => { beat = Math.max(beat, s == null ? 0.7 : s); }, setLevel: v => { level = Math.min(1, Math.max(0, v)); } };

// stand-in for a song, so the scene can be judged before real music is connected
const TUNE = [0.1, 0.3, 0.5, 0.3, 0.6, 0.8, 0.5, 0.3, 0.2, 0.45, 0.7, 0.95, 0.7, 0.45, 0.2, 0.1];
let lastSlot = -1;
function pretendSong(t) {
  const swell = 0.5 - 0.5 * Math.cos(t * 2 * Math.PI / 24);          // quiet -> loud -> quiet every 24 seconds
  level = 0.12 + 0.88 * swell;
  const slot = Math.floor(t / 0.5);
  if (slot === lastSlot) return; lastSlot = slot;
  const k = slot % TUNE.length;
  note({ pitch: TUNE[k], strength: 0.3 + 0.7 * swell });
  if (swell > 0.45 && k % 4 === 0) { note({ pitch: (TUNE[k] + 0.25) % 1, strength: swell }); note({ pitch: (TUNE[k] + 0.5) % 1, strength: swell }); }   // a chord
  if (swell > 0.3 && slot % 2 === 0) beat = Math.max(beat, 0.4 + 0.6 * swell);
}
const FIXED = { quiet: { amps: [0.42, 0.06, 0, 0, 0], level: 0.15, beat: 0 },
                medium: { amps: [0.8, 0.6, 0.32, 0.08, 0], level: 0.5, beat: 0.25 },
                loud: { amps: [1.0, 0.95, 0.85, 0.75, 0.6], level: 1.0, beat: 0.8 } };

// ---- a real song: listen to the audio and turn it into level, beats and notes
let analyser = null, bins = null, audioEl = null, runMax = 1e-3, bassAvg = 0, midAvg = 0, lastBeat = 0, lastNote = 0, prevSpec = null;
function playSong(url) {
  if (audioEl) audioEl.pause();
  audioEl = new Audio(url); audioEl.crossOrigin = 'anonymous';
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ac.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.5;
  ac.createMediaElementSource(audioEl).connect(analyser); analyser.connect(ac.destination);
  bins = new Uint8Array(analyser.frequencyBinCount); prevSpec = new Float32Array(bins.length);
  window.aurora.hz = ac.sampleRate / analyser.fftSize;
  demo = 'audio'; document.querySelectorAll('#bar button').forEach(o => o.classList.toggle('on', o.id === 'pick'));
  cur.forEach(c => { c.amp = 0; });
  return audioEl.play();
}
function listen(t) {
  analyser.getByteFrequencyData(bins);
  const hz = window.aurora.hz, B = f => Math.round(f / hz);
  let sum = 0, bass = 0, mid = 0;
  for (let i = B(30); i < B(8000); i++) { const v = bins[i] / 255; sum += v * v;
    const rise = Math.max(0, v - prevSpec[i]); if (i < B(160)) bass += rise; else if (i > B(200) && i < B(4000)) mid += rise; prevSpec[i] = v; }
  const rms = Math.sqrt(sum / (B(8000) - B(30)));
  runMax = Math.max(runMax * 0.9995, rms, 0.02);
  level += (Math.min(1, rms / runMax) ** 1.5 - level) * 0.06;            // loudness: how much of the sky is lit
  if (bass > bassAvg * 1.6 + 0.25 && t - lastBeat > 0.18) { beat = Math.max(beat, Math.min(1, 0.4 + bass / 6)); lastBeat = t; }   // rhythm
  if (mid > midAvg * 1.5 + 0.5 && t - lastNote > 0.11) {                 // a new note or chord: find its strongest pitches
    lastNote = t; const peaks = [];
    for (let i = B(110); i < B(1760); i++) { const v = bins[i];
      if (v > 70 && v >= bins[i - 1] && v > bins[i + 1] && v > bins[i - 3] + 6 && v > bins[i + 3] + 6) peaks.push([v, i]); }
    peaks.sort((a, b) => b[0] - a[0]);
    for (const [v, i] of peaks.slice(0, 3))                                // up to three: this is the harmony
      note({ pitch: Math.log2(i * hz / 110) / 4, strength: (v / 255) * (0.5 + 0.5 * level) });
  }
  bassAvg += (bass - bassAvg) * 0.08; midAvg += (mid - midAvg) * 0.08;
}
window.aurora.playSong = playSong;
document.getElementById('pick').onclick = () => qs.get('audio') ? playSong(qs.get('audio')) : document.getElementById('file').click();
document.getElementById('file').onchange = e => { const f = e.target.files[0]; if (f) playSong(URL.createObjectURL(f)); };
let prev = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  const t = frozen != null ? frozen : ms / 1000, dt = Math.min(0.1, Math.max(0, t - prev)); prev = t;
  if (FIXED[demo]) { const f = FIXED[demo]; level = f.level; beat = f.beat; cur.forEach((c, i) => { c.amp = f.amps[i]; c.col = NATURAL[i].slice(); c.y = 0.4 + 0.095 * i; }); }
  else { if (demo === 'audio' && analyser) listen(t); else pretendSong(t);
    cur.forEach((c, i) => { c.amp = Math.max(c.amp * Math.exp(-dt / 2.4), i === 0 ? 0.1 + 0.15 * level : 0); });
    beat *= Math.exp(-dt / 0.35); }
  const dpr = Math.min(2, devicePixelRatio || 1), w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(U('uRes'), w, h); gl.uniform1f(U('uTime'), t); gl.uniform1f(U('uBeat'), beat);
  gl.uniform1fv(U('uAmp'), cur.map(c => c.amp)); gl.uniform1fv(U('uY'), cur.map(c => c.y));
  gl.uniform1fv(U('uLen'), cur.map(c => 0.13 + 0.2 * level + 0.07 * c.amp));
  gl.uniform3fv(U('uCol'), cur.flatMap(c => c.col));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
document.querySelectorAll('#bar button[data-demo]').forEach(b => b.onclick = () => { demo = b.dataset.demo; if (audioEl) audioEl.pause();
  document.querySelectorAll('#bar button').forEach(o => o.classList.toggle('on', o === b)); });
document.querySelectorAll('#bar button').forEach(o => o.classList.toggle('on', o.dataset.demo === demo));
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
