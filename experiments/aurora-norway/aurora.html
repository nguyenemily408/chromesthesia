<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora over Norway</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.3 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; padding: 6px 10px;
         background: rgba(10,14,24,.7); border: 1px solid rgba(255,255,255,.15); border-radius: 999px; color: #cfe; }
  #bar button { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  #bar button.on { background: rgba(120,255,190,.22); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p id="unavailable" hidden style="position:fixed;inset:45% 16px auto;text-align:center;color:white">Aurora over Norway needs WebGL. Try another browser or style.</p>
<div id="bar">
  <button data-demo="song" class="on">Pretend song</button>
  <button data-demo="quiet">Quiet</button>
  <button data-demo="medium">Medium</button>
  <button data-demo="loud">Loud</button>
  <button id="scene">Scenery</button>
  <button id="pick">Choose a song</button>
  <input id="file" type="file" accept="audio/*" hidden>
</div>
<script>
/* Aurora over Norway — a test scene for The Sound of Color. Standalone: it does not load or change the app.
   The sky is driven by four things a song can supply:
     aurora.note({pitch 0..1, strength 0..1, color [r,g,b] optional})   a new note lights a curtain; pitch picks how high in the sky
     aurora.beat(strength)                                               a rhythmic hit sends a ripple along every curtain
     aurora.setLevel(0..1)                                               loudness: how much of the sky the lights fill
     (harmony is simply several notes at once: more curtains lit, more colours)
   Address options: ?demo=quiet|medium|loud|song   ?time=12 (freeze at that second, for stills)   ?ui=0 */
(function () {
'use strict';
const qs = new URLSearchParams(location.search);
const embedded = qs.get('embed') === '1';
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
if (embedded || qs.get('ui') === '0') document.getElementById('bar').style.display = 'none';
if (!gl) { document.getElementById('unavailable').hidden = false; return; }
const N = 4;
const VS = 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }';
const FS = `
precision highp float;
uniform vec2 uRes; uniform float uTime, uBeat, uLevel, uFade;
uniform float uAmp[${N}];
uniform vec3 uCol[${N}];
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ return vnoise(p)*.55 + vnoise(p*2.1+7.)*.3 + vnoise(p*4.3+3.)*.15; }
float box(vec2 q, vec2 lo, vec2 hi){ return step(lo.x,q.x)*step(q.x,hi.x)*step(lo.y,q.y)*step(q.y,hi.y); }
uniform float uHor; uniform sampler2D uLand; uniform vec4 uFit;
#define HOR uHor
const vec3 WARM = vec3(1.0,0.6,0.24);
vec3 cabin(vec3 col, vec2 q, vec3 lit){          // q: 0,0 = middle of the cabin's base, wall is 2 wide and 1 tall
  float wall = box(q, vec2(-1.,0.), vec2(1.,1.));
  float ry = (q.y-1.)/0.8; float roof = step(0.,ry)*step(ry,1.)*step(abs(q.x),1.22*(1.-ry));
  if (box(q, vec2(0.45,1.25), vec2(0.7,1.75)) > 0.5) col = vec3(0.012,0.010,0.012);
  if (wall > 0.5) col = vec3(0.04,0.013,0.011)*(0.8+0.3*vnoise(vec2(q.x*3.,q.y*18.)))+lit*0.02;
  if (roof > 0.5) col = vec3(0.09,0.11,0.15)+lit*0.12;
  float win = box(q, vec2(-0.62,0.34), vec2(-0.12,0.76));
  if (win > 0.5){ float bar = step(abs(q.x+0.37),0.03)+step(abs(q.y-0.55),0.03); col = bar > 0.5 ? vec3(0.08,0.04,0.02) : WARM*1.3; }
  if (box(q, vec2(0.28,0.), vec2(0.66,0.72)) > 0.5) col = vec3(0.02,0.008,0.006);
  return col + WARM*0.12*exp(-length(q-vec2(-0.37,0.55))*1.4)*(1.-win);
}
float pines(float x, float base, float dens, float hgt){   // jagged tree-line height at x
  float f = base;
  for (int r=0;r<3;r++){ float fr = float(r); float tx = x*(dens+fr*dens*0.55)+fr*3.7; float cell = floor(tx);
    float off = (hash(vec2(cell,fr))-.5)*0.5; float spike = max(0.,1.-abs(fract(tx)-0.5-off)*(2.6+2.*hash(vec2(cell,fr+9.))));
    f = max(f, base+hgt*(0.35+0.65*hash(vec2(cell,fr+4.)))*(0.55+0.45*vnoise(vec2(x*1.7,fr)))*pow(spike,1.3)); }
  return f;
}                       // where the horizon sits on screen
// how far away ribbon k is at each point across the sky, seen from above: each one snakes from near the horizon to overhead
float ribbonZ(float x, float fk){
  float z0 = 1.1*pow(1.85, fk);
  return z0*exp(0.6*sin(x*0.42+fk*1.9+uTime*0.045)+0.28*sin(x*1.05-fk*2.7-uTime*0.07)+0.1*sin(x*2.6+fk+uTime*0.11));
}
void main(){
  vec2 uv = gl_FragCoord.xy/uRes; float asp = uRes.x/uRes.y;
  float pan = 0.035*sin(uTime*0.021)+0.015*sin(uTime*0.0131+1.);          // very slow drift of the view
  vec3 dir = normalize(vec3((uv.x-.5)*asp*1.25+pan, (uv.y-HOR)*1.9, 1.));
  vec3 col = vec3(0.); vec3 glow = vec3(0.);
  for (int k=0;k<${N};k++) glow += uCol[k]*uAmp[k];
  vec3 lit = glow/(1.+dot(glow,vec3(0.45)));                                // the colour the lights throw on the land
  if (dir.y > 0.){
    // night sky and stars
    col = mix(vec3(0.010,0.018,0.035), vec3(0.0,0.002,0.008), smoothstep(0.,0.7,dir.y));
    vec2 sg = vec2(atan(dir.x,dir.z), dir.y)*150.; vec2 id = floor(sg); vec2 sf = fract(sg)-.5; float shh = hash(id);
    float star = step(0.972,shh)*(0.2+0.8*hash(id+7.1))*smoothstep(0.12,0.0,length(sf-(vec2(hash(id+1.3),hash(id+2.7))-.5)*.6))
               * (0.6+0.4*sin(uTime*(1.+shh*3.)+shh*40.));
    // the lights: tall sheets hanging high above, sampled at several heights so the rays lean toward overhead
    vec3 au = vec3(0.);
    for (int j=0;j<14;j++){
      float fj = float(j);
      float hgt = 1.0+fj*(0.05+0.07*uLevel);
      float X = dir.x*hgt/dir.y, Z = dir.z*hgt/dir.y;
      float far = exp(-Z*0.05);
      float prof = exp(-fj*0.30)*(j==0 ? 1.8 : 1.);                         // brightest along the lower edge
      for (int k=0;k<${N};k++){
        float fk = float(k);
        float w = 0.09+0.13*uLevel+0.03*sin(X*0.6+fk);
        float zc = ribbonZ(X, fk);
        float dZ = (Z-zc)/zc;
        float dens = exp(-dZ*dZ/(w*w));
        float rays = 0.18+1.5*pow(vnoise(vec2(X*7.+fk*17.+2.*vnoise(vec2(X*0.8,uTime*0.12+fk)), uTime*0.3+fk*3.)),2.2);   // vertical rays
        rays *= 0.7+0.6*vnoise(vec2(X*24.+fk*9., uTime*0.45));
        float patchy = 0.25+0.75*smoothstep(0.2,0.7,vnoise(vec2(X*0.4-uTime*0.06+fk*5., fk*2.3)));
        float ripple = 1.+uBeat*0.9*(0.5+0.5*sin(X*2.6-uTime*8.+fk*1.3));
        vec3 c = mix(uCol[k], vec3(0.25,0.35,0.95), smoothstep(2.,12.,fj)*0.75);
        if (j==0) c += vec3(1.0,0.2,0.5)*uBeat*0.6;                         // pink lower fringe on strong beats
        au += c*uAmp[k]*dens*rays*patchy*ripple*prof*far;
      }
    }
    au *= 0.62;
    col += star*vec3(.8,.9,1.)*(1.-clamp(dot(au,vec3(.6)),0.,.9));
    col += vec3(1.)-exp(-au*1.5);
    col += lit*0.05*exp(-dir.y*5.);                                         // haze near the horizon
  }
  // the land is a real photograph with its sky cut away; the live sky shows behind it
  vec2 pv = (uv-.5)*uFit.xy+uFit.zw+vec2(pan*0.12*uFit.x, 0.);
  vec4 L = texture2D(uLand, clamp(pv, 0., 1.));
  float lum = dot(L.rgb, vec3(.3,.6,.1));
  float warmth = clamp((L.r-L.b)*5., 0., 1.);                    // lamp-lit window: leave its colour alone
  vec3 land = L.rgb*(0.85+0.35*dot(lit,vec3(.4))) + lit*lum*0.95*(1.-warmth) + lit*0.006;
  col = mix(col, land, L.a);
  col *= uFade;
  col *= 1.-0.3*pow(length(uv-vec2(.5,.5))*1.1,2.5);
  col += (hash(gl_FragCoord.xy+uTime)-.5)*0.008;
  gl_FragColor = vec4(pow(clamp(col,0.,1.), vec3(0.9)), 1.);
}`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(pr, n);

// natural aurora colours, from low in the sky to high
const NATURAL = [[0.14, 1.0, 0.36], [0.10, 1.0, 0.55], [0.08, 0.92, 0.82], [0.5, 0.45, 1.0]];   // green, sea-green, teal, violet accent
const cur = NATURAL.map((c, i) => ({ amp: 0, col: c.slice(), y: 0.4 + 0.095 * i }));
// the sceneries: photographs with the sky removed. hv = how high the skyline's low point is, fx = where the cabin is across the photo
const SCENES = [{"file": "photos/meadow-open-valley.png", "hv": 0.335, "fx": 0.525, "aspect": 1.7768}, {"file": "photos/meadow-birch-valley.png", "hv": 0.277, "fx": 0.253, "aspect": 1.7768}, {"file": "photos/meadow-valley-bend.png", "hv": 0.227, "fx": 0.828, "aspect": 1.7768}, {"file": "photos/meadow-alpine-basin.png", "hv": 0.24, "fx": 0.65, "aspect": 1.7768}, {"file": "photos/cliffside-brighter-water.png", "hv": 0.486, "fx": 0.169, "aspect": 1.7768}];
const NS = SCENES.length;
let dirty = true;
SCENES.forEach(sc => { sc.tex = gl.createTexture(); sc.ready = false; const im = new Image();
  im.onload = () => { gl.bindTexture(gl.TEXTURE_2D, sc.tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); sc.ready = dirty = true; };
  im.src = sc.file; });
let scene = Math.min(NS - 1, Math.max(0, parseInt(qs.get('scene')) || 0)), nextScene = scene, fade = 1;
let level = embedded ? .1 : .3, beat = 0, demo = embedded ? 'external' : qs.get('demo') || 'song';
let running = !embedded, sceneTime = 0;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const frozen = qs.get('time') != null ? parseFloat(qs.get('time')) : null;

// colour for a pitch: low = green, then sea-green, teal, blue-violet, and pink for the very highest
const RAMP = [[0.14, 1.0, 0.36], [0.10, 1.0, 0.58], [0.08, 0.9, 0.9], [0.35, 0.55, 1.0], [0.72, 0.4, 1.0], [1.0, 0.38, 0.72]];
function palette(p) { const f = Math.min(0.9999, Math.max(0, p)) * (RAMP.length - 1), i = Math.floor(f), m = f - i;
  return RAMP[i].map((v, k) => v + (RAMP[i + 1][k] - v) * m); }
function note(o) {
  const pitch = Math.min(1, Math.max(0, o.pitch == null ? 0.5 : o.pitch));
  const i = o.ribbon ?? Math.min(N - 1, Math.floor(pitch * N)), c = cur[i];
  c.amp = Math.max(c.amp, o.strength == null ? 0.7 : o.strength);
  c.col = (o.color || palette(pitch)).slice();
  c.y += (0.36 + 0.42 * pitch - c.y) * 0.5;
}
window.aurora = {
  note,
  beat: s => { beat = Math.max(beat, s == null ? 0.7 : s); },
  setLevel: v => { level = Math.min(1, Math.max(0, v)); },
  setPlaying: playing => { running = playing; },
  reset() {
    level = .1; beat = 0; sceneTime = 0; dirty = true;
    cur.forEach((c, i) => { c.amp = 0; c.col = NATURAL[i].slice(); c.y = .4 + .095 * i; });
  },
  snapshot: () => !dirty && SCENES[scene].ready && scene === nextScene ? cv : null
};

// stand-in for a song, so the scene can be judged before real music is connected
const TUNE = [0.1, 0.3, 0.5, 0.3, 0.6, 0.8, 0.5, 0.3, 0.2, 0.45, 0.7, 0.95, 0.7, 0.45, 0.2, 0.1];
let lastSlot = -1;
function pretendSong(t) {
  const swell = 0.5 - 0.5 * Math.cos(t * 2 * Math.PI / 24);          // quiet -> loud -> quiet every 24 seconds
  level = 0.12 + 0.88 * swell;
  const slot = Math.floor(t / 0.5);
  if (slot === lastSlot) return; lastSlot = slot;
  const k = slot % TUNE.length;
  note({ pitch: TUNE[k], strength: 0.3 + 0.7 * swell });
  if (swell > 0.45 && k % 4 === 0) { note({ pitch: (TUNE[k] + 0.25) % 1, strength: swell }); note({ pitch: (TUNE[k] + 0.5) % 1, strength: swell }); }   // a chord
  if (swell > 0.3 && slot % 2 === 0) beat = Math.max(beat, 0.4 + 0.6 * swell);
}
const FIXED = { quiet: { amps: [0, 0.5, 0.05, 0, 0], level: 0.15, beat: 0 },
                medium: { amps: [0.35, 0.9, 0.6, 0.05, 0], level: 0.5, beat: 0.25 },
                loud: { amps: [1.0, 1.0, 0.95, 0.7, 0], level: 1.0, beat: 0.8 } };

// ---- a real song: listen to the audio and turn it into level, beats and notes
let pMean = 0.4, pVar = 0.03, runMin = 0, used = [0, 0, 0, 0], lvlLog = [];
let analyser = null, bins = null, audioEl = null, runMax = 1e-3, bassAvg = 0, midAvg = 0, lastBeat = 0, lastNote = 0, prevSpec = null;
function playSong(url) {
  if (audioEl) audioEl.pause();
  audioEl = new Audio(url); audioEl.crossOrigin = 'anonymous';
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ac.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.5;
  ac.createMediaElementSource(audioEl).connect(analyser); analyser.connect(ac.destination);
  bins = new Uint8Array(analyser.frequencyBinCount); prevSpec = new Float32Array(bins.length);
  window.aurora.hz = ac.sampleRate / analyser.fftSize; window.aurora.ac = ac;
  demo = 'audio'; document.querySelectorAll('#bar button').forEach(o => o.classList.toggle('on', o.id === 'pick'));
  cur.forEach(c => { c.amp = 0; });
  window.aurora.setScene(nextScene + 1);                                 // each new song gets the next scenery
  return audioEl.play();
}
function listen(t) {
  analyser.getByteFrequencyData(bins);
  const hz = window.aurora.hz, B = f => Math.round(f / hz);
  let sum = 0, bass = 0, mid = 0;
  for (let i = B(30); i < B(8000); i++) { const v = bins[i] / 255; sum += v * v;
    const rise = Math.max(0, v - prevSpec[i]); if (i < B(160)) bass += rise; else if (i > B(200) && i < B(4000)) mid += rise; prevSpec[i] = v; }
  const rms = Math.sqrt(sum / (B(8000) - B(30)));
  // loudness, measured against this song's own quietest and loudest moments so far, so soft passages really go dark
  runMax = Math.max(runMax * 0.9997, rms, 0.02);
  runMin = Math.min(runMin + (runMax - runMin) * 0.0004, rms);
  const want = Math.min(1, Math.max(0, (rms - runMin) / Math.max(0.02, runMax - runMin))) ** 1.7;
  level += (want - level) * (want > level ? 0.14 : 0.035);                // rises quickly, settles slowly
  lvlLog.push(level); if (lvlLog.length > 4000) lvlLog.shift();
  if (bass > bassAvg * 1.6 + 0.25 && t - lastBeat > 0.18) { beat = Math.max(beat, Math.min(1, 0.4 + bass / 6)); lastBeat = t; }   // rhythm
  if (mid > midAvg * 1.5 + 0.5 && t - lastNote > 0.11) {                 // a new note or chord: find its strongest pitches
    lastNote = t; const peaks = [];
    for (let i = B(110); i < B(1760); i++) { const v = bins[i];
      if (v > 70 && v >= bins[i - 1] && v > bins[i + 1] && v > bins[i - 3] + 6 && v > bins[i + 3] + 6) peaks.push([v, i]); }
    peaks.sort((a, b) => b[0] - a[0]);
    for (const [v, i] of peaks.slice(0, 3)) {                              // up to three: this is the harmony
      const raw = Math.log2(i * hz / 110) / 4;
      pMean += (raw - pMean) * 0.02; pVar += ((raw - pMean) ** 2 - pVar) * 0.02;   // learn this song's usual pitch range
      const pitch = Math.min(1, Math.max(0, 0.45 + (raw - pMean) / (3.2 * Math.sqrt(pVar + 1e-4))));   // so every song uses the whole colour range
      used[Math.min(3, Math.floor(pitch * 4))]++;

}
window.aurora.playSong = playSong;
// ?record=45 makes the page film itself (picture and sound) for that many seconds and hand the clip to the local helper
if (qs.get('record') && qs.get('audio')) addEventListener('load', async () => {
  await playSong(qs.get('audio'));
  const out = window.aurora.ac.createMediaStreamDestination(); analyser.connect(out);
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...out.stream.getAudioTracks()]);
  const mp4 = 'video/mp4;codecs=avc1.640028,mp4a.40.2', type = MediaRecorder.isTypeSupported(mp4) ? mp4 : 'video/webm;codecs=vp9,opus';
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 7e6 }), parts = [];
  rec.ondataavailable = e => parts.push(e.data);
  rec.onstop = () => fetch('/upload?name=aurora-clip.' + (type.startsWith('video/mp4') ? 'mp4' : 'webm'), { method: 'POST', body: new Blob(parts, { type }) });
  rec.start(1000); setTimeout(() => rec.stop(), parseFloat(qs.get('record')) * 1000);
});
window.aurora.debug = () => ({ level, used: used.slice(), log: lvlLog.slice() });
window.aurora.setScene = n => { nextScene = ((n % NS) + NS) % NS; dirty = true; };
document.getElementById('scene').onclick = () => window.aurora.setScene(nextScene + 1);
document.getElementById('pick').onclick = () => qs.get('audio') ? playSong(qs.get('audio')) : document.getElementById('file').click();
document.getElementById('file').onchange = e => { const f = e.target.files[0]; if (f) playSong(URL.createObjectURL(f)); };
let prev = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  const now = frozen != null ? frozen : ms / 1000;
  const dt = Math.min(.1, Math.max(0, now - prev));
  prev = now;
  const dpr = Math.min(2, devicePixelRatio || 1), w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (embedded && (!w || !h || document.hidden)) return;
  if (embedded && !running && !dirty && cv.width === w && cv.height === h) return;
  if (embedded && running) sceneTime += dt;
  const t = embedded ? (reducedMotion.matches ? 0 : sceneTime) : now;
  if (FIXED[demo]) { const f = FIXED[demo]; level = f.level; beat = f.beat; cur.forEach((c, i) => { c.amp = f.amps[i]; c.col = NATURAL[i].slice(); c.y = 0.4 + 0.095 * i; }); }
  else if (!embedded || running) { if (demo === 'audio' && analyser) listen(t); else if (!embedded) pretendSong(t);
    cur.forEach((c, i) => { c.amp = Math.max(c.amp * Math.exp(-dt / 1.3), i === 1 ? 0.03 + 0.12 * level : 0); });
    beat *= Math.exp(-dt / 0.35); }
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(U('uRes'), w, h); gl.uniform1f(U('uTime'), t); gl.uniform1f(U('uBeat'), beat); gl.uniform1f(U('uLevel'), level);
  // changing scenery: dim to black, swap, come back up
  if (embedded) {
    if (!SCENES[nextScene].ready) return;
    scene = nextScene;
  } else if (nextScene !== scene) { fade = Math.max(0, fade - dt / 1.5); if (fade === 0 || frozen != null) scene = nextScene; } else fade = Math.min(1, fade + dt / 1.5);
  gl.uniform1f(U('uFade'), frozen != null ? 1 : fade);
  // fit the photo to the screen like a cover image, keeping the cabin in view and the skyline about a third of the way up
  const sc = SCENES[scene], ca = w / h, zoom = 0.96;
  const sx = (ca > sc.aspect ? 1 : ca / sc.aspect) * zoom, sy = (ca > sc.aspect ? sc.aspect / ca : 1) * zoom;
