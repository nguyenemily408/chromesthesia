<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sound of Color · Artwork preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  *{box-sizing:border-box}
  :root{font:15px/1.4 "Instrument Sans",system-ui,sans-serif;color:#2a2522;--paper:#faf8f5;--line:#d9d3cb;--ink:#2b1e32;background:var(--paper)}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;min-height:560px;background:var(--paper)}
  .top{padding:12px 22px 0}
  h1{font:italic normal clamp(1.7rem,3.4vw,2.4rem)/1.1 "Instrument Serif",Georgia,serif;letter-spacing:-.01em;margin:0 0 10px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
  fieldset{border:0;margin:0;padding:0}
  #triggers{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff8}
  label,button,select{font:inherit;color:var(--ink)}
  #triggers label{padding:7px 18px;cursor:pointer;border-right:1px solid var(--line)}
  #triggers label:last-child{border-right:0}
  #triggers label:hover{background:#f1ece5}
  #triggers label:has(:checked){background:#e9e3da;font-weight:600}
  .pickers{display:flex;gap:8px;align-items:center}
  .pickers span{font-size:.82rem;color:#6b625a}
  select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  input[type=radio],.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  :focus-visible,label:has(:focus-visible){outline:2px solid #7832a1;outline-offset:2px}
  main{flex:1;min-height:240px;margin:10px 22px 0;position:relative;overflow:hidden;border-radius:4px}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ref{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:2}
  #ref img{max-width:100%;max-height:calc(100% - 28px);object-fit:contain;border:1px solid var(--line)}
  #ref b{font-size:.8rem;color:#7a1d1d;background:#f3d6d6;border-radius:6px;padding:2px 8px}
  #panel{margin:0 22px;padding:10px 0;border-top:1px solid var(--line);min-height:82px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  #lead{font-size:1.02rem;min-width:11em;max-width:20em}
  #lead small{display:block;font-size:.8rem;color:#6b625a;margin-top:2px}
  #legend{display:flex;gap:6px 18px;align-items:flex-start;flex-wrap:wrap;flex:1;border-left:1px solid var(--line);padding-left:18px;min-height:44px}
  #legend.plain{border-left:0;padding-left:0}
  .chip{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.82rem}
  .chip i{width:30px;height:30px;border-radius:50%;display:block}
  .chip.row{flex-direction:row;gap:7px}.chip.row i{width:16px;height:16px}
  #timeline{position:relative;flex:1;min-width:260px;height:48px}
  #timeline .axis{position:absolute;left:0;right:0;top:12px;height:1px;background:#4a423c}
  #timeline .tick{position:absolute;top:6px;width:1px;height:13px;background:#4a423c}
  #timeline .lab{position:absolute;top:22px;transform:translateX(-50%);font-size:.88rem}
  #timeline .head{position:absolute;top:6px;width:2px;height:13px;background:#c4342d;border-radius:1px;left:0}
  #gradbar{width:220px;height:12px;border-radius:6px}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:1px 7px;margin-right:6px}
  .badge.demo{background:#ffe9b8;color:#6a4300}.badge.est{background:#d9ecff;color:#0b4a82}.badge.na{background:#f3d6d6;color:#7a1d1d}
  #source{margin:0 22px 8px;font-size:.84rem;color:#514754}
  footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 22px;border-top:1px solid var(--line);background:#f6f3ee}
  button{cursor:pointer;border:1px solid var(--line);border-radius:99px;background:#fff;padding:5px 13px}
  button:hover{background:#f1ece5}
  #play{background:var(--ink);color:#fff;border-color:var(--ink);min-width:6.5em}
  #play:disabled{opacity:.6;cursor:wait}
  #track{font-size:.9rem;max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #seek{flex:1;min-width:140px;accent-color:#382343}
  #clock{font-variant-numeric:tabular-nums;font-size:.88rem;min-width:8ch;text-align:right}
  .note{margin-left:auto;font-style:italic;font-size:.8rem;color:#6b625a}
  [hidden]{display:none!important}
  /* full screen: the artwork fills the window; the controls float above it and slip away while music plays */
  html,body{overflow:hidden}
  main{position:fixed;inset:0;margin:0;border-radius:0;z-index:0}
  .top,.dock{position:fixed;left:50%;transform:translateX(-50%);z-index:5;width:max-content;max-width:calc(100% - 24px);
    background:rgba(250,248,245,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-radius:14px;box-shadow:0 6px 24px rgba(37,22,48,.12);transition:opacity .6s ease,transform .6s ease}
  .top{top:12px;padding:8px 12px}
  .top h1{display:none}
  .bar{border-bottom:0;padding-bottom:0}
  .dock{bottom:12px;padding:0;overflow:hidden;width:min(1120px,calc(100% - 24px))}
  .dock #panel{margin:0;padding:8px 14px;border-top:0;min-height:0}
  .dock #source{margin:6px 14px 0}
  .dock footer{border-top:1px solid var(--line);background:transparent;padding:8px 14px}
  .chip i{width:22px;height:22px}
  body.calm .top{opacity:0;pointer-events:none;transform:translate(-50%,-16px)}
  body.calm .dock{opacity:0;pointer-events:none;transform:translate(-50%,16px)}
  body.calm{cursor:none}
  .dock .note{display:none}
  .dock #source,.dock #panel{display:none!important}
  .dock footer{border-top:0!important}
  .dock footer{gap:6px}
  .dock footer button{padding:4px 10px;font-size:.86rem}
  .dock #seek{min-width:100px}
  /* welcome screen (landing direction J): the painting is the page, with the title and Play on top */
  .welcome{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(ellipse at center,rgba(250,248,245,.93) 0%,rgba(250,248,245,.6) 36%,rgba(250,248,245,0) 70%);transition:opacity .7s ease}
  .welcome h1{font:normal clamp(4rem,9vw,7rem)/.98 "Instrument Serif",Georgia,serif;letter-spacing:-.02em;margin:0;color:#1d1424}
  .welcome p{margin:22px 0 0;font-size:1.15rem;color:rgba(29,20,36,.68)}
  .welcome .go{margin-top:30px;display:inline-flex;align-items:center;gap:10px;background:#2b1e32;color:#fff;border:0;border-radius:99px;padding:13px 26px;font:500 1rem/1 "Instrument Sans",system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(43,30,50,.25)}
  .welcome .go:hover{background:#3d2a47}
  .welcome .wtrig{margin-top:22px;display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center}
  .welcome .wtrig button{border:0;background:none;padding:2px 0;font:inherit;font-size:.95rem;color:rgba(29,20,36,.55);cursor:pointer}
  .welcome .wtrig button[aria-pressed=true]{color:#1d1424;font-weight:600;text-decoration:underline;text-underline-offset:5px}
  .welcome .wstyle{margin-top:12px;align-items:baseline}
  .welcome .wstyle span{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(29,20,36,.45)}
  .welcome .wstyle button{font-size:.9rem}
  .welcome .wstyle button[data-suggested]::after{content:" · suggested";font-weight:400;font-size:.78rem;color:rgba(29,20,36,.5);text-decoration:none;display:inline-block}
  .welcome .wfoot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;font-size:.85rem;color:rgba(29,20,36,.78)}
  .welcome .wfoot>span{background:rgba(255,253,250,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:99px;padding:6px 12px;box-shadow:0 2px 10px rgba(29,20,36,.06)}
  .welcome .wfoot button{border:0;background:none;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
  .welcome .wsub{display:block;margin-top:10px;font-size:.8rem;color:rgba(29,20,36,.45)}
  body.welcoming .top,body.welcoming .dock{display:none}
  body:not(.welcoming) .welcome{opacity:0;pointer-events:none}
  /* ---------- controls, second pass ---------- */
  .top,.dock{background:rgba(255,255,255,.84);border:1px solid rgba(43,30,50,.08);box-shadow:0 10px 30px rgba(20,12,28,.14);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
  /* the top bar is anchored to the left edge, and Style comes first, so nothing in it ever moves */
  .top{left:16px;top:16px;transform:none;padding:6px;border-radius:14px}
  body.calm .top{transform:translateY(-16px)}
  .bar{gap:6px;flex-wrap:nowrap}
  .stylepick{display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;border-right:1px solid var(--line);margin-right:2px}
  .stylepick span{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7a7180}
  .stylepick select{width:8.5em;border:0;background:#f3eff6;border-radius:9px;padding:7px 10px;font-weight:600}
  #triggers{border:0;background:transparent;gap:2px;border-radius:10px}
  #triggers label{border:0;border-radius:9px;padding:7px 13px;color:#4d4352;white-space:nowrap}
  #triggers label:hover{background:#f3eff6}
  #triggers label:has(:checked){background:#2b1e32;color:#fff;font-weight:500}
  .soon{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:99px;font-size:.62rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px;background:#ffe9b8;color:#6a4300}
  #triggers label:has(:checked) .soon{background:rgba(255,233,184,.25);color:#ffe9b8}
  .welcome .wtrig .soon{font-size:.58rem;text-decoration:none}
  .color-key{display:flex;align-items:center;justify-content:center;gap:7px;min-height:26px;padding:4px 9px 5px;
    border-top:1px solid rgba(43,30,50,.12);color:#392e3e;font-size:.78rem;line-height:1.2;white-space:nowrap}
  .color-key i{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .color-key .spectrum{display:inline-block;width:clamp(48px,14vw,110px);height:6px;border-radius:9px;flex:none}
  .color-key .sample{display:inline-flex;align-items:center;gap:4px}
  @media(max-width:400px){.color-key{font-size:.72rem;gap:5px}}
  /* bottom bar: what is playing on one line, how it is drawn on the line above */
  .dock{width:min(980px,calc(100% - 32px));border-radius:16px;bottom:16px;overflow:visible}
  .dock #source{margin:10px 16px 0;font-size:.8rem}
  .dock #panel{padding:10px 16px 6px;gap:14px}
  #lead{font-size:.95rem;min-width:0;max-width:24em}
  #lead small{font-size:.76rem}
  #legend{border-left:0;padding-left:0;gap:4px 12px;min-height:0}
  .chip{font-size:.74rem}.chip i{width:18px;height:18px}
  .dock footer{border-top:1px solid rgba(43,30,50,.08);padding:8px 10px 8px 12px;gap:8px;flex-wrap:nowrap}
  .dock footer button{border-color:rgba(43,30,50,.14);padding:6px 12px;font-size:.84rem;white-space:nowrap}
  #play{min-width:6.5em;padding:7px 16px!important;font-weight:600}
  #track{max-width:14ch;font-size:.84rem;color:#4d4352}
  #seek{min-width:80px}
  #clock{font-size:.8rem;color:#6b625a;min-width:9ch}
  .accent{background:#7832a1!important;color:#fff;border-color:#7832a1!important}
  .more{position:relative;margin-left:auto}
  .menu{position:absolute;right:0;bottom:calc(100% + 10px);min-width:220px;display:flex;flex-direction:column;padding:6px;background:#fff;border-radius:12px;border:1px solid rgba(43,30,50,.1);box-shadow:0 12px 32px rgba(20,12,28,.18)}
  .menu button{border:0!important;text-align:left;border-radius:8px!important;padding:9px 12px!important;display:flex;justify-content:space-between;align-items:center}
  .menu kbd{font:600 .7rem/1 "Instrument Sans",system-ui,sans-serif;color:#7a7180;border:1px solid #ddd5e2;border-radius:5px;padding:2px 5px}
  @media (max-width:820px){
    .top{left:8px;right:8px;top:8px;overflow-x:auto}
    .dock{width:calc(100% - 16px);bottom:8px}
    .dock footer{flex-wrap:wrap}
    #legend{display:none}
  }
  @media (prefers-reduced-motion:reduce){.top,.dock,.welcome{transition:none}}
</style>
<section class="welcome" id="welcome" aria-label="Welcome">
  <h1>The Sound<br>of <em>Color</em></h1>
  <p>Press play. The song paints the screen.</p>
  <button type="button" class="go" id="wplay"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg><span id="wplaylabel">Play the demo</span></button>
  <div class="wtrig" id="wtrig" role="group" aria-label="What drives the colour">
    <button type="button" data-t="notes">Notes</button><button type="button" data-t="pitch">Pitch</button><button type="button" data-t="instruments">Instruments <span class="soon">in progress</span></button><button type="button" data-t="harmony">Harmony</button><button type="button" data-t="whole">Whole Song</button>
  </div>
  <div class="wtrig wstyle" id="wstyle" role="group" aria-label="Painting style">
    <span>Style</span>
    <button type="button" data-s="wc">Watercolor</button><button type="button" data-s="ink">Ink</button><button type="button" data-s="sh">Shapes</button><button type="button" data-s="glass">Diamond</button>
  </div>
  <span class="wsub" id="wsub">Sound starts only when you press Play.</span>
  <div class="wfoot"><span><button type="button" id="wchoose">Choose a song</button> from your computer</span><span>Controls fade away while the music plays</span></div>
</section>
<script>document.body.classList.add('welcoming')</script>
<div class="top">
  <h1>The Sound of Color</h1>
  <div class="bar">
    <label class="stylepick" for="styleSel"><span>Style</span><select id="styleSel" aria-label="Visual style"><option value="wc">Watercolor</option><option value="ink">Ink</option><option value="sh" selected>Shapes</option><option value="glass">Diamond</option></select></label>
    <fieldset id="triggers">
      <legend class="sr-only">What drives the artwork</legend>
      <label><input type="radio" name="trigger" value="notes" checked>Notes</label>
      <label><input type="radio" name="trigger" value="pitch">Pitch</label>
      <label><input type="radio" name="trigger" value="instruments">Instruments <span class="soon" title="Instrument detection is still being worked on. The demo shows known parts; your own songs show note colours.">in progress</span></label>
      <label><input type="radio" name="trigger" value="harmony">Harmony</label>
      <label><input type="radio" name="trigger" value="whole">Whole Song</label>
    </fieldset>
  </div>
</div>
<main id="main">
  <canvas id="cv" role="img" aria-label="Painting made from the music"></canvas>
</main>
<div class="dock" id="dock">
<p id="source" hidden></p>
<section id="panel" aria-live="polite">
  <div id="lead"><span id="description"></span><small id="subnote"></small></div>
  <div id="legend"></div>
</section>
<footer aria-label="Playback">
  <button type="button" id="play">Play demo</button>
  <span id="track">18-second demo</span>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Song position">
  <span id="clock">0:00</span>
  <button type="button" id="restart" hidden>Start over</button>
  <button type="button" id="choose">Choose a song</button>
  <button type="button" id="demo" hidden>Use demo</button>
  <button type="button" id="mute" aria-pressed="false">Mute</button>
  <button type="button" id="save" class="accent" hidden>Save painting</button>
  <div class="more">
    <button type="button" id="morebtn" aria-expanded="false" aria-controls="moremenu" aria-label="More options">More ▾</button>
    <div class="menu" id="moremenu" hidden>
      <button type="button" id="snapshot" title="Download a PNG of the artwork right now. The music keeps playing.">Save a snapshot</button>
      <button type="button" id="hide" title="Tap the artwork or press any key to bring the controls back. Shortcut: H">Hide controls <kbd>H</kbd></button>
      <button type="button" id="fs" title="Shortcut: F">Full screen <kbd>F</kbd></button>
    </div>
  </div>
  <span class="note" id="foot">Local preview · demo audio</span>
  <span class="sr-only" id="status" role="status"></span>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" hidden>
  <audio id="audio" preload="metadata"></audio>
</footer>
<div class="color-key" id="colorKey" aria-label="Color key"></div>
</div>
<script>
(() => {
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d'), audio=$('audio');
let W=0,H=0,DPR=1;
const NOTE=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

/* ---------- color: pitch class -> hue, walking the circle of fifths so related notes sit side by side ---------- */
const hueOf=pc=>((pc*7)%12)*30;
/* v = vividness 0..1. Low v gives a greyed, dull pigment; high v gives full neon. */
function vivid(n,F){return clamp(n.s*.55+F.bright*.35+F.energy*.25+(n.midi>72?.1:0)-(n.midi<50?.28:0))}
const yOf=m=>H*(.93-.86*clamp((m-36)/60));

/* ---------- canvas ---------- */
const INK_CPU={
  surface:document.createElement('canvas'),drops:[],time:0,lastDrop:0,quiet:0,
  init(){
    const cell=Math.max(3,Math.sqrt(W*H/29000));
    this.cols=Math.max(8,Math.round(W/cell));
    this.rows=Math.max(8,Math.round(H/cell));
    const {cols,rows}=this;
    this.surface.width=cols;this.surface.height=rows;
    this.ctx=this.surface.getContext('2d');
    this.pixels=this.ctx.createImageData(cols,rows);
    const field=()=>new Float32Array(cols*rows);
    this.u=field();this.v=field();this.uNext=field();this.vNext=field();
    this.pressure=field();this.divergence=field();this.curl=field();
    this.dye=[field(),field(),field()];this.dyeNext=[field(),field(),field()];
    this.reverse=field();
    this.drops=[];this.time=0;this.lastDrop=-2;this.quiet=0;this.wet=false;
    this.draw();
  },
  release(x,y,hue,strength=1,delay=0){
    this.drops.push({x:clamp(x,.01,.99)*this.cols,y:clamp(y,.015,.94)*this.rows,
      hue,strength,age:-delay,fall:.48,side:x<.5?1:-1});
    this.lastDrop=this.time;
    this.quiet=0;this.wet=true;
  },
  frame(F){
    if(!F||F.energy<.035||this.time-this.lastDrop<(F.onset?.28:.48))return;
    const notes=F.notes.filter(n=>n.s>.22).slice(0,4);
    for(const [i,note] of notes.entries()){
      const [x,y]=note.part?inkPartOrigin(note.part):[
        LAYOUT.x==null?rnd(.03,.97):clamp(LAYOUT.x+rnd(-LAYOUT.xs,LAYOUT.xs),.03,.97),
        clamp(yOf(note.midi)/H,.08,.85)
      ];
      this.release(x,y,hueOf(note.pc),.93+note.s*.85+F.energy*.52,i*.06);
    }
  },
  deposit(drop,dt){
    const {cols,rows,u,v,dye}=this;
    const age=drop.age-drop.fall;
    const progress=clamp(age/.76);
    const fade=Math.sin(Math.PI*(.17+.83*progress));
    const scale=Math.min(cols,rows);
    const r=Math.max(2.8,scale*(.047+.039*progress)*drop.strength);
    const x=drop.x+drop.side*(progress*r*.91+Math.sin(progress*8.1)*r*.24);
    const y=drop.y+progress*scale*.14;
    const h=drop.hue/60;
    const k=n=>(n+h)%6;
    const rgb=[5,3,1].map(n=>.96-.84*Math.max(0,Math.min(k(n),4-k(n),1)));
    for(let j=Math.max(1,Math.floor(y-r*2));j<Math.min(rows-1,y+r*2);j++){
      for(let i=Math.max(1,Math.floor(x-r*2));i<Math.min(cols-1,x+r*2);i++){
        const dx=(i-x)/r,dy=(j-y)/r,d=dx*dx+dy*dy;
        if(d>4)continue;
        const p=i+j*cols,weight=Math.exp(-2.3*d)*fade;
        const amount=weight*dt*10*drop.strength;
        for(let c=0;c<3;c++)dye[c][p]=Math.min(4,dye[c][p]+amount*(1-rgb[c]));
        const ring=Math.exp(-.89*d)*fade;
        u[p]+=(drop.side*.19+dx*.41-dy*.45*drop.side)*ring*dt*21;
        v[p]+=(.65+dx*.46*drop.side+dy*.17)*ring*dt*19;
      }
    }
  },
  advect(source,target,loss,direction=1){
    const {cols,rows,u,v}=this;
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const p=x+y*cols;
      const bx=clamp(x-u[p]*direction*.28,.5,cols-1.5),by=clamp(y-v[p]*direction*.28,.5,rows-1.5);
      const ix=Math.floor(bx),iy=Math.floor(by),fx=bx-ix,fy=by-iy,b=ix+iy*cols;
      const a=source[b]+(source[b+1]-source[b])*fx;
      const c=source[b+cols]+(source[b+cols+1]-source[b+cols])*fx;

  const size=()=>{const k=Math.min(1,1600/Math.max(cv.width,cv.height,1));gc.width=Math.max(2,Math.round(cv.width*k));gc.height=Math.max(2,Math.round(cv.height*k))};

/* ---------- musical shapes. Each attack places a clear form: color from the note, height from pitch, size from
   strength. A playhead walks left to right so a phrase reads like a line of music, and every form thins out and
   spreads over a few seconds so the next phrase is easy to follow ---------- */
const SH={fps:60,list:[],t:0,last:-9,
  init(){this.list=[];this.t=0;this.last=-9;this.draw()},
  resize(){this.draw()},
  idle(){return !this.list.length},
  frame(F){
    if(!F||F.energy<.035||this.t-this.last<(F.onset?.3:.8))return;
    const notes=F.notes.filter(n=>n.s>.22).slice(0,4);if(!notes.length)return;
    this.last=this.t;
    const M=Math.min(W,H);
    const sweep=(audio.currentTime%12)/12;
    const px=W*(LAYOUT.x??(.08+.84*sweep));
    notes.forEach((n,i)=>{
      const lead=i===0,ring=lead||(F.onset&&i<3&&n.s>.55);
      const x=clamp(px+(i%2?1:-1)*i*W*.04,W*.045,W*.955);
      const y=clamp(yOf(n.midi)+(i%2?1:-1)*i*H*.036,H*.16,H*.86);

      const r=M*((ring?.12:.045)+n.s*(ring?.13:.09)*(.45+F.energy));
      const name=n.part?PARTS[n.part].label:NOTE[n.midi%12];
      this.list.push({x,y,r,hue,sat,kind:ring?'ring':'disc',name,lead,age,life:ring?12:10});
      this.list.push({x:x+rnd(-.07,.07)*W,y:y+rnd(-.12,.12)*H,r:r*rnd(.55,.92),hue,sat,kind:'disc',age,life:10});
      this.list.push({x:x+rnd(-.09,.09)*W,y:clamp(y+rnd(-.16,.16)*H,H*.10,H*.90),r:M*rnd(.025,.10),hue,sat,kind:'tick',age,life:8});
    });

  },

function ensureAC(){

    analyser=AC.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.55;analyser.minDecibels=-100;analyser.maxDecibels=-10;

function analyse(now){

  analyser.getFloatFrequencyData(fbuf);analyser.getByteFrequencyData(bbuf);

  F.bass=clamp(bs/(bn*255)*1.25);

  fluxAvg=fluxAvg*.93+flux*.07;
  F.flux=clamp(flux*18);

/* =====================================================================================================
   Triggers (added on top of the preferred preview). With "Notes" selected, nothing below changes what the
   renderers receive, so the default look and motion are exactly those of three-styles.html.
   ===================================================================================================== */
/* Layout hints. Defaults leave every renderer exactly as it was. */
const LAYOUT={x:null,xs:.05,band:1,hold:false,tight:false,prog:0,size:1};
let trigger='notes';
const TRIGGER_NAMES={notes:'Notes',pitch:'Pitch',instruments:'Instruments',harmony:'Harmony',whole:'Whole Song'};

/* the preferred demo (18 s) has known chords: Am, F, C, G, each lasting 4.25 s */
const ORIG_CHORDS=[
  {name:'Am',root:9,minor:true, t:0,   pad:[57,60,64,69]},
  {name:'F', root:5,minor:false,t:4.25,pad:[53,57,60,65]},
  {name:'C', root:0,minor:false,t:8.5, pad:[48,55,64,67]},
  {name:'G', root:7,minor:false,t:12.75,pad:[55,59,62,71]}];
/* a second, 20 s "known parts" demo for Instruments: four parts generated separately */
const KNOWN_DURATION=20;
const KNOWN_CHORDS=[
  {name:'Am',root:9,minor:true, t:0, pad:[57,60,64],bass:45,mel:[69,72,76,81]},
  {name:'F', root:5,minor:false,t:5, pad:[57,60,65],bass:41,mel:[72,77,81,84]},
  {name:'C', root:0,minor:false,t:10,pad:[55,60,64],bass:48,mel:[84,79,76,72]},
  {name:'G', root:7,minor:false,t:15,pad:[55,59,62],bass:43,mel:[71,67,62,59]}];
/* pc = the note slot whose hue we borrow: hue = ((pc*7)%12)*30 */
const PARTS={
  bass: {label:'Bass', pc:6, gain:1, ink:[.16,.65]},
  pad:  {label:'Pad',  pc:3, gain:.75, ink:[.68,.23]},
  pluck:{label:'Pluck',pc:7, gain:.85, ink:[.83,.77]},
  bell: {label:'Bell melody',pc:10,gain:1, ink:[.46,.52]}};
function inkPartOrigin(part){
  const [x,y]=PARTS[part].ink;
  return [x+rnd(-.10,.10),y+rnd(-.13,.13)];
}
const EVENTS=[];
for(const c of KNOWN_CHORDS){
  for(const o of [0,2.5])EVENTS.push({part:'bass',t:c.t+o,dur:2.3,midi:c.bass});
  for(const m of c.pad)EVENTS.push({part:'pad',t:c.t,dur:5,midi:m});
  for(let k=0;k<8;k++)EVENTS.push({part:'pluck',t:c.t+.3+k*.6,dur:.55,midi:c.pad[[0,1,2,1,0,1,2,1][k]]+12});
  c.mel.forEach((m,k)=>EVENTS.push({part:'bell',t:c.t+.2+k*1.2,dur:1.1,midi:m}));
}
EVENTS.sort((a,b)=>a.t-b.t);
const TIMBRE={
  bass:(f,tau)=>.34*Math.min(1,tau/.01)*Math.exp(-tau*1.3)*(Math.sin(2*Math.PI*f*tau)+.35*Math.sin(4*Math.PI*f*tau)),
  pad:(f,tau,d)=>.07*Math.min(1,tau/.6)*Math.min(1,(d-tau)/.6)*(Math.sin(2*Math.PI*f*tau)+Math.sin(2*Math.PI*f*1.004*tau))*.5,
  pluck:(f,tau)=>.13*Math.min(1,tau/.004)*Math.exp(-tau*7)*(Math.sin(2*Math.PI*f*tau)+.5*Math.sin(4*Math.PI*f*tau)+.25*Math.sin(6*Math.PI*f*tau)),
  bell:(f,tau)=>.16*Math.min(1,tau/.004)*Math.exp(-tau*2.6)*(Math.sin(2*Math.PI*f*tau)+.4*Math.exp(-tau*3)*Math.sin(2*Math.PI*f*2.76*tau)+.25*Math.exp(-tau*5)*Math.sin(2*Math.PI*f*5.4*tau))};
function buildKnownDemo(){
  const rate=22050,mix=new Float32Array(rate*KNOWN_DURATION);
  for(const p of Object.keys(PARTS)){                 /* each part is rendered on its own first, then mixed */
    const buf=new Float32Array(mix.length);
    for(const e of EVENTS)if(e.part===p){
      const f=440*2**((e.midi-69)/12),o=Math.round(e.t*rate),n=Math.round(e.dur*rate);
      for(let i=0;i<n&&o+i<buf.length;i++)buf[o+i]+=TIMBRE[p](f,i/rate,e.dur);
    }
    for(let i=0;i<mix.length;i++)mix[i]+=buf[i];
  }
  const buffer=new ArrayBuffer(44+mix.length*2),wav=new DataView(buffer);
  for(const [o,w] of [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']])[...w].forEach((c,i)=>wav.setUint8(o+i,c.charCodeAt(0)));
  wav.setUint32(4,buffer.byteLength-8,true);wav.setUint32(16,16,true);wav.setUint16(20,1,true);wav.setUint16(22,1,true);
  wav.setUint32(24,rate,true);wav.setUint32(28,rate*2,true);wav.setUint16(32,2,true);wav.setUint16(34,16,true);wav.setUint32(40,mix.length*2,true);
  mix.forEach((s,i)=>wav.setInt16(44+i*2,Math.round(clamp(s,-1,1)*32767),true));
  return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
}
let demoKind='orig',knownUrl='',harmonyNow=null,prevT=0;
const wantKind=()=>trigger==='instruments'?'known':'orig';
const demoLength=()=>demoKind==='known'?KNOWN_DURATION:duration;
const demoLabel=()=>demoKind==='known'?'20-second known-parts demo':'18-second demo';
const urlFor=kind=>kind==='known'?(knownUrl||=buildKnownDemo()):(demoUrl||=buildDemo());
const isDemo=()=>!file;
const progress=()=>clamp((audio.currentTime||0)/(isDemo()?demoLength():(audio.duration||duration)));
/* Ink always builds a painting; the fade-with-music choice was removed from the controls */
const effectiveMode=()=>'paint';
const timelineDriven=()=>isDemo()&&(trigger==='instruments'||trigger==='harmony');

/* Frames built from the demo's known events rather than from listening */
function chordFrame(chords,t,prev){
  const F={notes:[],chroma:new Float32Array(12),energy:.55,bass:.35,bright:.5,onset:false,flux:.1};
  const c=[...chords].reverse().find(x=>t>=x.t)||chords[0];
  const tones=[c.root,(c.root+(c.minor?3:4))%12,(c.root+7)%12],since=(t-c.t)%1.25;
  tones.forEach((pc,i)=>F.notes.push({midi:c.pad.find(m=>m%12===pc)||c.pad[i],pc,s:[1,.8,.7][i]*(1-.25*since/1.25),v:clamp((c.minor?.52:.85)+(i?0:.1))}));
  F.onset=Math.floor((t-c.t)/1.25)!==Math.floor((prev-c.t)/1.25)||prev<c.t;F.flux=F.onset?.5:.1;
  harmonyNow={name:c.name,tones,minor:c.minor,how:'known'};
  return F;
}
function instrumentFrame(t,prev){
  const F={notes:[],chroma:new Float32Array(12),energy:.55,bass:.2,bright:.5,onset:false,flux:.1};
  for(const p of Object.keys(PARTS)){
    const e=EVENTS.filter(x=>x.part===p&&t>=x.t&&t<x.t+x.dur).sort((a,b)=>b.t-a.t)[0];
    if(!e)continue;
    const s=clamp(PARTS[p].gain*(1-.6*(t-e.t)/e.dur));
    F.notes.push({midi:e.midi,pc:PARTS[p].pc,part:p,s,v:clamp(.5+.4*s)});
  }
  F.notes.sort((a,b)=>b.s-a.s);
  const hit=EVENTS.filter(e=>e.t>prev&&e.t<=t);
  F.onset=hit.length>0;F.flux=hit.length?.55:.1;
  return F;
}

/* Harmony estimate for uploaded audio: match smoothed pitch-class strength against 24 major and minor triads */
const TRIADS=[];
for(let r=0;r<12;r++)for(const minor of [false,true]){
  const v=new Float32Array(12);v[r]=1;v[(r+(minor?3:4))%12]=1;v[(r+7)%12]=1;
  TRIADS.push({v,r,minor,name:NOTE[r]+(minor?'m':''),tones:[r,(r+(minor?3:4))%12,(r+7)%12]});
}
const est={acc:new Float32Array(12),cand:-1,count:0,now:null,last:''};
function estimateReset(){est.acc.fill(0);est.cand=-1;est.count=0;est.now=null;est.last=''}
function estimateChord(F){
  const a=est.acc;let mag=0;
  for(let i=0;i<12;i++){a[i]=a[i]*.92+F.chroma[i]*.08;mag+=a[i]*a[i]}
  mag=Math.sqrt(mag);
  if(mag<.12){est.now=null;est.cand=-1;est.count=0;return null}
  let best=-1,bs=0,second=0;
  TRIADS.forEach((t,i)=>{let d=0;for(let k=0;k<12;k++)d+=a[k]*t.v[k];const s=d/(mag*Math.sqrt(3));
    if(s>bs){second=bs;bs=s;best=i}else if(s>second)second=s});
  const sure=bs>.8&&bs-second>.05;        /* strong match, clearly ahead of the runner-up, held for a third of a second */
  if(sure&&best===est.cand)est.count++;else{est.cand=sure?best:-1;est.count=sure?1:0}
  if(est.count>=12)est.now={name:TRIADS[best].name,tones:TRIADS[best].tones,minor:TRIADS[best].minor,how:'estimate'};
  return est.now;
}

/* Pitch colors run low to high: violet, blue, cyan, green, lime, yellow, orange, pink */
const PITCH_HUES=[270,240,210,180,150,120,60,30,330];
const pitchSlot=midi=>(((PITCH_HUES[Math.round((PITCH_HUES.length-1)*clamp((midi-40)/48))])/30)*7)%12;

/* One frame of artwork information. With Notes selected this is exactly what the preferred page did. */
function buildFrame(now){
  const t=audio.currentTime||0;
  let F;
  harmonyNow=null;
  if(timelineDriven()&&trigger==='instruments')F=instrumentFrame(t,prevT);
  else if(timelineDriven())F=chordFrame(demoKind==='known'?KNOWN_CHORDS:ORIG_CHORDS,t,prevT);
  else{
    F=analyse(now);
    if(trigger==='harmony'){
      const c=estimateChord(F);
      if(c){
        harmonyNow=c;
        F.notes=c.tones.map((pc,i)=>({midi:52+((pc-4+12)%12),pc,s:[1,.8,.7][i]*clamp(.55+F.energy),v:clamp((c.minor?.52:.85)+(i?0:.1))}));
        F.onset=F.onset||c.name!==est.last;est.last=c.name;
      }
    }else if(trigger==='pitch')F.notes=F.notes.map(n=>({...n,pc:pitchSlot(n.midi)}));
  }
  if(trigger==='whole'){          /* the color journey: cyan, green, yellow, orange, red, purple, blue, pink over the song */
    const K=[190,150,100,55,30,5,-25,-75,-105,-45],u=progress()*(K.length-1),i=Math.min(K.length-2,Math.floor(u)),base=K[i]+(K[i+1]-K[i])*(u-i);
    F.notes=F.notes.map(n=>{const off=(((hueOf(n.pc)-180+540)%360)-180)*.1,h=((base+off)%360+360)%360;return {...n,pc:((Math.round(h/30)%12)*7)%12}});
  }
  prevT=t;
  /* A chord can produce several clouds, but repeated octaves share the same color. */
  F.notes=F.notes.filter((n,i,a)=>a.findIndex(o=>o.pc===n.pc)===i);
  LAYOUT.prog=progress();
  if(trigger==='pitch'){LAYOUT.x=LAYOUT.prog;LAYOUT.xs=.04;LAYOUT.band=.22;LAYOUT.size=1}
  else if(trigger==='whole'){LAYOUT.x=.06+.88*LAYOUT.prog;LAYOUT.xs=.065;LAYOUT.band=1;LAYOUT.size=.80}
  else{LAYOUT.x=null;LAYOUT.xs=.05;LAYOUT.band=1;LAYOUT.size=1}
  return F;
}

function sourceInfo(){
  const demo=isDemo();
  switch(trigger){
    case 'pitch':return {cls:'est',tag:'ESTIMATED',text:'Lower pitches land lower and higher pitches land higher, moving left to right as the song plays. Pitch is estimated from the sound.'};
    case 'instruments':return demo
      ?{cls:'demo',tag:'DEMO DATA',text:'This uses a separate 20-second demo whose bass, pad, pluck and bell parts are generated separately, so each instrument is known, not detected.'}
      :{cls:'na',tag:'NOT AVAILABLE',text:'Instrument identification is not available for a mixed song file, so note colors are shown instead.'};
    case 'harmony':return demo
      ?{cls:'demo',tag:'DEMO DATA',text:'The demo is written on Am, F, C and G, so the chords are known. Palette follows the chord.'}
      :{cls:'est',tag:'ESTIMATED',text:'Chords are guessed from the audio and named only when the match is strong. They can be wrong. When unsure, note colors are shown.'};
    case 'whole':return {cls:'est',tag:'ESTIMATED',text:'One composition builds across the song, left to right, and earlier marks stay. The finished image is held and can be saved.'};
    default:return null;
  }
}
function renderSource(){
  const el=$('source'),info=sourceInfo();
  el.hidden=!info;
  if(!info)return;
  el.textContent='';
  const b=document.createElement('span');b.className='badge '+info.cls;b.textContent=info.tag;
  el.append(b,info.text);
  if(trigger==='harmony'&&harmonyNow){}
}
function renderColorKey(chord=null){
  const row=$('colorKey');
  row.replaceChildren();
  const swatch=(pc,name)=>{
    const group=document.createElement('span'), dot=document.createElement('i');
    group.className='sample';
    dot.style.background='hsl('+hueOf(pc)+',95%,48%)';
    dot.setAttribute('aria-hidden','true');
    group.append(dot,name);
    row.append(group);
  };
  const spectrum=(hues)=>{
    const bar=document.createElement('span');
    bar.className='spectrum';
    bar.setAttribute('aria-hidden','true');
    bar.style.background='linear-gradient(90deg,'+hues.map(h=>'hsl('+h+',92%,49%)').join(',')+')';
    row.append(bar);
  };
  switch(trigger){
    case 'notes':
      row.append('Match colors to notes');
      [[0,'C'],[7,'G'],[4,'E']].forEach(([pc,name])=>swatch(pc,name));
      break;
    case 'pitch':
      row.append('Low');
      spectrum(PITCH_HUES);
      row.append('High');
      break;
    case 'instruments':
      if(isDemo()){
        for(const part of Object.values(PARTS))swatch(part.pc,part.label==='Bell melody'?'Bell':part.label);
      }else row.append('Note colors · instruments unavailable');
      break;
    case 'harmony':
      if(chord){
        row.append((chord.how==='known'?'Demo chord ':'Estimated ')+chord.name+' ·');
        chord.tones.forEach(pc=>swatch(pc,NOTE[pc]));
      }else row.append('Colors follow the chord');
      break;
    case 'whole':
      row.append('Start');
      spectrum([190,150,100,55,30,5,335,285,255,315]);
      row.append('End');
  }
}

let shownChord='';
function updateChordReadout(){
  if(trigger!=='harmony')return;
  const h=harmonyNow,key=h?h.name+h.how:'none';
  if(key===shownChord)return;shownChord=key;
  renderColorKey(h);
  const el=$('source'),info=sourceInfo();
  el.textContent='';
  const b=document.createElement('span');b.className='badge '+info.cls;b.textContent=info.tag;
  const L=$('legend');if(h){L.textContent='';for(const pc of h.tones)L.append(chip(pc,NOTE[pc]));L.append(h.name+(h.minor?' minor':' major'))}
  else if(L&&!L.children.length)L.textContent='Chord colors appear when the music plays';
  el.append(b,h?'Chord: '+h.name+' ('+h.tones.map(p=>NOTE[p]).join(' ')+') · '+(h.how==='known'?'known from the demo':'estimate, may be wrong'):info.text);
}
const LEAD={notes:'Each note has a color',pitch:'Higher pitch sits higher',instruments:'One color per instrument',harmony:'Chords shape the palette',whole:'A color journey across the song'};
const DEFAULTS={notes:{style:'sh',mode:'fade'},pitch:{style:'sh',mode:'fade'},instruments:{style:'ink',mode:'paint'},harmony:{style:'wc',mode:'fade'},whole:{style:'wc',mode:'paint'}};
const REFS={notes:'reference-notes.png',pitch:'02-pitch.png',instruments:'03-instruments.png',harmony:'04-harmony.png',whole:'reference-whole-song.png'};
function chip(pc,label,row){
  const c=document.createElement('div'),i=document.createElement('i');
  c.className='chip'+(row?' row':'');i.style.background=paint(pc,1,1,false);c.append(i,label);return c;
}
function renderLegend(){
  const L=$('legend');L.textContent='';L.className='';shownChord='';
  renderColorKey();
  if(trigger==='notes'){for(let k=0;k<12;k++){const pc=(k*7)%12;L.append(chip(pc,NOTE[pc]))}}
  else if(trigger==='pitch'){
    const bar=document.createElement('div');bar.id='gradbar';bar.style.background='linear-gradient(90deg,'+PITCH_HUES.map(h=>'hsl('+h+',85%,52%)').join(',')+')';
    L.append('Low',bar,'High');L.style.alignItems='center';L.style.gap='10px';
  }else if(trigger==='instruments'){
    if(isDemo()){for(const p in PARTS)L.append(chip(PARTS[p].pc,PARTS[p].label,true));L.append('Demo parts, known not detected')}
    else{L.textContent='Instrument identification is not available for song files.';L.classList.add('plain')}
  }else if(trigger==='harmony'){L.id='legend';updateChordReadout()}
  else{
    const T=document.createElement('div');T.id='timeline';
    T.innerHTML='<div class="axis"></div><div class="tick" style="left:33.3%"></div><div class="tick" style="left:66.6%"></div><div class="lab" style="left:16.6%">Beginning</div><div class="lab" style="left:50%">Middle</div><div class="lab" style="left:83.3%">Ending</div><div class="head" id="head"></div>';
    L.append(T);L.classList.add('plain');L.style.width='100%';
  }
  $('foot').textContent=trigger==='whole'?'Generic sections, not detected song structure':'Local preview · '+(isDemo()?'demo audio':'your file');
}
$('seek').addEventListener('input',()=>{const dur=isDemo()?demoLength():(audio.duration||0);if(dur){audio.currentTime=dur*$('seek').value/1000;prevT=audio.currentTime}});
function downloadCanvas(name){
  cv.toBlob(blob=>{
    if(!blob)return;
    const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  });
}

let mode = 'fade';
let style = 'sh';
let R = INK;
/* watercolor and the ink painting mode keep everything and end as a still image; the others let go of old marks */
const keeps = () => style === 'wc' || trigger === 'whole' || (style === 'ink' && mode === 'paint');
let file = null;
let fileUrl = '';
let demoUrl = '';
let complete = false;
let started = false;
let fading = false;
let starting = false;
let output = null;
const description = $('description');
const play = $('play');
const save = $('save');
const say = message => { $('status').textContent = message; };
const duration = 18;

function buildDemo() {
  const rate = 22050;
  const samples = new Float32Array(rate * duration);
  const chords = [[57,60,64,69],[53,57,60,65],[48,55,64,67],[55,59,62,71]];
  // Separate attacks, a quiet gap, then overlapping notes to show both ink behaviors.
  for (const [section, chord] of chords.entries()) {
    for (const [voice, midi] of chord.entries()) {
      const offset = Math.round(rate * (section * 4.25 + voice * (section < 2 ? .48 : .21)));
      const length = Math.round(rate * (section === 0 ? 1.4 : 2.9));
      const frequency = 440 * 2 ** ((midi - 69) / 12);
      for (let i = 0; i < length && offset + i < samples.length; i++) {
        const progress = i / length;
        const envelope = Math.min(1, i / (rate * .028)) * (1 - progress) ** 1.8;
        const phase = 2 * Math.PI * frequency * i / rate;
        samples[offset + i] += envelope * (.16 * Math.sin(phase) + .038 * Math.sin(phase * 2));
      }
    }
  }
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const wav = new DataView(buffer);
  for (const [offset, word] of [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']]) {
    [...word].forEach((char, index) => wav.setUint8(offset + index, char.charCodeAt(0)));
  }
  wav.setUint32(4, buffer.byteLength - 8, true);
  wav.setUint32(16, 16, true);
  wav.setUint16(20, 1, true);
  wav.setUint16(22, 1, true);
  wav.setUint32(24, rate, true);
  wav.setUint32(28, rate * 2, true);
  wav.setUint16(32, 2, true);
  wav.setUint16(34, 16, true);
  wav.setUint32(40, samples.length * 2, true);
  samples.forEach((sample, index) => wav.setInt16(44 + index * 2, Math.round(clamp(sample, -1, 1) * 32767), true));
  return URL.createObjectURL(new Blob([buffer], {type:'audio/wav'}));
}

function sizeCanvas() {
  const {width, height} = cv.getBoundingClientRect();
  W = Math.max(1, width);
  H = Math.max(1, height);
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function describe() {
  description.textContent = complete ? 'Your painting is ready to save.' : LEAD[trigger];
  $('subnote').textContent = complete ? '' : style === 'wc' ? 'Layered Watercolor: each note adds a wash. ' + WC_TEX.label()
    : style === 'sh' ? 'Musical Shapes: forms arrive with each note, then recede.'
    : style === 'glass' ? (GLASS.ok ? 'Glass Diamond: the stone turns with the music and takes its colors from it.' : 'Glass Diamond is not available in this browser.')
    : 'Ink Clouds: clouds stay and layer into a painting.';
}

function syncUI() {
  play.textContent = audio.paused
    ? audio.ended ? 'Replay' : started ? 'Resume' : file ? 'Play song' : 'Play demo'
    : 'Pause';
  $('restart').hidden = !started;
  $('demo').hidden = !file;
  save.hidden = !complete;
  const dur = isDemo() ? demoLength() : (audio.duration || 0), cur = audio.currentTime || 0;
  const mmss = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
  $('clock').textContent = mmss(cur) + (dur ? ' / ' + mmss(dur) : '');
  if (document.activeElement !== $('seek')) $('seek').value = dur ? Math.round(1000 * cur / dur) : 0;
  const head = $('head'); if (head) head.style.left = (dur ? 100 * cur / dur : 0) + '%';
}

function reset() {
  audio.pause();
  if (audio.readyState) audio.currentTime = 0;
  complete = started = fading = false;
  prevB?.fill(0);
  fluxAvg = lastOn = 0;
  INK.seed = 7;
  /* each trigger may need the known-parts demo; the default Notes view keeps the preferred 18-second demo */
  if (!file && demoKind !== wantKind()) {
    demoKind = wantKind();
    if (audio.getAttribute('src')) audio.src = urlFor(demoKind);
    $('track').textContent = $('track').title = demoLabel();
  }
  prevT = 0;
  estimateReset();
  shownChord = '';
  LAYOUT.hold = trigger === 'whole';
  LAYOUT.tight = trigger === 'whole' && style === 'wc';
  LAYOUT.x = null; LAYOUT.xs = .05; LAYOUT.band = 1; LAYOUT.size = 1;
  INK.pigmentKeep = effectiveMode() === 'paint' ? 1 : .99;
  INK_GL.look.fade = effectiveMode() === 'paint' ? 1 : .9988;
  INK_GL.look.erode = effectiveMode() === 'paint' ? 0 : .0004;
  R = style === 'wc' ? WC : style === 'sh' ? SH : style === 'glass' ? GLASS : INK;
  $('styleSel').value = style;
  renderSource();
  renderLegend();
  R.init();
  describe();
  syncUI();
}

function selectFile(nextFile) {
  const oldFileUrl = fileUrl;
  file = nextFile;
  fileUrl = file ? URL.createObjectURL(file) : '';
  if (fileUrl) audio.src = fileUrl;
  else {
    audio.removeAttribute('src');
    audio.load();
  }
  if (oldFileUrl) URL.revokeObjectURL(oldFileUrl);
  reset();
  $('track').textContent = file ? file.name : demoLabel();
  $('track').title = $('track').textContent;
}

async function togglePlayback() {
  if (!audio.paused) {
    audio.pause();
    return;
  }
  if (starting) return;
  starting = true;
  play.disabled = true;
  try {
    if (audio.ended) reset();
    if (!audio.getAttribute('src')) {
      audio.src = urlFor(demoKind);
    }
    ensureAC();
    if (!elSrc) {
      elSrc = AC.createMediaElementSource(audio);
      output = AC.createGain();
      output.gain.value = Number($('mute').getAttribute('aria-pressed') === 'false');
      elSrc.connect(analyser);
      elSrc.connect(output);
      output.connect(AC.destination);
    }
    await audio.play();
    started = true;
  } catch (error) {
    if (error.name !== 'AbortError') {
      description.textContent = 'This audio could not play. Try the demo or an MP3 or WAV file.';
      say(description.textContent);
    }
  } finally {
    starting = false;
    play.disabled = false;
    syncUI();
  }
}

/* until the visitor picks a style, each trigger opens in its suggested style; once they pick one, it stays */
let styleChosen = false;
/* restart the music after a change; if a restart is already under way, wait for it rather than giving up */
const resume = () => { if (starting) setTimeout(resume, 60); else if (audio.paused) togglePlayback(); };
$('styleSel').addEventListener('change', () => {
  const wasPlaying = !audio.paused;
  style = $('styleSel').value; styleChosen = true;
  reset();
  if (wasPlaying) resume();
  say('Style changed. The same track ' + (wasPlaying ? 'is playing again from the beginning.' : 'is ready to play from the beginning.'));
});
document.querySelectorAll('input[name=trigger]').forEach(input => {
  input.addEventListener('change', () => {
    const wasPlaying = !audio.paused;
    trigger = input.value;
    if (!styleChosen) style = DEFAULTS[trigger].style;   /* each trigger opens in the style that shows it best, unless one was picked by hand */
    mode = DEFAULTS[trigger].mode;
    reset();
    /* if music was playing, keep it going (from the start, since the picture starts over) */
    if (wasPlaying) resume();
    say(TRIGGER_NAMES[trigger] + ' selected. The track is ready to play from the beginning.');
  });
});
$('snapshot').addEventListener('click', () => {
  const t = Math.floor(audio.currentTime || 0);
  downloadCanvas('the-sound-of-color-snapshot-' + style + '-' + trigger + '-' + Math.floor(t / 60) + 'm' + String(t % 60).padStart(2, '0') + 's.png');
  say('Snapshot saved. The music keeps playing.');
});
$('choose').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', event => {
  const [nextFile] = event.target.files;
  if (nextFile) selectFile(nextFile);
  event.target.value = '';
});
$('demo').addEventListener('click', () => selectFile(null));
$('mute').addEventListener('click', event => {
  const button = event.currentTarget;
  const muted = button.getAttribute('aria-pressed') === 'false';
  button.setAttribute('aria-pressed', String(muted));
  if (output) output.gain.value = muted ? 0 : 1;
});
play.addEventListener('click', togglePlayback);
$('restart').addEventListener('click', () => { reset(); togglePlayback(); });
for (const event of ['play','pause','timeupdate']) audio.addEventListener(event, syncUI);
audio.addEventListener('ended', () => {
  complete = keeps();
  fading = !complete;
  if (fading) INK_GL.look.fade = .9925;
  describe();
  syncUI();
  say(complete ? 'Painting complete. Save it as an image.' : 'The song has ended.');
});
save.addEventListener('click', () => {
  cv.toBlob(blob => {
    if (!blob) return;
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'the-sound-of-color-painting.png';
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const still = complete || style === 'wc' ? document.createElement('canvas') : null;
    if (still) {
      still.width = cv.width;
      still.height = cv.height;
      still.getContext('2d').drawImage(cv, 0, 0);
    }
    sizeCanvas();
    if (still) g.drawImage(still, 0, 0, W, H);
    else R.resize();
    if (welcoming()) backdrop();
  }, 120);
});

let lastFrame = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const interval = 1000 / (R.fps || 36);
  if (now - lastFrame < interval - 1 || complete || (audio.paused && !fading)) return;
  lastFrame = now - (now - lastFrame) % interval;
  if (!audio.paused && analyser) {
    // A chord can produce several clouds, but repeated octaves share the same color (done inside buildFrame).
    const frame = buildFrame(now);
    R.frame(frame);
    updateChordReadout();
  }
  R.step(1 / 36);
  if (fading && R.idle()) {
    fading = false;
    R.init();
  }
}
/* local experiment only: lets a tester adjust the look from the browser console */
window.__inkLab = {HOME_TEST: (im) => { HOME.wide = im; backdrop(); }, GLASS, WC_TEX, INK, WC, SH, LAYOUT, pitchSlot, chordFrame, instrumentFrame, ORIG_CHORDS, KNOWN_CHORDS, estimateChord, estimateReset, state: () => ({style, trigger, mode, complete, demoKind}) };
/* optional second direction for review: add ?look=glaze for thinner, see-through ink that mixes where clouds overlap */
if (/[?&]look=glaze\b/.test(location.search)) Object.assign(INK_GL.look, {dense:1.5, pale:.5, crease:.5, broad:.06});
/* when the texture files arrive, repaint the empty paper and update the note, unless a song is already painting */
/* ---------- controls stay out of the artwork ----------
   While music plays, the controls fade out after 2.5 seconds without movement and come back when the pointer moves.
   Hide controls (or H, or a tap on the artwork) clears them at any time, including over a finished painting; a tap
   or any key brings them back. Keyboard focus inside the controls always keeps them visible. */
let calmTimer = 0, calmBy = '';
const controlsHot = () => !!document.querySelector('.top :focus-visible, .dock :focus-visible, .top:hover, .dock:hover, select:focus');
function calm(by) { document.body.classList.add('calm'); calmBy = by; clearTimeout(calmTimer); }
function wake(fromMove) {
  if (fromMove && calmBy === 'manual') return;
  if (document.body.classList.contains('calm')) { document.body.classList.remove('calm'); calmBy = ''; }
  clearTimeout(calmTimer);
  if (!audio.paused) calmTimer = setTimeout(() => { if (!audio.paused && !controlsHot()) calm('auto'); else wake(); }, 2500);
}
window.addEventListener('pointermove', () => wake(true), {passive: true});
window.addEventListener('focusin', () => wake());
window.addEventListener('keydown', event => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || event.metaKey || event.ctrlKey || event.altKey) { wake(); return; }
  const k = event.key.toLowerCase();
  if (welcoming()) return;
  if (k === 'h') { document.body.classList.contains('calm') ? wake() : calm('manual'); return; }
  if (k === 'f') { $('fs').click(); return; }
  wake();
});
$('main').addEventListener('pointerdown', event => {
  if (event.button !== 0 || welcoming()) return;
  document.body.classList.contains('calm') ? wake() : calm('manual');
});
$('hide').addEventListener('click', () => calm('manual'));
audio.addEventListener('play', () => wake());
for (const e of ['pause', 'ended']) audio.addEventListener(e, () => { if (calmBy === 'auto') wake(); clearTimeout(calmTimer); });
$('fs').addEventListener('click', () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  const req = document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject();
  req.catch(() => say('Full screen is blocked in this view. Open the page in its own browser tab.'));
});
document.addEventListener('fullscreenchange', () => { $('fs').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

/* ---------- welcome screen ----------
   Behind the title sits one painting generated by Codex (see design-previews/home-image-brief.md), stretched to
   cover the screen. Until those files exist, plain paper with a faint glow of colour at the edges. Nothing is
   drawn from the music here and no sound is made; pressing Play clears it and the real song paints. */
const welcoming = () => document.body.classList.contains('welcoming');
const HOME = { wide: null, tall: null };
for (const k of ['wide', 'tall']) {
  const im = new Image();
  im.onload = () => { HOME[k] = im; backdrop(); };
  im.src = '../../assets/home/home-' + k + '.jpg';
}
function backdrop() {
  if (!welcoming()) return;
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#faf8f5'; g.fillRect(0, 0, W, H);
  const im = (H > W && HOME.tall) || HOME.wide || HOME.tall;
  if (im) {
    /* cover the screen without stretching, centred */
    const k = Math.max(W / im.naturalWidth, H / im.naturalHeight), w = im.naturalWidth * k, h = im.naturalHeight * k;
    g.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
    return;
  }
  const glow = (x, y, r, c) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(250,248,245,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H); };
  const M = Math.max(W, H);
  glow(0, 0, M * .45, 'rgba(64,190,232,.16)'); glow(W, 0, M * .45, 'rgba(255,150,60,.13)');
  glow(W, H, M * .45, 'rgba(170,80,220,.14)'); glow(0, H, M * .45, 'rgba(90,200,110,.13)');
}
function syncWelcome() {
  document.querySelectorAll('#wtrig button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === trigger)));
  document.querySelectorAll('#wstyle button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.s === style));
    b.toggleAttribute('data-suggested', b.dataset.s === DEFAULTS[trigger].style);
  });
  $('wplaylabel').textContent = file ? 'Play your song' : 'Play the demo';
  $('wsub').textContent = file ? file.name + ' · sound starts only when you press Play.' : 'Sound starts only when you press Play.';
}
function leaveWelcome() { document.body.classList.remove('welcoming'); wake(); }
document.querySelectorAll('#wtrig button').forEach(b => b.addEventListener('click', () => {
  const input = document.querySelector('input[name=trigger][value="' + b.dataset.t + '"]');
  if (input && !input.checked) { input.checked = true; input.dispatchEvent(new Event('change')); }
  syncWelcome(); backdrop();
}));
/* any style can be chosen for any trigger, and the choice stays when the trigger changes */
document.querySelectorAll('#wstyle button').forEach(b => b.addEventListener('click', () => {
  $('styleSel').value = b.dataset.s; $('styleSel').dispatchEvent(new Event('change'));
  syncWelcome(); backdrop();
}));
$('wplay').addEventListener('click', () => { leaveWelcome(); reset(); togglePlayback(); });
$('wchoose').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', () => { if (welcoming()) { syncWelcome(); backdrop(); } });

/* the More menu: opens above its button, closes on any choice, outside click or Escape */
const menu = $('moremenu'), morebtn = $('morebtn');
const setMenu = open => { menu.hidden = !open; morebtn.setAttribute('aria-expanded', String(open)); };
morebtn.addEventListener('click', e => { e.stopPropagation(); setMenu(menu.hidden); });
menu.addEventListener('click', e => { if (e.target.closest('button')) setMenu(false); });
document.addEventListener('pointerdown', e => { if (!menu.hidden && !e.target.closest('.more')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { setMenu(false); morebtn.focus(); } });
const calmMenu = calm; calm = by => { setMenu(false); calmMenu(by); };

window.__wcTexReady = () => { if (welcoming()) backdrop(); else if (style === 'wc' && !started) R.init(); describe(); };
if (WC_TEX.state !== 'loading') window.__wcTexReady();
sizeCanvas();
reset();
syncWelcome();
backdrop();
requestAnimationFrame(loop);
})();
</script>
</html>
