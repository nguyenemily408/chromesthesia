<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sound of Color · Three styles, five triggers (local comparison)</title>
<style>
  *{box-sizing:border-box}
  :root{font:14px/1.4 "Instrument Sans",system-ui,sans-serif;color:#20201e;background:white}
  body{margin:0}
  main{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  header,footer{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:#fffffff2;box-shadow:0 6px 24px #2516301f;border-radius:16px;padding:10px 14px}
  header{top:10px}
  footer{bottom:10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  h1{font:normal clamp(1.4rem,3vw,1.9rem)/1.1 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;margin:0 0 8px;text-align:center}
  .row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .row>b{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#6b5f70;min-width:5.5em;text-align:right;font-weight:600}
  fieldset{border:0;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  label,button{font:inherit;cursor:pointer;border:1px solid #d6cadb;border-radius:99px;background:white;color:#2b1e32;padding:4px 11px}
  button:hover,label:hover{background:#f4edf8}
  label:has(:checked),#play{background:#382343;color:white;border-color:#382343}
  label:has(:disabled){opacity:.45;cursor:not-allowed}
  input[type=radio],.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  :focus-visible,label:has(:focus-visible){outline:2px solid #7832a1;outline-offset:3px}
  #play:disabled{opacity:.6;cursor:wait}
  p{margin:6px 0 0;color:#514754;font-size:.84rem;text-align:center;max-width:78ch}
  #badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}
  #badge.demo{background:#ffe9b8;color:#6a4300}
  #badge.est{background:#d9ecff;color:#0b4a82}
  #badge.na{background:#f3d6d6;color:#7a1d1d}
  #legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-size:.78rem;color:#514754;min-height:1.3em}
  #legend span{display:inline-flex;align-items:center;gap:4px}
  #legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0002}
  #legend .bar{width:140px;height:10px;border-radius:5px;border:0}
  #chord{font-weight:600;color:#20201e}
  #track{font-size:.8rem;color:#514754;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #clock{font-size:.8rem;color:#514754;font-variant-numeric:tabular-nums;min-width:6.5ch}
  #seek{width:min(220px,30vw);accent-color:#382343}
  [hidden]{display:none!important}
</style>
<main><canvas id="cv" role="img" aria-label="Music-reactive artwork in the chosen style"></canvas></main>
<header>
  <h1>The Sound of Color</h1>
  <div class="row"><b>Style</b>
    <fieldset><legend class="sr-only">Visual style</legend>
      <label><input type="radio" name="style" value="wc">Layered Watercolor</label>
      <label><input type="radio" name="style" value="ink" checked>Ink Clouds</label>
      <label><input type="radio" name="style" value="sh">Musical Shapes</label>
    </fieldset></div>
  <div class="row"><b>Driven by</b>
    <fieldset><legend class="sr-only">What drives the artwork</legend>
      <label><input type="radio" name="trigger" value="notes" checked>Notes</label>
      <label><input type="radio" name="trigger" value="pitch">Pitch</label>
      <label><input type="radio" name="trigger" value="instruments">Instruments</label>
      <label><input type="radio" name="trigger" value="harmony">Harmony</label>
      <label><input type="radio" name="trigger" value="whole">Whole Song</label>
    </fieldset></div>
  <div class="row" id="inkRow"><b>Ink</b>
    <fieldset><legend class="sr-only">Ink behavior</legend>
      <label><input type="radio" name="mode" value="fade" checked>Fade with music</label>
      <label><input type="radio" name="mode" value="paint">Build a painting</label>
    </fieldset></div>
  <p id="description"></p>
  <p id="source"></p>
  <div id="legend" aria-live="polite"></div>
</header>
<footer aria-label="Playback">
  <button type="button" id="play">Play demo</button>
  <button type="button" id="restart" hidden>Start over</button>
  <button type="button" id="choose">Choose a song</button>
  <button type="button" id="demo" hidden>Use demo</button>
  <button type="button" id="estimate" hidden aria-pressed="false">Demo chords: known</button>
  <button type="button" id="mute" aria-pressed="false">Mute</button>
  <button type="button" id="snapshot" title="Download a PNG of the artwork right now. The music keeps playing.">Snapshot</button>
  <button type="button" id="save" hidden>Save painting</button>
  <span id="track">20-second demo</span>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Song position">
  <span id="clock">0:00</span>
  <span class="sr-only" id="status" role="status"></span>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" hidden>
  <audio id="audio" preload="metadata"></audio>
</footer>
<script>
(() => {
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d'), audio=$('audio');
let W=0,H=0,DPR=1;
const NOTE=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

/* ---------- color: pitch class -> hue, walking the circle of fifths so related notes sit side by side ---------- */
const hueOf=pc=>((pc*7)%12)*30;
/* v = vividness 0..1. Low v gives a greyed, dull pigment; high v gives full neon. */
function vivid(n,F){return clamp(n.s*.55+F.bright*.35+F.energy*.25+(n.midi>72?.1:0)-(n.midi<50?.28:0))}
const yOf=m=>H*(.93-.86*clamp((m-36)/60));

/* ---------- canvas ---------- */
const INK_CPU={
  surface:document.createElement('canvas'),drops:[],time:0,lastDrop:0,quiet:0,
  init(){
    const cell=Math.max(3,Math.sqrt(W*H/29000));
    this.cols=Math.max(8,Math.round(W/cell));
    this.rows=Math.max(8,Math.round(H/cell));
    const {cols,rows}=this;
    this.surface.width=cols;this.surface.height=rows;
    this.ctx=this.surface.getContext('2d');
    this.pixels=this.ctx.createImageData(cols,rows);
    const field=()=>new Float32Array(cols*rows);
    this.u=field();this.v=field();this.uNext=field();this.vNext=field();
    this.pressure=field();this.divergence=field();this.curl=field();
    this.dye=[field(),field(),field()];this.dyeNext=[field(),field(),field()];
    this.reverse=field();
    this.drops=[];this.time=0;this.lastDrop=-2;this.quiet=0;this.wet=false;
    this.draw();
  },
  release(x,y,hue,strength=1,delay=0){
    this.drops.push({x:clamp(x,.01,.99)*this.cols,y:clamp(y,.015,.94)*this.rows,
      hue,strength,age:-delay,fall:.48,side:x<.5?1:-1});
    this.lastDrop=this.time;
    this.quiet=0;this.wet=true;
  },
  frame(F){
    if(!F||F.energy<.035||this.time-this.lastDrop<(F.onset?.28:.48))return;
    const notes=F.notes.filter(n=>n.s>.22).slice(0,4);
    for(const [i,note] of notes.entries()){
      this.release(LAYOUT.x==null?rnd(.03,.97):clamp(LAYOUT.x+rnd(-LAYOUT.xs,LAYOUT.xs),.03,.97),clamp(yOf(note.midi)/H,.08,.85),
        hueOf(note.pc),.8+note.s*.75+F.energy*.5,i*.08);
    }
  },
  deposit(drop,dt){
    const {cols,rows,u,v,dye}=this;
    const age=drop.age-drop.fall;
    const progress=clamp(age/.76);
    const fade=Math.sin(Math.PI*(.17+.83*progress));
    const scale=Math.min(cols,rows);
    const r=Math.max(2.8,scale*(.047+.039*progress)*drop.strength);
    const x=drop.x+drop.side*(progress*r*.91+Math.sin(progress*8.1)*r*.24);
    const y=drop.y+progress*scale*.14;
    const h=drop.hue/60;
    const k=n=>(n+h)%6;
    const rgb=[5,3,1].map(n=>.96-.84*Math.max(0,Math.min(k(n),4-k(n),1)));
    for(let j=Math.max(1,Math.floor(y-r*2));j<Math.min(rows-1,y+r*2);j++){
      for(let i=Math.max(1,Math.floor(x-r*2));i<Math.min(cols-1,x+r*2);i++){
        const dx=(i-x)/r,dy=(j-y)/r,d=dx*dx+dy*dy;
        if(d>4)continue;
        const p=i+j*cols,weight=Math.exp(-2.3*d)*fade;
        const amount=weight*dt*10*drop.strength;
        for(let c=0;c<3;c++)dye[c][p]=Math.min(4,dye[c][p]+amount*(1-rgb[c]));
        const ring=Math.exp(-.89*d)*fade;
        u[p]+=(drop.side*.19+dx*.41-dy*.45*drop.side)*ring*dt*21;
        v[p]+=(.65+dx*.46*drop.side+dy*.17)*ring*dt*19;
      }
    }
  },
  advect(source,target,loss,direction=1){
    const {cols,rows,u,v}=this;
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const p=x+y*cols;
      const bx=clamp(x-u[p]*direction*.28,.5,cols-1.5),by=clamp(y-v[p]*direction*.28,.5,rows-1.5);
      const ix=Math.floor(bx),iy=Math.floor(by),fx=bx-ix,fy=by-iy,b=ix+iy*cols;
      const a=source[b]+(source[b+1]-source[b])*fx;
      const c=source[b+cols]+(source[b+cols+1]-source[b+cols])*fx;
      target[p]=(a+(c-a)*fy)*loss;
    }
  },
  movePigment(source,target){
    const {cols,rows,u,v,reverse}=this;
    this.advect(source,target,1);
    this.advect(target,reverse,1,-1);
    // Recover detail lost during interpolation without adding new color peaks.
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const p=x+y*cols;
      const bx=Math.floor(clamp(x-u[p]*.28,.5,cols-1.5));
      const by=Math.floor(clamp(y-v[p]*.28,.5,rows-1.5));
      const i=bx+by*cols;
      const a=source[i],b=source[i+1],c=source[i+cols],d=source[i+cols+1];
      target[p]=clamp(target[p]+.5*(source[p]-reverse[p]),
        Math.min(a,b,c,d),Math.max(a,b,c,d))*this.pigmentKeep;
    }
  },
  moveWater(){
    const {cols,rows,u,v,pressure,divergence,curl,dye}=this;
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const i=x+y*cols;
      curl[i]=.5*(v[i+1]-v[i-1]-u[i+cols]+u[i-cols]);
    }
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const i=x+y*cols;
      const dx=Math.abs(curl[i+1])-Math.abs(curl[i-1]);
      const dy=Math.abs(curl[i+cols])-Math.abs(curl[i-cols]);
      const spin=curl[i]*.25/(Math.sqrt(dx*dx+dy*dy)+.001);
      u[i]=clamp(u[i]+dy*spin,-3,3);
      v[i]=clamp(v[i]-dx*spin+.017*Math.min(2,dye[0][i]+dye[1][i]+dye[2][i]),-3,3);
    }
    this.advect(u,this.uNext,.994);this.advect(v,this.vNext,.994);
    [this.u,this.uNext]=[this.uNext,u];[this.v,this.vNext]=[this.vNext,v];

    const nextU=this.u,nextV=this.v;
    pressure.fill(0);
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const i=x+y*cols;
      divergence[i]=.5*(nextU[i+1]-nextU[i-1]+nextV[i+cols]-nextV[i-cols]);
    }
    for(let pass=0;pass<9;pass++){
      for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
        const i=x+y*cols;
        pressure[i]=(pressure[i-1]+pressure[i+1]+pressure[i-cols]+pressure[i+cols]-divergence[i])*.25;
      }
    }
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const i=x+y*cols;
      nextU[i]-=.5*(pressure[i+1]-pressure[i-1]);
      nextV[i]-=.5*(pressure[i+cols]-pressure[i-cols]);
    }
  },
  step(dt){
    this.time+=dt;
    if(!this.wet)return;
    this.quiet+=dt;
    for(const drop of this.drops){
      drop.age+=dt;
      if(drop.age>=drop.fall)this.deposit(drop,dt);
    }
    this.drops=this.drops.filter(drop=>drop.age<drop.fall+.76);
    this.moveWater();
    for(let c=0;c<3;c++)this.movePigment(this.dye[c],this.dyeNext[c]);
    [this.dye,this.dyeNext]=[this.dyeNext,this.dye];
    if(this.quiet>75){this.wet=false;return}
    this.draw();
  },
  draw(){
    const {cols,rows,dye,pixels}=this;
    g.globalCompositeOperation='source-over';
    g.fillStyle='#fff';g.fillRect(0,0,W,H);
    if(this.lastDrop<0)return;
    const data=pixels.data;
    const [red,green,blue]=dye;
    for(let i=0;i<red.length;i++){
      const p=i*4;
      const density=red[i]+green[i]+blue[i];
      if(density<.002){
        data[p]=data[p+1]=data[p+2]=data[p+3]=255;
        continue;
      }
      const up=i>=cols?i-cols:i,left=i%cols?i-1:i;
      const relief=clamp((density-red[up]-green[up]-blue[up])*.59+
        (density-red[left]-green[left]-blue[left])*.34,-.21,.18);
      const light=1+relief*.9;
      const spread=1.25+Math.min(1,density)*.23;
      const shade=1-Math.min(.14,density*.05);
      const transmission=d=>255*Math.exp(-d*spread)*light*shade;
      data[p]=transmission(red[i]);data[p+1]=transmission(green[i]);data[p+2]=transmission(blue[i]);data[p+3]=255;
    }
    this.ctx.putImageData(pixels,0,0);
    g.imageSmoothingQuality='medium';
    g.drawImage(this.surface,0,0,W,H);
    for(const drop of this.drops){
      if(drop.age<0||drop.age>drop.fall+.22)continue;
      const x=drop.x/cols*W,y=drop.y/rows*H;
      const q=clamp(drop.age/drop.fall);
      if(q<1){
        const fall=46*(1-q*q),r=3+drop.strength*2.6;
        g.fillStyle='hsl('+drop.hue+' 86% 46%)';
        g.beginPath();g.ellipse(x,y-fall,r,r*(1.08+q*.27),0,0,Math.PI*2);g.fill();
      }else{
        const spread=clamp((drop.age-drop.fall)/.22);
        g.strokeStyle='hsl('+drop.hue+' 80% 58% / '+((1-spread)*.47)+')';
        g.lineWidth=1;
        g.beginPath();g.ellipse(x,y,5+spread*27,1+spread*5,0,0,Math.PI*2);g.stroke();
      }
    }
  },
  resize(){
    if(!this.dye||this.lastDrop<0){this.init();return}
    const {cols,rows,dye,u,v,drops,time,lastDrop,quiet,wet}=this;
    this.init();
    const sx=this.cols/cols,sy=this.rows/rows;
    for(let y=1;y<this.rows-1;y++)for(let x=1;x<this.cols-1;x++){
      const to=x+y*this.cols,from=Math.floor(x/sx)+Math.floor(y/sy)*cols;
      this.u[to]=u[from]*sx;this.v[to]=v[from]*sy;
      for(let c=0;c<3;c++)this.dye[c][to]=dye[c][from];
    }
    for(const drop of drops){drop.x*=sx;drop.y*=sy}
    Object.assign(this,{drops,time,lastDrop,quiet,wet});
    this.draw();
  }
};

/* Ink in water, Fable experiment. The same idea as the baseline (water motion carries pigment), but run on the
   graphics card: pigment is tracked at roughly 25 times the baseline's detail, each cloud is poured slowly in
   uneven pulses so it folds into sheets, and the result is lit as soft, opaque paint clouds on white water.
   Add ?ink=cpu to the address to force the baseline for comparison. */
const INK_GL={
  fps:60,drops:[],swell:[],time:0,lastDrop:-2,quiet:0,wet:false,lost:false,seed:7,key:'',gl:null,P:null,
  canvas:document.createElement('canvas'),
  /* tuning: ink poured per frame, push given to fresh ink, how long water keeps moving, how long the push
     travels with the ink, pigment fade, swirl strength, then four shading controls */
  look:{size:1.45,ink:.07,swell:2.8,puffT:2,puffGap:.75,thrust:.0003,drift:.0006,drag:.992,carry:.995,fade:.99996,erode:0,curl:.5,fine:.008,broad:.09,crease:1,dense:4.5,pale:.3},
  recent:[],
  names:['dye','dye2','tmpA','tmpB','vel','vel2','curl','div','pr','pr2','half','quarter','blurA','blurB'],
  rand(){let t=this.seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296},
  r(a,b){return a+this.rand()*(b-a)},
  /* Match the twelve note colors shown in the legend. */
  tint(h,vividness=.85){
    const hue=((h%360)+360)%360/60;
    const light=.47,saturation=.5+.5*clamp(vividness);
    const amplitude=saturation*Math.min(light,1-light);
    return [0,8,4].map(offset=>{
      const k=(offset+hue*2)%12;
      return light-amplitude*Math.max(-1,Math.min(k-3,9-k,1));
    });
  },
  boot(){
    try{
      const gl=this.canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false});
      if(!gl||!(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float')))return false;
      this.gl=gl;this.build();
      const t=this.target(4,4),ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
      gl.deleteTexture(t.tex);gl.deleteFramebuffer(t.fbo);
      if(!ok)return false;
      this.canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();this.lost=true});
      this.canvas.addEventListener('webglcontextrestored',()=>{this.lost=false;this.key='';for(const n of this.names)this[n]=null;this.build();this.init()});
      return true;
    }catch(e){console.warn('Graphics-card ink is unavailable, using the baseline.',e);return false}
  },
  build(){
    const gl=this.gl;
    const VS='#version 300 es\nout vec2 vUv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}';
        const HEAD='#version 300 es\nprecision highp float;precision highp sampler2D;in vec2 vUv;out vec4 o;\n';
    const NB='uniform vec2 uTexel;\n#define vL (vUv-vec2(uTexel.x,0.))\n#define vR (vUv+vec2(uTexel.x,0.))\n#define vT (vUv+vec2(0.,uTexel.y))\n#define vB (vUv-vec2(0.,uTexel.y))\n';
    /* read the water's motion averaged over four neighboring cells; this removes a cell-sized zigzag the solver
       can leave behind, which otherwise shows up as saw-toothed cloud edges */
    const FLOW='uniform sampler2D uVel;uniform vec2 uScale,uHalf;vec2 flow(){return .25*(texture(uVel,vUv+uHalf).xy+texture(uVel,vUv-uHalf).xy+texture(uVel,vUv+vec2(uHalf.x,-uHalf.y)).xy+texture(uVel,vUv+vec2(-uHalf.x,uHalf.y)).xy);}\n';
    const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};
    const vs=sh(gl.VERTEX_SHADER,VS);
    const make=fs=>{const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,sh(gl.FRAGMENT_SHADER,HEAD+fs));gl.linkProgram(p);
      if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return {p,u:{}}};
    this.P={
      /* carry a field along the water's motion */
      advect:make(FLOW+'uniform sampler2D uSrc;uniform vec4 uKeep;void main(){o=texture(uSrc,vUv-flow()*uScale)*uKeep;}'),
      /* pigment only: undo most of the blur that carrying introduces, without inventing new color peaks */
      mac:make(FLOW+`uniform sampler2D uSrc,uFwd,uBack;uniform float uKeep,uErode;
        void main(){
          vec2 c=vUv-flow()*uScale,sz=vec2(textureSize(uSrc,0));
          ivec2 i=ivec2(floor(c*sz-.5)),z=ivec2(0),m=ivec2(sz)-1;
          vec4 a=texelFetch(uSrc,clamp(i,z,m),0),b=texelFetch(uSrc,clamp(i+ivec2(1,0),z,m),0),
               e=texelFetch(uSrc,clamp(i+ivec2(0,1),z,m),0),f=texelFetch(uSrc,clamp(i+1,z,m),0);
          vec4 v=texture(uFwd,vUv)+.5*(texture(uSrc,vUv)-texture(uBack,vUv));
          o=clamp(v,min(min(a,b),min(e,f)),max(max(a,b),max(e,f)))*uKeep;
          o*=min(1.,8./max(.001,o.a));
          /* fading mode: thin veils melt away first, so a cloud dissolves from its edges inward */
          o*=max(0.,o.a-uErode)/max(o.a,1e-5);
        }`),
      splat:make('uniform vec2 uPoint;uniform float uAspect,uRadius;uniform vec4 uValue;void main(){vec2 d=vUv-uPoint;d.x*=uAspect;o=uValue*exp(-dot(d,d)/(uRadius*uRadius));}'),
      curl:make(NB+'uniform sampler2D uVel;void main(){o=vec4(.5*(texture(uVel,vR).y-texture(uVel,vL).y-texture(uVel,vT).x+texture(uVel,vB).x));}'),
      /* strengthen small swirls, and let fresh ink push the water in the direction it was poured */

/* =====================================================================================================
   Three styles, five triggers. Everything above this line is existing code: the ink renderer comes from
   ink-next.html, the watercolor and shapes renderers and the paint() color helper from index.html, and the
   audio analysis from ink-next.html. Everything below is the comparison wrapper.
   ===================================================================================================== */

/* Layout hints the triggers can give the renderers. x null = the renderer chooses; otherwise 0..1 across the
   canvas. xs = how far a mark may stray sideways, band = how far it may stray up and down (1 = original). */
const LAYOUT={x:null,xs:.05,band:1,hold:false,prog:0,size:1};
const STYLES={wc:WC,ink:INK,sh:SH};
const STYLE_NAME={wc:'Layered Watercolor',ink:'Ink Clouds',sh:'Musical Shapes'};
/* the style that shows each trigger most clearly; offered as a one-click suggestion, never forced */
const SUGGEST={notes:'sh',pitch:'sh',instruments:'ink',harmony:'wc',whole:'wc'};

const params=new URLSearchParams(location.search);
let style=STYLES[params.get('style')]?params.get('style'):'ink';
let trigger=['notes','pitch','instruments','harmony','whole'].includes(params.get('trigger'))?params.get('trigger'):'notes';
let mode='fade';           /* the ink behavior the listener picked */
let file=null,fileUrl='',demoUrl='';
let complete=false,started=false,fading=false,starting=false,settle=0,output=null;
let estimateDemo=false;    /* demo only: estimate the chords from the audio instead of using the known ones */
const description=$('description'),play=$('play'),save=$('save');
const say=m=>{$('status').textContent=m};
const DURATION=20;

/* ---------- the known demo: four separately generated instrument parts over four known chords ---------- */
const CHORDS=[
  {name:'Am',root:9,minor:true, t:0, pad:[57,60,64],bass:45,mel:[69,72,76,81]},
  {name:'F', root:5,minor:false,t:5, pad:[57,60,65],bass:41,mel:[72,77,81,84]},
  {name:'C', root:0,minor:false,t:10,pad:[55,60,64],bass:48,mel:[84,79,76,72]},
  {name:'G', root:7,minor:false,t:15,pad:[55,59,62],bass:43,mel:[71,67,62,59]}];
/* each part has its own color. pc is the note slot whose hue we borrow: hue = ((pc*7)%12)*30 */
const PARTS={
  bass: {label:'Bass', pc:8, gain:1},
  pad:  {label:'Pad',  pc:11,gain:.75},
  pluck:{label:'Pluck',pc:7, gain:.85},
  bell: {label:'Bell melody',pc:5,gain:1}};
const EVENTS=[];
for(const c of CHORDS){
  for(const o of [0,2.5])EVENTS.push({part:'bass',t:c.t+o,dur:2.3,midi:c.bass});
  for(const m of c.pad)EVENTS.push({part:'pad',t:c.t,dur:5,midi:m});
  for(let k=0;k<8;k++)EVENTS.push({part:'pluck',t:c.t+.3+k*.6,dur:.55,midi:c.pad[[0,1,2,1,0,1,2,1][k]]+12});
  c.mel.forEach((m,k)=>EVENTS.push({part:'bell',t:c.t+.2+k*1.2,dur:1.1,midi:m}));
}
EVENTS.sort((a,b)=>a.t-b.t);

const TIMBRE={
  bass:(f,tau)=>.34*Math.min(1,tau/.01)*Math.exp(-tau*1.3)*(Math.sin(2*Math.PI*f*tau)+.35*Math.sin(4*Math.PI*f*tau)),
  pad:(f,tau,d)=>.07*Math.min(1,tau/.6)*Math.min(1,(d-tau)/.6)*(Math.sin(2*Math.PI*f*tau)+Math.sin(2*Math.PI*f*1.004*tau))*.5,
  pluck:(f,tau)=>.13*Math.min(1,tau/.004)*Math.exp(-tau*7)*(Math.sin(2*Math.PI*f*tau)+.5*Math.sin(4*Math.PI*f*tau)+.25*Math.sin(6*Math.PI*f*tau)),
  bell:(f,tau)=>.16*Math.min(1,tau/.004)*Math.exp(-tau*2.6)*(Math.sin(2*Math.PI*f*tau)+.4*Math.exp(-tau*3)*Math.sin(2*Math.PI*f*2.76*tau)+.25*Math.exp(-tau*5)*Math.sin(2*Math.PI*f*5.4*tau))};
/* each part is rendered into its own buffer first (this is what makes the demo's instruments "known"), then mixed */
function buildDemoParts(rate){
  const parts={};
  for(const p of Object.keys(PARTS)){
    const buf=new Float32Array(rate*DURATION);
    for(const e of EVENTS)if(e.part===p){
      const f=440*2**((e.midi-69)/12),o=Math.round(e.t*rate),n=Math.round(e.dur*rate);
      for(let i=0;i<n&&o+i<buf.length;i++)buf[o+i]+=TIMBRE[p](f,i/rate,e.dur);
    }

  }

function buildDemo(){
  const rate=22050,parts=buildDemoParts(rate),mix=new Float32Array(rate*DURATION);
  for(const p in parts)for(let i=0;i<mix.length;i++)mix[i]+=parts[p][i];
  const buffer=new ArrayBuffer(44+mix.length*2),wav=new DataView(buffer);
  for(const [o,w] of [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']])[...w].forEach((c,i)=>wav.setUint8(o+i,c.charCodeAt(0)));
  wav.setUint32(4,buffer.byteLength-8,true);wav.setUint32(16,16,true);wav.setUint16(20,1,true);wav.setUint16(22,1,true);
  wav.setUint32(24,rate,true);wav.setUint32(28,rate*2,true);wav.setUint16(32,2,true);wav.setUint16(34,16,true);wav.setUint32(40,mix.length*2,true);
  mix.forEach((s,i)=>wav.setInt16(44+i*2,Math.round(clamp(s,-1,1)*32767),true));
  return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));

/* A frame built from the demo's known events instead of from listening. Same shape as the analysis output. */
function demoFrame(t,prev){
  const F={notes:[],chroma:new Float32Array(12),energy:.55,bass:.35,bright:.5,onset:false,flux:.12};
  if(!(t>=prev&&t-prev<.3))prev=t-.02;               /* a seek or a stall is not an attack */
  const chord=[...CHORDS].reverse().find(c=>t>=c.t)||CHORDS[0];
  if(trigger==='instruments'){
    for(const p of Object.keys(PARTS)){
      const e=EVENTS.filter(x=>x.part===p&&t>=x.t&&t<x.t+x.dur).sort((a,b)=>b.t-a.t)[0];
      if(!e)continue;
      const s=clamp(PARTS[p].gain*(1-.6*(t-e.t)/e.dur));
      F.notes.push({midi:e.midi,pc:PARTS[p].pc,s,v:clamp(.5+.4*s)});
    }
    F.notes.sort((a,b)=>b.s-a.s);
    const hit=EVENTS.filter(e=>e.t>prev&&e.t<=t);
    F.onset=hit.length>0;F.flux=hit.length?.55:.1;
    F.bass=F.notes.some(n=>n.pc===PARTS.bass.pc)?.6:.2;
  }else{                                              /* harmony: the chord's own tones, re-struck every 1.25 s */
    const since=(t-chord.t)%1.25;
    const tones=[chord.root,(chord.root+(chord.minor?3:4))%12,(chord.root+7)%12];
    tones.forEach((pc,i)=>F.notes.push({midi:chord.pad.find(m=>m%12===pc),pc,s:[1,.8,.7][i]*(1-.25*since/1.25),v:clamp((chord.minor?.52:.85)+(i?0:.1))}));
    F.onset=Math.floor(t/1.25)!==Math.floor(prev/1.25);F.flux=F.onset?.5:.1;
    harmonyNow={name:chord.name,tones,minor:chord.minor,how:'known'};
  }
  return F;
}

/* ---------- harmony estimate for uploaded audio: match smoothed pitch-class strength to 24 major and minor triads ---------- */
const TRIADS=[];
for(let r=0;r<12;r++)for(const minor of [false,true]){
  const v=new Float32Array(12);v[r]=1;v[(r+(minor?3:4))%12]=1;v[(r+7)%12]=1;
  TRIADS.push({v,r,minor,name:NOTE[r]+(minor?'m':''),tones:[r,(r+(minor?3:4))%12,(r+7)%12]});
}
const est={acc:new Float32Array(12),cand:-1,count:0,now:null};
function estimateReset(){est.acc.fill(0);est.cand=-1;est.count=0;est.now=null}
function estimateChord(F){
  const a=est.acc;let mag=0;
  for(let i=0;i<12;i++){a[i]=a[i]*.92+F.chroma[i]*.08;mag+=a[i]*a[i]}
  mag=Math.sqrt(mag);
  if(mag<.12){est.now=null;est.cand=-1;est.count=0;return null}
  let best=-1,bs=0,second=0;
  TRIADS.forEach((t,i)=>{let d=0;for(let k=0;k<12;k++)d+=a[k]*t.v[k];const s=d/(mag*Math.sqrt(3));
    if(s>bs){second=bs;bs=s;best=i}else if(s>second)second=s});
  /* reasonable confidence = a strong match, clearly ahead of the runner-up, held for a third of a second */
  const sure=bs>.8&&bs-second>.05;
  if(sure&&best===est.cand)est.count++;else{est.cand=sure?best:-1;est.count=sure?1:0}
  if(est.count>=12)est.now={name:TRIADS[best].name,tones:TRIADS[best].tones,minor:TRIADS[best].minor,conf:bs,how:'estimate'};
  return est.now;

/* ---------- pitch: low to high runs violet, blue, cyan, green, lime, yellow, orange, pink ---------- */
const PITCH_HUES=[270,240,210,180,150,120,60,30,330];
const slotForHue=h=>((h/30)*7)%12;
const pitchSlot=midi=>slotForHue(PITCH_HUES[Math.round((PITCH_HUES.length-1)*clamp((midi-40)/48))]);

let harmonyNow=null,prevT=0;

const isDemo=()=>!file;
const progress=()=>clamp((audio.currentTime||0)/(isDemo()?DURATION:(audio.duration||DURATION)));

const effectiveInk=()=>trigger==='whole'?'paint':mode;

/* one frame of artwork information for the current trigger */
function buildFrame(now){
  const t=audio.currentTime||0;

  if(timelineDriven())F=demoFrame(t,prevT);
  else{
    F=analyse(now);
    if(trigger==='harmony'){
      const c=estimateChord(F);
      if(c){
        harmonyNow=c;
        F.notes=c.tones.map((pc,i)=>({midi:52+((pc-4+12)%12),pc,s:[1,.8,.7][i]*clamp(.55+F.energy),v:clamp((c.minor?.52:.85)+(i?0:.1))}));
        F.onset=F.onset||(c.name!==(buildFrame.last||''));
        buildFrame.last=c.name;

      F.notes=F.notes.map(n=>({...n,pc:pitchSlot(n.midi)}));

  }

  /* a chord can produce several marks, but repeated octaves share the same color */
  F.notes=F.notes.filter((n,i,a)=>a.findIndex(o=>o.pc===n.pc)===i);
  LAYOUT.prog=progress();
  if(trigger==='pitch'){LAYOUT.x=progress();LAYOUT.xs=.04;LAYOUT.band=.22}
  else if(trigger==='whole'){LAYOUT.x=.06+.88*progress();LAYOUT.xs=.05;LAYOUT.band=1;LAYOUT.size=.6}
  else{LAYOUT.x=null;LAYOUT.xs=.05;LAYOUT.band=1}
  if(trigger!=='whole')LAYOUT.size=1;
  return F;
}

/* ---------- what each trigger can honestly do, for this source ---------- */
function sourceInfo(){
  const demo=isDemo();
  switch(trigger){
    case 'notes':return {cls:'est',tag:'ESTIMATED',text:'Each note the analysis hears adds its color. The analysis estimates pitches from the sound and can be wrong with dense music.'};
    case 'pitch':return {cls:'est',tag:'ESTIMATED',text:'Lower pitches land lower, higher pitches land higher, and marks move left to right as the song plays. Pitch is estimated from the sound.'};
    case 'instruments':return demo
      ?{cls:'demo',tag:'DEMO DATA',text:'Bass, pad, pluck and bell are generated as four separate parts, so which instrument is which is known, not detected.'}
      :{cls:'na',tag:'NOT AVAILABLE',text:'Instrument identification is not available for a mixed song file. The artwork falls back to note colors until you use the demo.'};
    case 'harmony':
      if(demo&&!estimateDemo)return {cls:'demo',tag:'DEMO DATA',text:'The demo is written on Am, F, C and G, so the chord names are known. Use "Demo chords" to see what the estimator makes of the same audio.'};
      return {cls:'est',tag:'ESTIMATED',text:'Chords are guessed from the strength of each pitch class and shown only when the match is strong. They can be wrong. When unsure, marks use note colors.'};
    default:return {cls:'est',tag:'ESTIMATED',text:'One composition builds across the song, left to right, and earlier marks stay. When the song ends the final image is held and can be saved as a PNG.'};
  }
}
const DESC={
  notes:'Notes: every estimated note class adds its own color.',
  pitch:'Pitch: height and color follow how high or low each note is.',
  instruments:'Instruments: one color per instrument.',
  harmony:'Harmony: the palette follows the chord.',
  whole:'Whole Song: one finished composition for the entire piece.'};

function renderLegend(){
  const L=$('legend');L.textContent='';
  const add=(color,label)=>{const s=document.createElement('span'),i=document.createElement('i');i.style.background=color;s.append(i,label);L.append(s)};
  if(trigger==='notes'||trigger==='whole'){
    for(let k=0;k<12;k++){const pc=(k*7)%12;add(paint(pc,1,1,false),NOTE[pc])}
  }else if(trigger==='pitch'){
    const s=document.createElement('span'),i=document.createElement('i');
    i.className='bar';i.style.background='linear-gradient(90deg,'+PITCH_HUES.map(h=>'hsl('+h+',85%,52%)').join(',')+')';
    s.append('Low',i,'High');L.append(s);
  }else if(trigger==='instruments'){
    if(isDemo())for(const p in PARTS)add(paint(PARTS[p].pc,1,1,false),PARTS[p].label);
    else L.append('No instrument colors for a song file.');
  }else{
    const s=document.createElement('span');s.id='chord';s.textContent='Chord: waiting for music';L.append(s);
    if(isDemo()&&!estimateDemo)L.append('(known chords)');
  }
}
let shownChord='';
function updateChordReadout(){
  const el=$('chord');if(!el)return;
  const h=harmonyNow,key=h?h.name+h.how:'';
  if(key===shownChord)return;
  shownChord=key;
  el.textContent=h?'Chord: '+h.name+' ('+h.tones.map(p=>NOTE[p]).join(' ')+') · '+(h.how==='known'?'demo data, known':'estimate, may be wrong'):(timelineDriven()||audio.paused?'Chord: waiting for music':'Chord: unclear, showing note colors');
  if(h)el.style.color='hsl('+hueOf(h.tones[0])+',65%,38%)';
}

function renderUI(){
  const info=sourceInfo();
  description.textContent=complete?'Your painting is ready to save.':DESC[trigger]+(trigger==='whole'||style==='wc'?'':' ');
  const sg=$('suggest');
  if(sg)sg.remove();
  if(!complete&&SUGGEST[trigger]!==style){
    const b=document.createElement('button');b.id='suggest';b.type='button';b.textContent='Clearest in '+STYLE_NAME[SUGGEST[trigger]]+' · use it';
    b.style.marginLeft='8px';b.style.fontSize='.78rem';
    b.addEventListener('click',()=>{style=SUGGEST[trigger];document.querySelector('input[name=style][value='+style+']').checked=true;rebuild()});
    description.append(b);
  }
  const badge=document.createElement('span');badge.id='badge';badge.className=info.cls;badge.textContent=info.tag;
  $('source').textContent='';$('source').append(badge,info.text);
  $('inkRow').hidden=style!=='ink';
  document.querySelectorAll('input[name=mode]').forEach(i=>{i.disabled=trigger==='whole';i.checked=i.value===effectiveInk()});
  $('estimate').hidden=!(isDemo()&&trigger==='harmony');
  $('estimate').textContent='Demo chords: '+(estimateDemo?'estimated from audio':'known');
  $('estimate').setAttribute('aria-pressed',String(estimateDemo));
  renderLegend();shownChord='';updateChordReadout();
  syncUI();
}

function sizeCanvas(){
  const {width,height}=cv.getBoundingClientRect();
  W=Math.max(1,width);H=Math.max(1,height);DPR=Math.min(devicePixelRatio||1,1.5);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
}
const holds=()=>style==='wc'||trigger==='whole'||(style==='ink'&&mode==='paint');
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function syncUI(){
  play.textContent=audio.paused?(audio.ended?'Replay':started?'Resume':file?'Play song':'Play demo'):'Pause';
  $('restart').hidden=!started;$('demo').hidden=!file;save.hidden=!complete;
  const dur=isDemo()?DURATION:(audio.duration||0);
  $('clock').textContent=fmt(audio.currentTime||0)+(dur?' / '+fmt(dur):'');
  if(document.activeElement!==$('seek'))$('seek').value=dur?Math.round(1000*(audio.currentTime||0)/dur):0;
}

/* Clear the canvas and start the chosen style. The song keeps its position unless asked to start over. */
function rebuild(){
  complete=fading=false;settle=0;
  prevB?.fill(0);fluxAvg=lastOn=0;estimateReset();buildFrame.last='';
  INK.seed=7;
  const paintMode=effectiveInk()==='paint';
  INK.pigmentKeep=paintMode?1:.99;
  INK_GL.look.fade=paintMode?1:.9988;INK_GL.look.erode=paintMode?0:.0004;
  LAYOUT.hold=style==='wc'||trigger==='whole';
  LAYOUT.x=null;LAYOUT.xs=.05;LAYOUT.band=1;
  prevT=audio.currentTime||0;
  if(audio.ended){audio.currentTime=0;prevT=0;started=false}
  STYLES[style].init();
  renderUI();
}
function restart(){
  audio.pause();
  if(audio.readyState)audio.currentTime=0;
  started=false;
  rebuild();
}

function selectFile(next){
  if(fileUrl)URL.revokeObjectURL(fileUrl);
  file=next;fileUrl=file?URL.createObjectURL(file):'';
  if(fileUrl)audio.src=fileUrl;else{audio.removeAttribute('src');audio.load()}
  $('track').textContent=file?file.name:'20-second demo';$('track').title=$('track').textContent;
  restart();
}

async function togglePlayback(){
  if(!audio.paused){audio.pause();return}
  if(starting)return;
  starting=true;play.disabled=true;
  try{
    if(audio.ended)restart();
    if(!audio.getAttribute('src')){demoUrl||=buildDemo();audio.src=demoUrl}
    ensureAC();
    if(!elSrc){
      elSrc=AC.createMediaElementSource(audio);
      output=AC.createGain();output.gain.value=Number($('mute').getAttribute('aria-pressed')==='false');
      elSrc.connect(analyser);elSrc.connect(output);output.connect(AC.destination);
    }
    await audio.play();
    started=true;
  }catch(error){
    if(error.name!=='AbortError'){description.textContent='This audio could not play. Try the demo or an MP3 or WAV file.';say(description.textContent)}
  }finally{starting=false;play.disabled=false;syncUI()}
}

document.querySelectorAll('input[name=style]').forEach(i=>{i.checked=i.value===style;i.addEventListener('change',()=>{style=i.value;rebuild();say(STYLE_NAME[style]+'. The song keeps playing from where it is.')})});
document.querySelectorAll('input[name=trigger]').forEach(i=>{i.checked=i.value===trigger;i.addEventListener('change',()=>{trigger=i.value;rebuild();say(i.value+' selected. The song keeps its position.')})});
document.querySelectorAll('input[name=mode]').forEach(i=>i.addEventListener('change',()=>{mode=i.value;rebuild();say('Ink behavior changed.')}));
$('estimate').addEventListener('click',()=>{estimateDemo=!estimateDemo;rebuild()});
$('choose').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{const [f]=e.target.files;if(f)selectFile(f);e.target.value=''});
$('demo').addEventListener('click',()=>selectFile(null));
$('mute').addEventListener('click',e=>{
  const b=e.currentTarget,muted=b.getAttribute('aria-pressed')==='false';
  b.setAttribute('aria-pressed',String(muted));if(output)output.gain.value=muted?0:1;
});
$('seek').addEventListener('input',e=>{
  const dur=isDemo()?DURATION:(audio.duration||0);
  if(dur){audio.currentTime=dur*e.target.value/1000;prevT=audio.currentTime}
});
play.addEventListener('click',togglePlayback);
$('restart').addEventListener('click',()=>{restart();togglePlayback()});
for(const ev of ['play','pause','timeupdate','loadedmetadata'])audio.addEventListener(ev,syncUI);
audio.addEventListener('ended',()=>{
  if(style==='ink'){complete=effectiveInk()==='paint';fading=!complete;if(fading)INK_GL.look.fade=.9925}
  else if(holds()){settle=style==='wc'?170:1;settleDeadline=performance.now()+8000}     /* let the last washes finish drying, then hold the painting */
  renderUI();
  say(holds()?'Song ended. The painting will be held and can be saved.':'The song has ended.');
});
function downloadCanvas(name){
  cv.toBlob(blob=>{
    if(!blob)return;
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
}
save.addEventListener('click',()=>downloadCanvas('the-sound-of-color-'+style+'-'+trigger+'.png'));
$('snapshot').addEventListener('click',()=>{
  const t=Math.floor(audio.currentTime||0);
  downloadCanvas('the-sound-of-color-snapshot-'+style+'-'+trigger+'-'+Math.floor(t/60)+'m'+String(t%60).padStart(2,'0')+'s.png');
  say('Snapshot saved. The music keeps playing.');
});

let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    /* a held painting is kept as a picture; anything still in motion is redrawn at the new size */
    const keep=(complete||(style!=='ink'&&started))?document.createElement('canvas'):null;
    if(keep){keep.width=cv.width;keep.height=cv.height;keep.getContext('2d').drawImage(cv,0,0)}
    sizeCanvas();
    if(keep)g.drawImage(keep,0,0,W,H);
    else if(style==='ink')INK.resize();else STYLES[style].init();
  },120);
});

let lastFrame=0,settleDeadline=0;
function finishSettle(){complete=true;renderUI();say('Painting complete. Save it as an image.')}
function loop(now){
  requestAnimationFrame(loop);
  const ink=style==='ink',R=STYLES[style];
  if(ink){
    const interval=1000/(INK.fps||36);
    if(now-lastFrame<interval-1)return;
    lastFrame=now-(now-lastFrame)%interval;
  }
  if(complete)return;
  const playing=!audio.paused;
  if(ink&&!playing&&!fading)return;
  if(!ink&&!playing&&!settle)return;
  if(playing&&analyser){
    const F=buildFrame(now);
    R.frame(F);
    updateChordReadout();
  }else if(settle>0){
    R.frame(EMPTY);
    if(--settle===0||now>settleDeadline){settle=0;finishSettle()}
  }
  if(ink){
    INK.step(1/36);
    if(fading&&!INK.drops.length&&INK.quiet>10){fading=false;INK.init()}
  }
}

/* local experiment only: console access for testers, plus a way to push a scripted frame without audio */
window.__lab={INK,WC,SH,LAYOUT,EVENTS,CHORDS,state:()=>({style,trigger,mode,complete,source:isDemo()?'demo':'file',estimateDemo,chord:harmonyNow&&harmonyNow.name}),
  frame:F=>STYLES[style].frame(F),demoFrame,estimateChord,estimateReset,pitchSlot,buildDemoParts,sourceInfo,holds};
if(/[?&]look=glaze\b/.test(location.search))Object.assign(INK_GL.look,{dense:1.5,pale:.5,crease:.5,broad:.06});
sizeCanvas();
rebuild();
requestAnimationFrame(loop);
})();
</script>
</html>
