<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sound of Color · Three styles, triggers (local copy)</title>
<style>
  *{box-sizing:border-box}
  :root{font:13px/1.35 "Instrument Sans",system-ui,sans-serif;color:#2a2522;--paper:#faf8f5;--line:#d9d3cb;--ink:#2b1e32;--bar:46px;background:var(--paper)}
  html,body{height:100%;margin:0;overflow:hidden}
  main{position:fixed;left:0;right:0;top:0;bottom:var(--bar);overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  label,button,select{font:inherit;color:var(--ink)}
  input[type=radio],.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  :focus-visible,label:has(:focus-visible){outline:2px solid #7832a1;outline-offset:2px}
  [hidden]{display:none!important}
  #hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:calc(100% - 20px);pointer-events:none}
  #hud>*{background:#faf8f5d9;backdrop-filter:blur(6px);border-radius:10px;padding:5px 10px;box-shadow:0 1px 6px #2516301a}
  #hud:not(:has(#legend:not(:empty))) #legend,#legend:empty{display:none}
  #legend{display:flex;gap:4px 9px;align-items:center;flex-wrap:wrap;font-size:11px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;line-height:1.1}
  .chip i{width:14px;height:14px;border-radius:50%;display:block}
  .chip.row{flex-direction:row;gap:5px;font-size:11px}
  #gradbar{width:150px;height:8px;border-radius:4px}
  #source{font-size:11.5px;color:#3d343f;max-width:min(60ch,100%)}
  .badge{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;border-radius:5px;padding:0 6px;margin-right:6px}
  .badge.demo{background:#ffe9b8;color:#6a4300}.badge.est{background:#d9ecff;color:#0b4a82}.badge.na{background:#f3d6d6;color:#7a1d1d}
  #chapters{position:absolute;left:0;right:0;bottom:0;height:22px;pointer-events:none;font-size:10px;color:#4a423c}
  #chapters span{position:absolute;bottom:6px;transform:translateX(-50%);background:#faf8f5b0;border-radius:6px;padding:0 6px}
  #chapters i{position:absolute;bottom:0;width:1px;height:12px;background:#4a423c}
  #ref{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:2}
  #ref img{max-width:100%;max-height:calc(100% - 28px);object-fit:contain;border:1px solid var(--line)}
  #ref b{font-size:.8rem;color:#7a1d1d;background:#f3d6d6;border-radius:6px;padding:2px 8px}
  #bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;gap:8px;padding:5px 12px;background:#faf8f5f2;border-top:1px solid var(--line)}
  button,select{border:1px solid var(--line);border-radius:7px;background:#fff;padding:4px 9px;cursor:pointer}
  button:hover:not(:disabled){background:#f1ece5}
  button:disabled{opacity:.4;cursor:default}
  #play{width:30px;height:30px;border-radius:50%;padding:0;background:var(--ink);color:#fff;border-color:var(--ink);font-size:0}
  #play::before{font-size:12px;content:"\25B6"}
  #play.playing::before{content:"\275A\275A";letter-spacing:-2px}
  #play:disabled{opacity:.6;cursor:wait}
  .title{font:italic normal 1.25rem/1 "Instrument Serif",Georgia,serif;white-space:nowrap}
  #seek{flex:0 0 180px;width:180px;accent-color:#382343}
  #clock{font-variant-numeric:tabular-nums;color:#6b625a;white-space:nowrap;width:96px;text-align:right}
  #triggers{display:flex;border:0;margin:0 auto;padding:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  #triggers label{padding:4px 10px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
  #triggers label:last-child{border-right:0}
  #triggers label:hover{background:#f1ece5}
  #triggers label:has(:checked){background:#e5dfd6;box-shadow:inset 0 -2px 0 var(--ink)}
  #modeWrap{white-space:nowrap}
  #moreWrap{position:static}
  #more{position:fixed;right:12px;bottom:calc(var(--bar) + 8px);display:flex;flex-direction:column;gap:5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 24px #2516302a;min-width:190px;z-index:5}
  #more #track{font-size:.8rem;color:#6b625a;max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #more .note{font-style:italic;font-size:.75rem;color:#6b625a}
  #bar>*{flex-shrink:0}
  #styleSel{width:160px}#modeSel{width:140px}
  @media (max-width:1500px){.title{display:none}}
  @media (max-width:1380px){#seek{flex-basis:120px;width:120px}#triggers label{padding:4px 7px}}
  @media (max-width:1180px){#clock{display:none}}
</style>
<main>
  <canvas id="cv" role="img" aria-label="Painting made from the music"></canvas>
  <div id="hud"><div id="legend"></div><div id="source" hidden></div></div>
  <div id="chapters" hidden><i style="left:33.3%"></i><i style="left:66.6%"></i><span style="left:16.6%">Beginning</span><span style="left:50%">Middle</span><span style="left:83.3%">Ending</span></div>
  <div id="ref" hidden><b>DESIGN REFERENCE, NOT THE APP</b><img id="refimg" alt="Design reference still"></div>
</main>
<div id="lead" hidden><span id="description"></span><small id="subnote"></small></div>
<footer id="bar" aria-label="Playback and controls">
  <button type="button" id="play" aria-label="Play">Play demo</button>
  <span class="title">The Sound of Color</span>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Song position">
  <span id="clock">0:00</span>
  <fieldset id="triggers" aria-label="What drives the artwork">
    <label><input type="radio" name="trigger" value="notes" checked>Notes</label>
    <label><input type="radio" name="trigger" value="pitch">Pitch</label>
    <label><input type="radio" name="trigger" value="instruments">Instruments</label>
    <label><input type="radio" name="trigger" value="harmony">Harmony</label>
    <label><input type="radio" name="trigger" value="whole">Whole Song</label>
  </fieldset>
  <span id="modeWrap"><select id="modeSel" aria-label="Ink behavior"><option value="fade">Fade with music</option><option value="paint">Build a painting</option></select></span>
  <select id="styleSel" aria-label="Visual style"><option value="wc">Layered Watercolor</option><option value="ink">Ink Clouds</option><option value="sh" selected>Musical Shapes</option></select>
  <button type="button" id="choose">Upload song</button>
  <button type="button" id="snapshot" title="Download a PNG of the artwork right now. The music keeps playing.">Snapshot</button>
  <button type="button" id="save" disabled>Save painting</button>
  <span id="moreWrap"><button type="button" id="moreBtn" aria-expanded="false" aria-label="More">&#8943;</button>
    <div id="more" hidden>
      <span id="track">18-second demo</span>
      <button type="button" id="demo" disabled>Use demo</button>
      <button type="button" id="restart" hidden>Start over</button>
      <button type="button" id="mute" aria-pressed="false">Mute</button>
      <button type="button" id="refbtn" aria-pressed="false">Design reference</button>
      <span class="note" id="foot">Local preview</span>
    </div></span>
  <span class="sr-only" id="status" role="status"></span>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" hidden>
  <audio id="audio" preload="metadata"></audio>
</footer>
<script>
(() => {
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d'), audio=$('audio');
let W=0,H=0,DPR=1;
const NOTE=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

/* ---------- color: pitch class -> hue, walking the circle of fifths so related notes sit side by side ---------- */
const hueOf=pc=>((pc*7)%12)*30;
/* v = vividness 0..1. Low v gives a greyed, dull pigment; high v gives full neon. */
function vivid(n,F){return clamp(n.s*.55+F.bright*.35+F.energy*.25+(n.midi>72?.1:0)-(n.midi<50?.28:0))}
const yOf=m=>H*(.93-.86*clamp((m-36)/60));

/* ---------- canvas ---------- */
const INK_CPU={
  surface:document.createElement('canvas'),drops:[],time:0,lastDrop:0,quiet:0,
  init(){
    const cell=Math.max(3,Math.sqrt(W*H/29000));
    this.cols=Math.max(8,Math.round(W/cell));
    this.rows=Math.max(8,Math.round(H/cell));
    const {cols,rows}=this;
    this.surface.width=cols;this.surface.height=rows;
    this.ctx=this.surface.getContext('2d');
    this.pixels=this.ctx.createImageData(cols,rows);
    const field=()=>new Float32Array(cols*rows);
    this.u=field();this.v=field();this.uNext=field();this.vNext=field();
    this.pressure=field();this.divergence=field();this.curl=field();
    this.dye=[field(),field(),field()];this.dyeNext=[field(),field(),field()];
    this.reverse=field();
    this.drops=[];this.time=0;this.lastDrop=-2;this.quiet=0;this.wet=false;
    this.draw();
  },
  release(x,y,hue,strength=1,delay=0){
    this.drops.push({x:clamp(x,.01,.99)*this.cols,y:clamp(y,.015,.94)*this.rows,
      hue,strength,age:-delay,fall:.48,side:x<.5?1:-1});
    this.lastDrop=this.time;
    this.quiet=0;this.wet=true;
  },
  frame(F){
    if(!F||F.energy<.035||this.time-this.lastDrop<(F.onset?.28:.48))return;
    const notes=F.notes.filter(n=>n.s>.22).slice(0,4);
    for(const [i,note] of notes.entries()){
      this.release(LAYOUT.x==null?rnd(.03,.97):clamp(LAYOUT.x+rnd(-LAYOUT.xs,LAYOUT.xs),.03,.97),clamp(yOf(note.midi)/H,.08,.85),
        hueOf(note.pc),.8+note.s*.75+F.energy*.5,i*.08);
    }
  },
  deposit(drop,dt){
    const {cols,rows,u,v,dye}=this;
    const age=drop.age-drop.fall;
    const progress=clamp(age/.76);
    const fade=Math.sin(Math.PI*(.17+.83*progress));
    const scale=Math.min(cols,rows);
    const r=Math.max(2.8,scale*(.047+.039*progress)*drop.strength);
    const x=drop.x+drop.side*(progress*r*.91+Math.sin(progress*8.1)*r*.24);
    const y=drop.y+progress*scale*.14;
    const h=drop.hue/60;
    const k=n=>(n+h)%6;
    const rgb=[5,3,1].map(n=>.96-.84*Math.max(0,Math.min(k(n),4-k(n),1)));
    for(let j=Math.max(1,Math.floor(y-r*2));j<Math.min(rows-1,y+r*2);j++){
      for(let i=Math.max(1,Math.floor(x-r*2));i<Math.min(cols-1,x+r*2);i++){
        const dx=(i-x)/r,dy=(j-y)/r,d=dx*dx+dy*dy;
        if(d>4)continue;
        const p=i+j*cols,weight=Math.exp(-2.3*d)*fade;
        const amount=weight*dt*10*drop.strength;
        for(let c=0;c<3;c++)dye[c][p]=Math.min(4,dye[c][p]+amount*(1-rgb[c]));
        const ring=Math.exp(-.89*d)*fade;
        u[p]+=(drop.side*.19+dx*.41-dy*.45*drop.side)*ring*dt*21;
        v[p]+=(.65+dx*.46*drop.side+dy*.17)*ring*dt*19;
      }
    }
  },
  advect(source,target,loss,direction=1){
    const {cols,rows,u,v}=this;
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const p=x+y*cols;
      const bx=clamp(x-u[p]*direction*.28,.5,cols-1.5),by=clamp(y-v[p]*direction*.28,.5,rows-1.5);
      const ix=Math.floor(bx),iy=Math.floor(by),fx=bx-ix,fy=by-iy,b=ix+iy*cols;
      const a=source[b]+(source[b+1]-source[b])*fx;
      const c=source[b+cols]+(source[b+cols+1]-source[b+cols])*fx;
      target[p]=(a+(c-a)*fy)*loss;
    }
  },
  movePigment(source,target){
    const {cols,rows,u,v,reverse}=this;
    this.advect(source,target,1);
    this.advect(target,reverse,1,-1);
    // Recover detail lost during interpolation without adding new color peaks.
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const p=x+y*cols;
      const bx=Math.floor(clamp(x-u[p]*.28,.5,cols-1.5));
      const by=Math.floor(clamp(y-v[p]*.28,.5,rows-1.5));
      const i=bx+by*cols;
      const a=source[i],b=source[i+1],c=source[i+cols],d=source[i+cols+1];
      target[p]=clamp(target[p]+.5*(source[p]-reverse[p]),
        Math.min(a,b,c,d),Math.max(a,b,c,d))*this.pigmentKeep;
    }
  },
  moveWater(){
    const {cols,rows,u,v,pressure,divergence,curl,dye}=this;
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const i=x+y*cols;
      curl[i]=.5*(v[i+1]-v[i-1]-u[i+cols]+u[i-cols]);
    }
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const i=x+y*cols;
      const dx=Math.abs(curl[i+1])-Math.abs(curl[i-1]);
      const dy=Math.abs(curl[i+cols])-Math.abs(curl[i-cols]);
      const spin=curl[i]*.25/(Math.sqrt(dx*dx+dy*dy)+.001);
      u[i]=clamp(u[i]+dy*spin,-3,3);
      v[i]=clamp(v[i]-dx*spin+.017*Math.min(2,dye[0][i]+dye[1][i]+dye[2][i]),-3,3);
    }
    this.advect(u,this.uNext,.994);this.advect(v,this.vNext,.994);
    [this.u,this.uNext]=[this.uNext,u];[this.v,this.vNext]=[this.vNext,v];

    const nextU=this.u,nextV=this.v;
    pressure.fill(0);
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const i=x+y*cols;
      divergence[i]=.5*(nextU[i+1]-nextU[i-1]+nextV[i+cols]-nextV[i-cols]);
    }
    for(let pass=0;pass<9;pass++){
      for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
        const i=x+y*cols;
        pressure[i]=(pressure[i-1]+pressure[i+1]+pressure[i-cols]+pressure[i+cols]-divergence[i])*.25;
      }
    }
    for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
      const i=x+y*cols;
      nextU[i]-=.5*(pressure[i+1]-pressure[i-1]);
      nextV[i]-=.5*(pressure[i+cols]-pressure[i-cols]);
    }
  },
  step(dt){
    this.time+=dt;
    if(!this.wet)return;
    this.quiet+=dt;
    for(const drop of this.drops){
      drop.age+=dt;
      if(drop.age>=drop.fall)this.deposit(drop,dt);
    }
    this.drops=this.drops.filter(drop=>drop.age<drop.fall+.76);
    this.moveWater();
    for(let c=0;c<3;c++)this.movePigment(this.dye[c],this.dyeNext[c]);
    [this.dye,this.dyeNext]=[this.dyeNext,this.dye];
    if(this.quiet>75){this.wet=false;return}
    this.draw();
  },
  draw(){
    const {cols,rows,dye,pixels}=this;
    g.globalCompositeOperation='source-over';
    g.fillStyle='#fff';g.fillRect(0,0,W,H);
    if(this.lastDrop<0)return;
    const data=pixels.data;
    const [red,green,blue]=dye;
    for(let i=0;i<red.length;i++){
      const p=i*4;
      const density=red[i]+green[i]+blue[i];
      if(density<.002){
        data[p]=data[p+1]=data[p+2]=data[p+3]=255;
        continue;
      }
      const up=i>=cols?i-cols:i,left=i%cols?i-1:i;
      const relief=clamp((density-red[up]-green[up]-blue[up])*.59+
        (density-red[left]-green[left]-blue[left])*.34,-.21,.18);
      const light=1+relief*.9;
      const spread=1.25+Math.min(1,density)*.23;
      const shade=1-Math.min(.14,density*.05);
      const transmission=d=>255*Math.exp(-d*spread)*light*shade;
      data[p]=transmission(red[i]);data[p+1]=transmission(green[i]);data[p+2]=transmission(blue[i]);data[p+3]=255;
    }
    this.ctx.putImageData(pixels,0,0);
    g.imageSmoothingQuality='medium';
    g.drawImage(this.surface,0,0,W,H);
    for(const drop of this.drops){
      if(drop.age<0||drop.age>drop.fall+.22)continue;
      const x=drop.x/cols*W,y=drop.y/rows*H;
      const q=clamp(drop.age/drop.fall);
      if(q<1){
        const fall=46*(1-q*q),r=3+drop.strength*2.6;
        g.fillStyle='hsl('+drop.hue+' 86% 46%)';
        g.beginPath();g.ellipse(x,y-fall,r,r*(1.08+q*.27),0,0,Math.PI*2);g.fill();
      }else{
        const spread=clamp((drop.age-drop.fall)/.22);
        g.strokeStyle='hsl('+drop.hue+' 80% 58% / '+((1-spread)*.47)+')';
        g.lineWidth=1;
        g.beginPath();g.ellipse(x,y,5+spread*27,1+spread*5,0,0,Math.PI*2);g.stroke();
      }
    }
  },
  resize(){
    if(!this.dye||this.lastDrop<0){this.init();return}
    const {cols,rows,dye,u,v,drops,time,lastDrop,quiet,wet}=this;
    this.init();
    const sx=this.cols/cols,sy=this.rows/rows;
    for(let y=1;y<this.rows-1;y++)for(let x=1;x<this.cols-1;x++){
      const to=x+y*this.cols,from=Math.floor(x/sx)+Math.floor(y/sy)*cols;
      this.u[to]=u[from]*sx;this.v[to]=v[from]*sy;
      for(let c=0;c<3;c++)this.dye[c][to]=dye[c][from];
    }
    for(const drop of drops){drop.x*=sx;drop.y*=sy}
    Object.assign(this,{drops,time,lastDrop,quiet,wet});
    this.draw();
  }
};

/* Ink in water, Fable experiment. The same idea as the baseline (water motion carries pigment), but run on the
   graphics card: pigment is tracked at roughly 25 times the baseline's detail, each cloud is poured slowly in
   uneven pulses so it folds into sheets, and the result is lit as soft, opaque paint clouds on white water.
   Add ?ink=cpu to the address to force the baseline for comparison. */
const INK_GL={
  fps:60,drops:[],swell:[],time:0,lastDrop:-2,quiet:0,wet:false,lost:false,seed:7,key:'',gl:null,P:null,
  canvas:document.createElement('canvas'),
  /* tuning: ink poured per frame, push given to fresh ink, how long water keeps moving, how long the push
     travels with the ink, pigment fade, swirl strength, then four shading controls */
  look:{size:1.45,ink:.07,swell:2.8,puffT:2,puffGap:.75,thrust:.0003,drift:.0006,drag:.992,carry:.995,fade:.99996,erode:0,curl:.5,fine:.008,broad:.09,crease:1,dense:4.5,pale:.3},
  recent:[],
  names:['dye','dye2','tmpA','tmpB','vel','vel2','curl','div','pr','pr2','half','quarter','blurA','blurB'],
  rand(){let t=this.seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296},
  r(a,b){return a+this.rand()*(b-a)},
  /* Match the twelve note colors shown in the legend. */
  tint(h,vividness=.85){
    const hue=((h%360)+360)%360/60;
    const light=.47,saturation=.5+.5*clamp(vividness);
    const amplitude=saturation*Math.min(light,1-light);
    return [0,8,4].map(offset=>{
      const k=(offset+hue*2)%12;
      return light-amplitude*Math.max(-1,Math.min(k-3,9-k,1));
    });
  },
  boot(){
    try{
      const gl=this.canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false});
      if(!gl||!(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float')))return false;
      this.gl=gl;this.build();
      const t=this.target(4,4),ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
      gl.deleteTexture(t.tex);gl.deleteFramebuffer(t.fbo);
      if(!ok)return false;
      this.canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();this.lost=true});
      this.canvas.addEventListener('webglcontextrestored',()=>{this.lost=false;this.key='';for(const n of this.names)this[n]=null;this.build();this.init()});
      return true;
    }catch(e){console.warn('Graphics-card ink is unavailable, using the baseline.',e);return false}
  },
  build(){
    const gl=this.gl;
    const VS='#version 300 es\nout vec2 vUv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}';
        const HEAD='#version 300 es\nprecision highp float;precision highp sampler2D;in vec2 vUv;out vec4 o;\n';
    const NB='uniform vec2 uTexel;\n#define vL (vUv-vec2(uTexel.x,0.))\n#define vR (vUv+vec2(uTexel.x,0.))\n#define vT (vUv+vec2(0.,uTexel.y))\n#define vB (vUv-vec2(0.,uTexel.y))\n';
    /* read the water's motion averaged over four neighboring cells; this removes a cell-sized zigzag the solver
       can leave behind, which otherwise shows up as saw-toothed cloud edges */
    const FLOW='uniform sampler2D uVel;uniform vec2 uScale,uHalf;vec2 flow(){return .25*(texture(uVel,vUv+uHalf).xy+texture(uVel,vUv-uHalf).xy+texture(uVel,vUv+vec2(uHalf.x,-uHalf.y)).xy+texture(uVel,vUv+vec2(-uHalf.x,uHalf.y)).xy);}\n';

  }
  prevT=t;
  /* A chord can produce several clouds, but repeated octaves share the same color. */
  F.notes=F.notes.filter((n,i,a)=>a.findIndex(o=>o.pc===n.pc)===i);
  LAYOUT.prog=progress();
  if(trigger==='pitch'){LAYOUT.x=.04+.92*(((audio.currentTime||0)%16)/16);   /* a 16-second sweep, so long songs still use the full width */LAYOUT.xs=.04;LAYOUT.band=.22;LAYOUT.size=1}
  else if(trigger==='whole'){LAYOUT.x=.06+.88*LAYOUT.prog;LAYOUT.xs=.05;LAYOUT.band=1;LAYOUT.size=.6}
  else{LAYOUT.x=null;LAYOUT.xs=.05;LAYOUT.band=1;LAYOUT.size=1}
  return F;
}

function sourceInfo(){
  const demo=isDemo();
  switch(trigger){
    case 'pitch':return {cls:'est',tag:'ESTIMATED',text:'Low notes sit low, high notes sit high, moving left to right. Pitch is estimated.'};
    case 'instruments':return demo
      ?{cls:'demo',tag:'DEMO DATA',text:'Four parts generated separately, so instruments are known, not detected. Uses a separate 20-second demo.'}
      :{cls:'na',tag:'NOT AVAILABLE',text:'Instrument identification is not available for a mixed song file, so note colors are shown instead.'};
    case 'harmony':return demo
      ?{cls:'demo',tag:'DEMO DATA',text:'Demo chords are known (Am, F, C, G). The palette follows the chord.'}
      :{cls:'est',tag:'ESTIMATED',text:'Chords are estimated and named only when the match is strong. They can be wrong.'};
    case 'whole':return {cls:'est',tag:'ESTIMATED',text:'One composition builds left to right and is held at the end. Sections are generic.'};
    default:return null;
  }
}
function renderSource(){
  const el=$('source'),info=sourceInfo();
  el.hidden=!info;
  if(!info)return;
  el.textContent='';
  const b=document.createElement('span');b.className='badge '+info.cls;b.textContent=info.tag;
  el.append(b,info.text.split('. ')[0].replace(/\.$/,''));el.title=info.text;
  if(trigger==='harmony'&&harmonyNow){}
}
let shownChord='';
function updateChordReadout(){
  if(trigger!=='harmony')return;
  const h=harmonyNow,key=h?h.name+h.how:'none';
  if(key===shownChord)return;shownChord=key;
  const el=$('source'),info=sourceInfo();
  el.textContent='';
  const b=document.createElement('span');b.className='badge '+info.cls;b.textContent=info.tag;
  const L=$('legend');if(h){L.textContent='';for(const pc of h.tones)L.append(chip(pc,NOTE[pc]));L.append(h.name+(h.minor?' minor':' major'))}
  else if(L&&!L.children.length)L.textContent='Chord colors appear when the music plays';
  el.append(b,h?'Chord: '+h.name+' ('+h.tones.map(p=>NOTE[p]).join(' ')+') · '+(h.how==='known'?'known from the demo':'estimate, may be wrong'):info.text);
}
const LEAD={notes:'Each note has a color',pitch:'Higher pitch sits higher',instruments:'One color per instrument',harmony:'Chords shape the palette',whole:'A color journey across the song'};
const DEFAULTS={notes:{style:'sh',mode:'fade'},pitch:{style:'sh',mode:'fade'},instruments:{style:'ink',mode:'paint'},harmony:{style:'wc',mode:'fade'},whole:{style:'wc',mode:'paint'}};
const REFS={notes:'reference-notes.png',pitch:'02-pitch.png',instruments:'03-instruments.png',harmony:'04-harmony.png',whole:'reference-whole-song.png'};
function chip(pc,label,row){
  const c=document.createElement('div'),i=document.createElement('i');
  c.className='chip'+(row?' row':'');i.style.background=paint(pc,1,1,false);c.append(i,label);return c;
}
function renderLegend(){
  const L=$('legend');L.textContent='';L.className='';shownChord='';
  if(trigger==='notes'){for(let k=0;k<12;k++){const pc=(k*7)%12;L.append(chip(pc,NOTE[pc]))}}
  else if(trigger==='pitch'){
    const bar=document.createElement('div');bar.id='gradbar';bar.style.background='linear-gradient(90deg,'+PITCH_HUES.map(h=>'hsl('+h+',85%,52%)').join(',')+')';
    L.append('Low',bar,'High');L.style.alignItems='center';L.style.gap='10px';
  }else if(trigger==='instruments'){
    if(isDemo()){for(const p in PARTS)L.append(chip(PARTS[p].pc,PARTS[p].label,true))}
    /* for a song file the source chip already says instruments are unavailable */
  }else if(trigger==='harmony'){L.id='legend';updateChordReadout()}
  else{L.textContent='Colors move through the spectrum with time'}
  $('chapters').hidden=trigger!=='whole';
  $('foot').textContent=trigger==='whole'?'Generic sections, not detected song structure':'Local preview · '+(isDemo()?'demo audio':'your file');
}
$('seek').addEventListener('input',()=>{const dur=isDemo()?demoLength():(audio.duration||0);if(dur){audio.currentTime=dur*$('seek').value/1000;prevT=audio.currentTime}});
$('moreBtn').addEventListener('click',e=>{e.stopPropagation();const open=$('more').hidden;$('more').hidden=!open;$('moreBtn').setAttribute('aria-expanded',String(open))});
document.addEventListener('click',e=>{if(!$('moreWrap').contains(e.target)){$('more').hidden=true;$('moreBtn').setAttribute('aria-expanded','false')}});
$('refbtn').addEventListener('click',()=>{
  const on=$('ref').hidden;$('ref').hidden=!on;$('refbtn').setAttribute('aria-pressed',String(on));
  if(on)$('refimg').src='../../design-previews/'+REFS[trigger];
});
function downloadCanvas(name){
  cv.toBlob(blob=>{
    if(!blob)return;
    const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  });
}

let mode = 'fade';
let style = 'sh';
let R = INK;
/* watercolor and the ink painting mode keep everything and end as a still image; the others let go of old marks */
const keeps = () => style === 'wc' || trigger === 'whole' || (style === 'ink' && mode === 'paint');
let file = null;
let fileUrl = '';
let demoUrl = '';
let complete = false;
let started = false;
let fading = false;
let starting = false;
let output = null;
const description = $('description');
const play = $('play');
const save = $('save');
const say = message => { $('status').textContent = message; };
const duration = 18;

function buildDemo() {
  const rate = 22050;
  const samples = new Float32Array(rate * duration);
  const chords = [[57,60,64,69],[53,57,60,65],[48,55,64,67],[55,59,62,71]];
  // Separate attacks, a quiet gap, then overlapping notes to show both ink behaviors.
  for (const [section, chord] of chords.entries()) {
    for (const [voice, midi] of chord.entries()) {
      const offset = Math.round(rate * (section * 4.25 + voice * (section < 2 ? .48 : .21)));
      const length = Math.round(rate * (section === 0 ? 1.4 : 2.9));
      const frequency = 440 * 2 ** ((midi - 69) / 12);
      for (let i = 0; i < length && offset + i < samples.length; i++) {
        const progress = i / length;
        const envelope = Math.min(1, i / (rate * .028)) * (1 - progress) ** 1.8;
        const phase = 2 * Math.PI * frequency * i / rate;
        samples[offset + i] += envelope * (.16 * Math.sin(phase) + .038 * Math.sin(phase * 2));
      }
    }
  }
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const wav = new DataView(buffer);
  for (const [offset, word] of [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']]) {
    [...word].forEach((char, index) => wav.setUint8(offset + index, char.charCodeAt(0)));
  }
  wav.setUint32(4, buffer.byteLength - 8, true);
  wav.setUint32(16, 16, true);
  wav.setUint16(20, 1, true);
  wav.setUint16(22, 1, true);
  wav.setUint32(24, rate, true);
  wav.setUint32(28, rate * 2, true);
  wav.setUint16(32, 2, true);
  wav.setUint16(34, 16, true);
  wav.setUint32(40, samples.length * 2, true);
  samples.forEach((sample, index) => wav.setInt16(44 + index * 2, Math.round(clamp(sample, -1, 1) * 32767), true));
  return URL.createObjectURL(new Blob([buffer], {type:'audio/wav'}));
}

function sizeCanvas() {
  const {width, height} = cv.getBoundingClientRect();
  W = Math.max(1, width);
  H = Math.max(1, height);
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function describe() {
  description.textContent = complete ? 'Your painting is ready to save.' : LEAD[trigger];
  $('subnote').textContent = complete ? '' : style === 'wc' ? 'Layered Watercolor: each note adds a wash.'
    : style === 'sh' ? 'Musical Shapes: forms arrive with each note, then recede.'
    : effectiveMode() === 'paint' ? 'Ink Clouds: clouds stay and layer into a painting.' : 'Ink Clouds: clouds dissolve as new notes arrive.';
}

function syncUI() {
  play.textContent = audio.paused
    ? audio.ended ? 'Replay' : started ? 'Resume' : file ? 'Play song' : 'Play demo'
    : 'Pause';
  play.classList.toggle('playing', !audio.paused);
  play.setAttribute('aria-label', play.textContent);
  $('restart').hidden = !started;
  $('demo').disabled = !file;
  save.disabled = !complete;
  const dur = isDemo() ? demoLength() : (audio.duration || 0), cur = audio.currentTime || 0;
  const mmss = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
  $('clock').textContent = mmss(cur) + (dur ? ' / ' + mmss(dur) : '');
  if (document.activeElement !== $('seek')) $('seek').value = dur ? Math.round(1000 * cur / dur) : 0;
  const head = $('head'); if (head) head.style.left = (dur ? 100 * cur / dur : 0) + '%';
}

function reset() {
  audio.pause();
  if (audio.readyState) audio.currentTime = 0;
  complete = started = fading = false;
  prevB?.fill(0);
  fluxAvg = lastOn = 0;
  INK.seed = 7;
  /* each trigger may need the known-parts demo; the default Notes view keeps the preferred 18-second demo */
  if (!file && demoKind !== wantKind()) {
    demoKind = wantKind();
    if (audio.getAttribute('src')) audio.src = urlFor(demoKind);
    $('track').textContent = $('track').title = demoLabel();
  }
  prevT = 0;
  estimateReset();
  shownChord = '';
  LAYOUT.hold = trigger === 'whole';
  LAYOUT.tight = trigger === 'whole' && style === 'wc';
  LAYOUT.x = null; LAYOUT.xs = .05; LAYOUT.band = 1; LAYOUT.size = 1;
  INK.pigmentKeep = effectiveMode() === 'paint' ? 1 : .99;
  INK_GL.look.fade = effectiveMode() === 'paint' ? 1 : .9988;
  INK_GL.look.erode = effectiveMode() === 'paint' ? 0 : .0004;
  R = style === 'wc' ? WC : style === 'sh' ? SH : INK;
  $('modeWrap').style.visibility = style === 'ink' ? 'visible' : 'hidden';   /* keeps its place so the bar never moves */
  $('modeSel').value = effectiveMode();
  $('modeSel').disabled = trigger === 'whole';
  $('styleSel').value = style;
  renderSource();
  renderLegend();
  R.init();
  describe();
  syncUI();
}

function selectFile(nextFile) {
  reset();
  if (fileUrl) URL.revokeObjectURL(fileUrl);
  file = nextFile;
  fileUrl = file ? URL.createObjectURL(file) : '';
  if (fileUrl) audio.src = fileUrl;
  else {
    audio.removeAttribute('src');
    audio.load();
  }
  $('track').textContent = file ? file.name : demoLabel();
  $('track').title = $('track').textContent;
  syncUI();
}

async function togglePlayback() {
  if (!audio.paused) {
    audio.pause();
    return;
  }
  if (starting) return;
  starting = true;
  play.disabled = true;
  try {
    if (audio.ended) reset();
    if (!audio.getAttribute('src')) {
      audio.src = urlFor(demoKind);
    }
    ensureAC();
    if (!elSrc) {
      elSrc = AC.createMediaElementSource(audio);
      output = AC.createGain();
      output.gain.value = Number($('mute').getAttribute('aria-pressed') === 'false');
      elSrc.connect(analyser);
      elSrc.connect(output);
      output.connect(AC.destination);
    }
    await audio.play();
    started = true;
  } catch (error) {
    if (error.name !== 'AbortError') {
      description.textContent = 'This audio could not play. Try the demo or an MP3 or WAV file.';
      say(description.textContent);
    }
  } finally {
    starting = false;
    play.disabled = false;
    syncUI();
  }
}

$('modeSel').addEventListener('change', () => { mode = $('modeSel').value; reset(); say('Ink behavior changed. The track is ready to play from the beginning.'); });
$('styleSel').addEventListener('change', () => { style = $('styleSel').value; reset(); say('Style changed. The same track is ready to play from the beginning.'); });
document.querySelectorAll('input[name=trigger]').forEach(input => {
  input.addEventListener('change', () => {
    trigger = input.value;
    style = DEFAULTS[trigger].style;   /* each trigger opens in the style that shows it best; the selector can still change it */
    mode = DEFAULTS[trigger].mode;
    reset();
    if (!$('ref').hidden) $('refimg').src = '../../design-previews/' + REFS[trigger];
    say(TRIGGER_NAMES[trigger] + ' selected. The track is ready to play from the beginning.');
  });
});
$('snapshot').addEventListener('click', () => {
  const t = Math.floor(audio.currentTime || 0);
  downloadCanvas('the-sound-of-color-snapshot-' + style + '-' + trigger + '-' + Math.floor(t / 60) + 'm' + String(t % 60).padStart(2, '0') + 's.png');
  say('Snapshot saved. The music keeps playing.');
});
$('choose').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', event => {
  const [nextFile] = event.target.files;
  if (nextFile) selectFile(nextFile);
  event.target.value = '';
});
$('demo').addEventListener('click', () => selectFile(null));
$('mute').addEventListener('click', event => {
  const button = event.currentTarget;
  const muted = button.getAttribute('aria-pressed') === 'false';
  button.setAttribute('aria-pressed', String(muted));
  if (output) output.gain.value = muted ? 0 : 1;
});
play.addEventListener('click', togglePlayback);
$('restart').addEventListener('click', () => { reset(); togglePlayback(); });
for (const event of ['play','pause','timeupdate']) audio.addEventListener(event, syncUI);
audio.addEventListener('ended', () => {
  complete = keeps();
  fading = !complete;
  if (fading) INK_GL.look.fade = .9925;
  describe();
  syncUI();
  say(complete ? 'Painting complete. Save it as an image.' : 'The song has ended.');
});
save.addEventListener('click', () => {
  cv.toBlob(blob => {
    if (!blob) return;
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'the-sound-of-color-painting.png';
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const still = complete || style === 'wc' ? document.createElement('canvas') : null;
    if (still) {
      still.width = cv.width;
      still.height = cv.height;
      still.getContext('2d').drawImage(cv, 0, 0);
    }
    sizeCanvas();
    if (still) g.drawImage(still, 0, 0, W, H);
    else R.resize();
  }, 120);
});

let lastFrame = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const interval = 1000 / (R.fps || 36);
  if (now - lastFrame < interval - 1 || complete || (audio.paused && !fading)) return;
  lastFrame = now - (now - lastFrame) % interval;
  if (!audio.paused && analyser) {
    // A chord can produce several clouds, but repeated octaves share the same color (done inside buildFrame).
    const frame = buildFrame(now);
    window.__lastFrame = frame;   /* local test hook */
    R.frame(frame);
    updateChordReadout();
  }
  R.step(1 / 36);
  if (fading && R.idle()) {
    fading = false;
    R.init();
  }
}
/* local experiment only: lets a tester adjust the look from the browser console */
window.__inkLab = {INK, WC, SH, LAYOUT, pitchSlot, chordFrame, instrumentFrame, ORIG_CHORDS, KNOWN_CHORDS, estimateChord, estimateReset, state: () => ({style, trigger, mode, complete, demoKind}) };
/* optional second direction for review: add ?look=glaze for thinner, see-through ink that mixes where clouds overlap */
if (/[?&]look=glaze\b/.test(location.search)) Object.assign(INK_GL.look, {dense:1.5, pale:.5, crease:.5, broad:.06});
sizeCanvas();
reset();
requestAnimationFrame(loop);
})();
</script>
