<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Watercolor</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f3ec; overflow: hidden; font: 14px/1.3 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
         background: rgba(255,255,255,.86); border: 1px solid rgba(0,0,0,.12); border-radius: 999px; padding: 7px 14px; color: #223; }
  #bar button { font: inherit; border: 1px solid rgba(0,0,0,.2); background: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  #bar input { font: inherit; width: 52px; border: 1px solid rgba(0,0,0,.2); border-radius: 6px; padding: 3px 5px; }
  #prog { width: 120px; height: 5px; background: rgba(0,0,0,.12); border-radius: 3px; overflow: hidden; }
  #prog i { display: block; height: 100%; width: 0; background: #3b78c4; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #223; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ink"></canvas></div>
<div id="bar">
  <button id="play">Pause</button>
  <button id="again">Restart</button>
  <button id="fresh">New painting</button>
  <label>Length <input id="len" value="4:00" aria-label="Length of the painting, minutes and seconds"></label>
  <div id="prog"><i></i></div>
</div>
<div id="msg">This page needs WebGL 2 with float textures, which this browser does not offer.</div>
<script>
/* Living Watercolor — a painting that paints itself slowly over the length of a song.
   Address options:  ?dur=240 (seconds)  ?seed=7  ?t=0.5 (jump to that fraction and hold)  ?ui=0 (hide the buttons)
   From another page: window.watercolor.start({duration, seed}), .seek(fraction), .pause(), .play(),
                      .addStroke({x, y, color:[c,m,y], size, water}) for paint added from outside (for example by music). */
(function () {
'use strict';
const qs = new URLSearchParams(location.search);
const glc = document.getElementById('gl'), inkc = document.getElementById('ink');
const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) { document.getElementById('msg').style.display = 'flex'; return; }
if (qs.get('ui') === '0') document.getElementById('bar').style.display = 'none';

const STEPS_PER_SEC = 60;
let W = 0, H = 0, aspect = 1;

const VERT = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const NOISE = `
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s/.9375; }
`;

/* One step of the paint. Texture A = wet paint (cyan, magenta, yellow amounts + water). Texture B = paint that has dried into the paper. */
const STEP = `#version 300 es
precision highp float;
uniform sampler2D uA, uB;
uniform vec2 uTexel; uniform float uTime, uAspect;
uniform vec4 uBrush[4];      // x, y, radius, water added per step
uniform vec4 uBrushCol[4];   // pigment added per step
uniform float uDw, uDp, uEvap, uDep, uLift, uGrav, uSwirl, uOut;
in vec2 vUv;
layout(location=0) out vec4 oA; layout(location=1) out vec4 oB;
${NOISE}
void main(){
  vec2 px = vUv/uTexel;
  float h = fbm(px*0.03);          // how thirsty this patch of paper is
  float fine = vnoise(px*0.8);     // paper tooth
  float wc = texture(uA, vUv).a;
  float wl = texture(uA, vUv-vec2(uTexel.x,0.)).a, wr = texture(uA, vUv+vec2(uTexel.x,0.)).a;
  float wd = texture(uA, vUv-vec2(0.,uTexel.y)).a, wu = texture(uA, vUv+vec2(0.,uTexel.y)).a;
  vec2 grad = vec2(wr-wl, wu-wd)*0.5;
  // slow drifting currents inside the wet paint, plus gravity pulling very wet paint down the page
  vec2 q = px*0.011 + vec2(0., uTime*0.00035);
  float e = 0.6;
  vec2 curl = vec2(vnoise(q+vec2(0.,e))-vnoise(q-vec2(0.,e)), vnoise(q-vec2(e,0.))-vnoise(q+vec2(e,0.)));
  vec2 vel = curl*uSwirl*min(wc,1.2) + vec2(0.,-uGrav)*smoothstep(0.6,1.5,wc);
  vec2 base = vUv - vel*uTexel;
  float w = texture(uA, base).a;
  vec2 og = grad; float gmag = length(og); if (gmag > 0.5) og *= 0.5/gmag;
  vec3 p = texture(uA, base + uOut*og*uTexel).rgb;   // pigment is carried outward toward the wet edge
  // water creeps into dry paper; the creep is faster where the water is deep, which keeps a crisp wet edge
  float lap = wl*wl + wr*wr + wu*wu + wd*wd - 4.*wc*wc;
  w += uDw*lap*mix(0.2,1.,h);
  // wet colours bleed into each other
  vec3 pn = (texture(uA, base-vec2(uTexel.x,0.)).rgb + texture(uA, base+vec2(uTexel.x,0.)).rgb
           + texture(uA, base-vec2(0.,uTexel.y)).rgb + texture(uA, base+vec2(0.,uTexel.y)).rgb)*0.25;
  p = mix(p, pn, uDp*clamp(w,0.,1.));
  // brushes
  for (int i=0;i<4;i++){
    vec4 b = uBrush[i];
    if (b.z > 0.){
      vec2 d = (vUv-b.xy)*vec2(uAspect,1.);
      float n = fbm(px*0.045 + float(i)*7.3);
      float dist = length(d)*(0.7+0.6*n);
      float m = smoothstep(b.z, b.z*0.5, dist)*(0.55+0.45*fine);
      w += b.w*m; p += uBrushCol[i].rgb*m;
    }
  }
  w = clamp(w - uEvap*(0.6+0.8*h), 0., 2.);
  // paint settles into the paper, fastest where the water is thin (this makes the darker edges)
  vec3 dried = texture(uB, vUv).rgb;
  float thin = 1.-smoothstep(0.,0.35,w);
  float rate = uDep*(1.+5.*thin);
  if (w < 0.004) rate = 0.12;
  vec3 dep = p*min(rate,1.);
  p -= dep; dried += dep;
  // new water lifts a little dried paint back up, so colours laid on top of each other mix
  vec3 lift = dried*uLift*clamp(w,0.,1.);
  dried -= lift; p += lift;
  oA = vec4(min(p, vec3(3.)), w);
  oB = vec4(min(dried, vec3(4.)), 1.);
}`;

const SHOW = `#version 300 es
precision highp float;
uniform sampler2D uA, uB; uniform vec2 uTexel;
in vec2 vUv; out vec4 o;
${NOISE}
void main(){
  vec2 px = vUv/uTexel;
  vec4 a = texture(uA, vUv); vec3 dried = texture(uB, vUv).rgb;
  float grain = fbm(px*0.9);
  float tooth = vnoise(px*2.3);
  vec3 dens = dried*(0.72+0.56*grain) + a.rgb*0.9;
  vec3 paper = vec3(0.985,0.978,0.962) - 0.03*(tooth-0.5) - 0.02*(fbm(px*0.02)-0.5);
  // each pigment soaks up its opposite light: cyan takes red, magenta takes green, yellow takes blue
  vec3 k = vec3(dens.r*2.0 + dens.g*0.06, dens.g*1.9 + dens.r*0.2 + dens.b*0.03, dens.b*2.0 + dens.g*0.05);
  vec3 col = paper*exp(-k);
  col = mix(vec3(dot(col, vec3(0.3,0.59,0.11))), col, 1.3);   // keep the colours clear, not dusty
  col *= 1. - 0.07*smoothstep(0.02,0.6,a.a);       // wet paint looks a touch deeper
  o = vec4(col, 1.);
}`;

function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(fs) { const p = gl.createProgram(); gl.attachShader(p, shader(gl.VERTEX_SHADER, VERT)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[name] = gl.getUniformLocation(p, name); }
  return { p, u }; }
const stepP = program(STEP), showP = program(SHOW);
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

let sets = [], cur = 0;
function tex() { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, W, H, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
function makeSets() {
  for (const s of sets) { gl.deleteTexture(s.a); gl.deleteTexture(s.b); gl.deleteFramebuffer(s.f); }
  sets = [0, 1].map(() => { const a = tex(), b = tex(), f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, a, 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, b, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); return { a, b, f }; });
  cur = 0;
}
function size() {
  const cw = Math.max(200, innerWidth), ch = Math.max(200, innerHeight), long = 760;
  aspect = cw / ch;
  W = Math.round(aspect >= 1 ? long : long * aspect); H = Math.round(aspect >= 1 ? long / aspect : long);
  const dpr = Math.min(2, devicePixelRatio || 1);
  glc.width = Math.round(cw * dpr); glc.height = Math.round(ch * dpr);
  inkc.width = glc.width; inkc.height = glc.height;
}

/* ---------- the plan for the painting ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// paints as cyan / magenta / yellow amounts
const PAINTS = { blue: [1.0, 0.5, 0.0], cerulean: [0.85, 0.12, 0.05], turquoise: [0.7, 0.0, 0.28], rose: [0.0, 0.95, 0.3],
                 red: [0.0, 0.95, 0.75], orange: [0.0, 0.6, 1.0], yellow: [0.0, 0.04, 0.9], green: [0.55, 0.0, 0.85] };
let duration = Math.max(20, parseFloat(qs.get('dur')) || 240), seed = parseInt(qs.get('seed')) || 7;
let totalSteps = 0, strokes = [], extra = [], inkLines = [], step = 0, playing = true, holdAt = null, target = 0, last = 0, acc = 0;

function plan() {
  const r = rng(seed * 7919 + 13);
  totalSteps = Math.round(duration * STEPS_PER_SEC);
  const n = Math.max(14, Math.min(90, Math.round(duration / 5)));
  const scale = Math.sqrt(48 / n);
  // each painting gets a loose arrangement: a few colour "homes" that strokes gather around
  const names = ['blue', 'cerulean', 'rose', 'red', 'yellow', 'green', 'turquoise', 'orange', 'blue', 'yellow'];
  // spread the homes over the whole sheet (a loose 5 x 2 grid, shuffled) so no area stays empty
  const cells = names.map((_, i) => i).sort(() => r() - 0.5);
  const homes = names.map((c, i) => ({ c, x: (cells[i] % 5 + 0.2 + 0.6 * r()) / 5, y: (Math.floor(cells[i] / 5) + 0.15 + 0.7 * r()) / 2 }));
  strokes = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const home = homes[Math.floor(r() * homes.length)];
    const drip = r() < 0.14;
    const big = f < 0.22 || r() < 0.1;
    const rad = (big ? 0.1 + 0.07 * r() : 0.04 + 0.045 * r()) * scale;
    const len = (big ? 0.35 + 0.5 * r() : 0.15 + 0.35 * r());
    let x = home.x + (r() - 0.5) * 0.4, y = drip ? 0.7 + 0.25 * r() : home.y + (r() - 0.5) * 0.4;
    let ang = drip ? (r() - 0.5) * 0.5 + (r() < 0.5 ? 0 : Math.PI) : r() * Math.PI * 2;
    const bend = (r() - 0.5) * 3, wob = r() * 6.28, pts = [];
    for (let k = 0; k <= 48; k++) { const u = k / 48; pts.push([x, y]);
      const a = ang + bend * u + 0.35 * Math.sin(wob + u * 7);
      x += Math.cos(a) * len / 48 / aspect; y += Math.sin(a) * len / 48; }
    const steps = Math.round((big ? 420 + 380 * r() : 260 + 300 * r()));
    const dwell = Math.max(40, 2 * rad / (len / steps));
    const water = drip ? 1.95 : 1.15 + 0.5 * r();
    const load = (big ? 0.7 + 0.5 * r() : 1.0 + 0.7 * r()) * (drip ? 1.2 : 1);
    const c = PAINTS[home.c];
    strokes.push({ t0: Math.round((0.012 + 0.9 * f + (r() - 0.5) * 0.4 / n) * totalSteps), steps, pts, rad,
                   wr: water / dwell, col: c.map(v => v * load / dwell) });
  }
  // a few bundles of fine pen lines, drawn in during the second half
  inkLines = [];
  const bundles = 2 + Math.floor(r() * 2);
  for (let b = 0; b < bundles; b++) {
    const x0 = 0.15 + 0.5 * r(), y0 = 0.15 + 0.3 * r(), x3 = x0 + 0.2 + 0.4 * r(), y3 = 0.6 + 0.3 * r();
    const c1 = [x0 + 0.3 * r(), y0 + 0.1 * r()], c2 = [x3 - 0.25 * r(), y3 - 0.35 * r()];
    const count = b === 0 ? 5 : 1 + Math.floor(r() * 2), t0 = 0.42 + 0.4 * r();
    for (let k = 0; k < count; k++) { const o = k * 0.014, j = () => (r() - 0.5) * 0.02;
      inkLines.push({ p: [[x0 + o + j(), y0 - o * 0.6], [c1[0] + o * 1.5, c1[1] - o + j()], [c2[0] + o * 0.6 + j(), c2[1] - o * 1.4], [x3 + o * 0.3, y3 + j()]],
                      t0: t0 + k * 0.012, dt: 0.07 + 0.04 * r(), dot: r() < 0.5 }); }
  }
}

function runSteps(count) {
  gl.useProgram(stepP.p); gl.viewport(0, 0, W, H);
  const u = stepP.u;
  gl.uniform2f(u.uTexel, 1 / W, 1 / H); gl.uniform1f(u.uAspect, aspect);
  gl.uniform1f(u.uDw, 0.075); gl.uniform1f(u.uDp, 0.22); gl.uniform1f(u.uEvap, 0.0003); gl.uniform1f(u.uDep, 0.0016);
  gl.uniform1f(u.uLift, 0.0004); gl.uniform1f(u.uGrav, 0.11); gl.uniform1f(u.uSwirl, 0.55); gl.uniform1f(u.uOut, 0.9);
  gl.uniform1i(u.uA, 0); gl.uniform1i(u.uB, 1);
  const br = new Float32Array(16), bc = new Float32Array(16);
  for (let s = 0; s < count && step < totalSteps; s++, step++) {
    br.fill(0); bc.fill(0); let k = 0;
    for (const st of strokes) {
      if (k >= 4) break;
      const q = (step - st.t0) / st.steps;
      if (q < 0 || q >= 1) continue;
      const f = q * (st.pts.length - 1), i = Math.floor(f), m = f - i, a = st.pts[i], b = st.pts[Math.min(i + 1, st.pts.length - 1)];
      const press = Math.min(1, q * 8) * Math.min(1, (1 - q) * 6);     // brush lands and lifts gently
      br.set([a[0] + (b[0] - a[0]) * m, a[1] + (b[1] - a[1]) * m, st.rad * (0.75 + 0.25 * press), st.wr * press], k * 4);
      bc.set([st.col[0] * press, st.col[1] * press, st.col[2] * press, 0], k * 4); k++;
    }
    for (let j = extra.length - 1; j >= 0 && k < 4; j--) {
      const x = extra[j]; br.set([x.x, x.y, x.rad, x.wr], k * 4); bc.set([x.col[0], x.col[1], x.col[2], 0], k * 4); k++;
      if (--x.left <= 0) extra.splice(j, 1);
    }
    gl.uniform4fv(u.uBrush, br); gl.uniform4fv(u.uBrushCol, bc); gl.uniform1f(u.uTime, step);
    const src = sets[cur], dst = sets[1 - cur];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.a);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src.b);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cur = 1 - cur;
  }
}

function draw() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, glc.width, glc.height);
  gl.useProgram(showP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sets[cur].a);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sets[cur].b);
  gl.uniform1i(showP.u.uA, 0); gl.uniform1i(showP.u.uB, 1); gl.uniform2f(showP.u.uTexel, 1 / W, 1 / H);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // pen lines
  const c = inkc.getContext('2d'), w = inkc.width, h = inkc.height, t = step / totalSteps;
  c.clearRect(0, 0, w, h); c.lineCap = 'round'; c.strokeStyle = 'rgba(28,48,110,0.55)'; c.fillStyle = 'rgba(28,48,110,0.6)';
  c.lineWidth = Math.max(1, h / 900);
  for (const L of inkLines) {
    const q = Math.min(1, (t - L.t0) / L.dt); if (q <= 0) continue;
    c.beginPath(); let px = 0, py = 0;
    const N = 90, end = Math.round(N * q);
    for (let i = 0; i <= end; i++) { const s = i / N, m = 1 - s, P = L.p;
      px = (m*m*m*P[0][0] + 3*m*m*s*P[1][0] + 3*m*s*s*P[2][0] + s*s*s*P[3][0]) * w;
      py = (1 - (m*m*m*P[0][1] + 3*m*m*s*P[1][1] + 3*m*s*s*P[2][1] + s*s*s*P[3][1])) * h;
      if (i) c.lineTo(px, py); else c.moveTo(px, py); }
    c.stroke();
    if (L.dot && q >= 1) { c.beginPath(); c.ellipse(px, py, h / 130, h / 190, 0.4, 0, 6.3); c.stroke(); }
  }
  document.querySelector('#prog i').style.width = (100 * t).toFixed(1) + '%';
}

function frame(now) {
  requestAnimationFrame(frame);
  if (step < target) runSteps(Math.min(240, target - step));          // catching up after a jump
  else if (playing && step < totalSteps) {
    acc += Math.min(0.1, (now - last) / 1000) * STEPS_PER_SEC;
    const n = Math.floor(acc); acc -= n; if (n) runSteps(n);
  }
  last = now; draw();
}

function start(o) {
  o = o || {};
  if (o.duration) duration = Math.max(20, o.duration);
  if (o.seed != null) seed = o.seed;
  size(); makeSets(); plan(); step = 0; target = 0; acc = 0; extra = []; playing = true;
  document.getElementById('play').textContent = 'Pause';
}
function seek(f) { f = Math.max(0, Math.min(1, f)); const to = Math.round(f * totalSteps);
  if (to < step) { makeSets(); step = 0; extra = []; } target = to; }
function setPlaying(v) { playing = v; document.getElementById('play').textContent = v ? 'Pause' : 'Play'; }
function addStroke(o) {
  const rad = o.size || 0.06, n = Math.round((o.seconds || 1.5) * STEPS_PER_SEC), c = o.color || PAINTS.blue;
  extra.push({ x: o.x, y: o.y, rad, wr: (o.water || 1.1) / n, col: c.map(v => v * (o.strength || 0.8) / n), left: n });
}
window.watercolor = { start, seek, addStroke, paints: PAINTS, pause: () => setPlaying(false), play: () => setPlaying(true),
                      get progress() { return step / totalSteps; } };

document.getElementById('play').onclick = () => setPlaying(!playing);
document.getElementById('again').onclick = () => start();
document.getElementById('fresh').onclick = () => start({ seed: Math.floor(Math.random() * 100000) });
document.getElementById('len').onchange = e => { const m = e.target.value.trim().split(':');
  const s = m.length > 1 ? (+m[0]) * 60 + (+m[1]) : +m[0]; if (s > 0) start({ duration: s }); };
document.getElementById('len').value = Math.floor(duration / 60) + ':' + String(Math.round(duration % 60)).padStart(2, '0');
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const f = step / totalSteps; start(); seek(f); }, 300); });

start();
if (qs.get('t') != null) { seek(parseFloat(qs.get('t'))); setPlaying(false); }
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
